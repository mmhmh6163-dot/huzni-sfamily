<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI.Arizonan — Your AI Assistant</title>

<link rel="icon" type="image/jpeg" href="arizonan%20png%20icon.jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
body {
  background: radial-gradient(circle at 50% 0%, #0d1a2e 0%, #050a14 60%);
  padding-top:60px; padding-bottom:0;
  min-height:100vh;
}

/* ============ TOP BAR ============ */
.topbar {
  position:fixed; top:0; left:0; right:0; height:60px;
  background:rgba(10,20,35,.97); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(94,184,255,.3);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; z-index:1000; max-width:640px; margin:0 auto;
}
.topbar .back, .topbar .icon-btn {
  color:#5eb8ff; font-size:19px;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; text-decoration:none;
  background:none; border:none; cursor:pointer;
  transition: background .15s;
}
.topbar .icon-btn:hover { background:rgba(94,184,255,.1); }
.topbar .title {
  font-size:16px; font-weight:800;
  background:linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  display:flex; align-items:center; gap:8px;
}
.topbar .title img {
  width:24px; height:24px; border-radius:6px;
  -webkit-text-fill-color: initial;
}

/* ============ STATUS BADGE ============ */
.status-badge {
  position:fixed; top:70px; left:50%; transform:translateX(-50%);
  padding:6px 14px; border-radius:20px;
  font-size:11px; font-weight:700;
  z-index:999;
  display:none;
  white-space:nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
}
.status-badge.checking { display:block; background:rgba(255,178,15,.2); color:#FFB20F; border:1px solid rgba(255,178,15,.4); }
.status-badge.online   { display:block; background:rgba(0,184,148,.2);  color:#00b894; border:1px solid rgba(0,184,148,.4); }
.status-badge.offline  { display:block; background:rgba(255,118,117,.2); color:#ff7675; border:1px solid rgba(255,118,117,.4); }

/* ============ HERO ============ */
.ai-hero {
  max-width:640px; margin:0 auto;
  padding:24px 20px 16px;
  text-align:center;
}
.ai-hero .icon {
  width:70px; height:70px; border-radius:22px;
  background:linear-gradient(135deg,#5eb8ff,#7c3aed);
  display:flex; align-items:center; justify-content:center;
  font-size:32px; color:#fff;
  margin:0 auto 14px;
  box-shadow:0 0 40px rgba(94,184,255,.5);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow:0 0 40px rgba(94,184,255,.5); }
  50% { box-shadow:0 0 60px rgba(124,58,237,.7); }
}
.ai-hero h1 {
  font-size:22px; font-weight:800;
  background:linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:6px;
}
.ai-hero p { color:rgba(255,255,255,.6); font-size:13px; }

/* ============ QUICK ACTIONS ============ */
.quick-actions {
  max-width:640px; margin:16px auto;
  padding:0 16px;
  display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
}
.quick-action {
  background:rgba(94,184,255,.08);
  border:1px solid rgba(94,184,255,.25);
  border-radius:14px; padding:12px 14px;
  color:#5eb8ff; font-weight:600; font-size:12px;
  cursor:pointer; text-align:left;
  display:flex; align-items:center; gap:10px;
  transition:all .2s;
}
.quick-action:hover {
  background:rgba(94,184,255,.16);
  border-color:#5eb8ff;
  transform:translateY(-2px);
}
.quick-action i { font-size:16px; }

/* ============ CHAT AREA ============ */
.chat-area {
  max-width:640px; margin:0 auto;
  padding:0 16px 140px;
}
.chat-msg {
  display:flex; gap:10px; margin-bottom:16px;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } }
.chat-msg.user { flex-direction:row-reverse; }
.chat-msg .av {
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; color:#fff;
}
.chat-msg.bot .av { background:linear-gradient(135deg,#5eb8ff,#7c3aed); }
.chat-msg.user .av { background:var(--az-gradient); }
.chat-msg.error .av { background:rgba(255,118,117,.25); color:#ff7675; }

.chat-msg .bubble {
  max-width:78%;
  padding:12px 16px;
  border-radius:16px;
  font-size:14px; line-height:1.55;
  word-wrap:break-word;
  white-space:pre-wrap;
}
.chat-msg.bot .bubble {
  background:rgba(94,184,255,.1);
  border:1px solid rgba(94,184,255,.25);
  color:#e0f2ff;
  border-bottom-left-radius:4px;
}
.chat-msg.user .bubble {
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  border-bottom-right-radius:4px;
}
.chat-msg.error .bubble {
  background:rgba(255,118,117,.1);
  border:1px solid rgba(255,118,117,.35);
  color:#ffcbcb;
}

/* ============ TYPING INDICATOR ============ */
.typing-indicator {
  display:flex; gap:4px;
  padding:14px 16px;
  background:rgba(94,184,255,.1);
  border:1px solid rgba(94,184,255,.25);
  border-radius:16px;
  border-bottom-left-radius:4px;
  width:fit-content;
}
.typing-indicator span {
  width:6px; height:6px; border-radius:50%;
  background:#5eb8ff;
  animation: bounce 1.4s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay:.2s; }
.typing-indicator span:nth-child(3) { animation-delay:.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity:.4; }
  30% { transform: translateY(-6px); opacity:1; }
}

/* ============ INPUT ============ */
.chat-input-wrap {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  max-width:640px; width:100%;
  background:rgba(10,20,35,.98);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(94,184,255,.25);
  padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex; gap:10px;
}
.chat-input-wrap input {
  flex:1;
  padding:14px 18px;
  background:rgba(94,184,255,.06);
  border:1px solid rgba(94,184,255,.25);
  border-radius:28px;
  color:#fff; font-size:14px;
  font-family:inherit;
}
.chat-input-wrap input:focus { outline:none; border-color:#5eb8ff; }
.chat-input-wrap input:disabled { opacity:.5; }
.chat-input-wrap button {
  width:48px; height:48px; border-radius:50%;
  background:linear-gradient(135deg,#5eb8ff,#7c3aed);
  color:#fff; border:none; font-size:18px;
  cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 8px 24px rgba(94,184,255,.4);
  transition: transform .15s;
}
.chat-input-wrap button:active { transform:scale(.95); }
.chat-input-wrap button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="back"><i class="fas fa-arrow-left"></i></a>
  <span class="title"><img src="arizonan%20png%20icon.jpeg" alt=""> AI.Arizonan</span>
  <button class="icon-btn" onclick="clearChat()" title="Clear chat"><i class="fas fa-trash"></i></button>
</header>

<div class="status-badge checking" id="statusBadge">
  <i class="fas fa-circle-notch fa-spin"></i> Connecting to AI…
</div>

<div class="ai-hero">
  <div class="icon"><i class="fas fa-robot"></i></div>
  <h1>AI.Arizonan</h1>
  <p>Your personal AI assistant · ask anything</p>
</div>

<div class="quick-actions">
  <button class="quick-action" onclick="quickAsk('Give me a caption for my post')">
    <i class="fas fa-pen-fancy"></i> Caption ideas
  </button>
  <button class="quick-action" onclick="quickAsk('Suggest hashtags for my post')">
    <i class="fas fa-hashtag"></i> Hashtags
  </button>
  <button class="quick-action" onclick="quickAsk('How do I earn more on Arizona AI?')">
    <i class="fas fa-dollar-sign"></i> Earn tips
  </button>
  <button class="quick-action" onclick="quickAsk('Write a bio for my profile')">
    <i class="fas fa-user"></i> Bio writer
  </button>
</div>

<div class="chat-area" id="chatArea">
  <div class="chat-msg bot">
    <div class="av">AI</div>
    <div class="bubble">👋 Hi! I'm <strong>AI.Arizonan</strong>. I can help you write captions, suggest hashtags, generate content ideas, and more. What can I do for you?</div>
  </div>
</div>

<div class="chat-input-wrap">
  <input type="text" id="chatInput" placeholder="Ask AI.Arizonan anything…"
         onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }">
  <button id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
</div>

<script src="auth.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
let conversationHistory = [];
let isSending = false;

/* ============================================================
   SEND MESSAGE
   ============================================================ */
async function sendMessage() {
  if (isSending) return;

  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  const typingEl = showTyping();
  isSending = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('chatInput').disabled = true;

  try {
    console.log('[AI] Sending request...');

    const { data, error } = await supabaseClient.functions.invoke('ai-chat', {
      body: { messages: conversationHistory }
    });

    typingEl.remove();

    /* ============ ERROR HANDLING ============ */
    if (error) {
      console.error('[AI] Supabase function error:', error);

      let detailedError = error.message || 'Unknown error';
      let statusCode = 0;

      // Try to extract status + body from Supabase's FunctionsHttpError
      try {
        if (error.context) {
          statusCode = error.context.status || 0;
          if (typeof error.context.json === 'function') {
            const body = await error.context.json();
            detailedError = body.error || body.details || body.message || detailedError;
          } else if (error.context.text) {
            detailedError = await error.context.text();
          }
        }
      } catch (e) {
        console.warn('[AI] Could not parse error body:', e);
      }

      // Show helpful message
      let userMsg = '';

      if (statusCode === 404) {
        userMsg = '⚠️ <strong>AI service not deployed</strong><br>The Edge Function <code>ai-chat</code> was not found. Please redeploy it in Supabase.';
      } else if (statusCode === 401) {
        userMsg = '⚠️ <strong>API key issue</strong><br>Your OpenRouter API key is invalid. Please update the secret in Supabase.';
      } else if (statusCode === 402) {
        userMsg = '⚠️ <strong>Out of credits</strong><br>Top up at openrouter.ai/settings/credits';
      } else if (statusCode === 429) {
        userMsg = '⚠️ <strong>Rate limit hit</strong><br>Too many requests. Wait a moment and try again.';
      } else if (statusCode === 500) {
        userMsg = `⚠️ <strong>Server error</strong><br>${escapeHtml(detailedError)}`;
      } else {
        userMsg = `⚠️ <strong>Error</strong><br>${escapeHtml(detailedError)}`;
      }

      addMessage('error', userMsg);
      return;
    }

    /* ============ RESPONSE ERROR ============ */
    if (data && data.error) {
      console.error('[AI] Response error:', data.error);
      addMessage('error', `⚠️ ${escapeHtml(String(data.error))}`);
      return;
    }

    /* ============ SUCCESS ============ */
    const reply = data?.reply || "Sorry, I didn't get a response.";
    addMessage('bot', reply);
    conversationHistory.push({ role: 'assistant', content: reply });
    console.log('[AI] Success. Reply received.');

  } catch (err) {
    typingEl.remove();
    console.error('[AI] Unexpected error:', err);
    addMessage('error', `⚠️ <strong>Network error</strong><br>${escapeHtml(String(err))}`);
  } finally {
    isSending = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatInput').disabled = false;
    document.getElementById('chatInput').focus();
  }
}

/* ============================================================
   QUICK ACTIONS
   ============================================================ */
function quickAsk(question) {
  document.getElementById('chatInput').value = question;
  sendMessage();
}

/* ============================================================
   ADD MESSAGE
   ============================================================ */
function addMessage(who, text) {
  const area = document.getElementById('chatArea');
  const div  = document.createElement('div');
  div.className = 'chat-msg ' + who;

  let av;
  if (who === 'user') {
    av = (currentProfile?.username || currentUser?.email?.split('@')[0] || 'U').charAt(0).toUpperCase();
  } else if (who === 'error') {
    av = '<i class="fas fa-exclamation-triangle"></i>';
  } else {
    av = 'AI';
  }

  // Error messages contain HTML; user messages are escaped
  const safeText = who === 'user'
    ? escapeHtml(text).replace(/\n/g, '<br>')
    : text.replace(/\n/g, '<br>');

  div.innerHTML = `
    <div class="av">${av}</div>
    <div class="bubble">${safeText}</div>
  `;
  area.appendChild(div);

  setTimeout(() => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }, 50);
}

/* ============================================================
   TYPING INDICATOR
   ============================================================ */
function showTyping() {
  const area = document.getElementById('chatArea');
  const div  = document.createElement('div');
  div.className = 'chat-msg bot';
  div.innerHTML = `
    <div class="av">AI</div>
    <div class="typing-indicator"><span></span><span></span><span></span></div>
  `;
  area.appendChild(div);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  return div;
}

/* ============================================================
   CLEAR CHAT
   ============================================================ */
function clearChat() {
  if (!confirm('Clear the conversation?')) return;
  conversationHistory = [];
  document.getElementById('chatArea').innerHTML = `
    <div class="chat-msg bot">
      <div class="av">AI</div>
      <div class="bubble">👋 Fresh start! What can I help you with?</div>
    </div>
  `;
}

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   INIT — ping the function to check it's alive
   ============================================================ */
async function pingAI() {
  const badge = document.getElementById('statusBadge');
  try {
    const { error } = await supabaseClient.functions.invoke('ai-chat', {
      body: { messages: [{ role: 'user', content: 'ping' }] }
    });

    // If we got any response other than 404, the function is deployed
    if (error && error.context && error.context.status === 404) {
      badge.className = 'status-badge offline';
      badge.innerHTML = '<i class="fas fa-exclamation-circle"></i> AI service not deployed';
    } else {
      badge.className = 'status-badge online';
      badge.innerHTML = '<i class="fas fa-check-circle"></i> AI ready';
      setTimeout(() => { badge.style.display = 'none'; }, 2500);
    }
  } catch (e) {
    badge.className = 'status-badge offline';
    badge.innerHTML = '<i class="fas fa-exclamation-circle"></i> Connection failed';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.getElementById('chatInput').focus();
    pingAI();
  }, 500);
});
</script>
</body>
</html>
