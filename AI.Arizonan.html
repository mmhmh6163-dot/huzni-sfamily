<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI.Arizonan — Your AI Assistant</title>

<link rel="icon" type="image/jpeg" href="arizonan%20png%20icon.jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }

body {
  background: #050a14;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #fff;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
}

.app {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #050a14;
  overflow: hidden;
}

@media (min-width: 500px) {
  body { background: #01030a; }
  .app {
    border-left: 1px solid rgba(94,184,255,.15);
    border-right: 1px solid rgba(94,184,255,.15);
    box-shadow: 0 0 60px rgba(0,0,0,.6);
  }
}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar {
  height: 56px;
  flex-shrink: 0;
  padding: 0 10px;
  background: rgba(10,20,35,.98);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(94,184,255,.15);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 20;
  padding-top: env(safe-area-inset-top);
  height: calc(56px + env(safe-area-inset-top));
}
.topbar .icon-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: none;
  border: none;
  color: #5eb8ff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  flex-shrink: 0;
  transition: background .15s;
}
.topbar .icon-btn:active { background: rgba(94,184,255,.15); }
.topbar .title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.topbar .title img {
  width: 22px; height: 22px;
  border-radius: 5px;
  -webkit-text-fill-color: initial;
}
.topbar .title span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}

/* ============================================================
   MESSAGES AREA
   ============================================================ */
.messages {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 14px 12px 20px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: rgba(94,184,255,.3); border-radius: 2px; }

/* ============================================================
   MESSAGE ROWS
   ============================================================ */
.msg {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  animation: slideIn .2s ease;
  align-items: flex-end;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(6px); }
}
.msg.user { flex-direction: row-reverse; }

.msg .av {
  width: 30px; height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.msg.user .av { background: linear-gradient(135deg,#FF6B35,#FFB20F); }
.msg.bot .av { background: linear-gradient(135deg,#5eb8ff,#7c3aed); }

.msg .body {
  max-width: 82%;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.msg .bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.5;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.msg.user .bubble {
  background: linear-gradient(135deg,#FF6B35,#FFB20F);
  color: #fff;
  border-bottom-right-radius: 5px;
}
.msg.bot .bubble {
  background: rgba(94,184,255,.1);
  border: 1px solid rgba(94,184,255,.22);
  color: #e0f2ff;
  border-bottom-left-radius: 5px;
}

/* ============================================================
   MEDIA
   ============================================================ */
.msg .bubble .media {
  display: block;
  width: 100%;
  max-width: 100%;
  margin-top: 8px;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}
.msg .bubble .media img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 380px;
  object-fit: cover;
  cursor: zoom-in;
}
.msg .bubble .media video {
  display: block;
  width: 100%;
  max-height: 380px;
  background: #000;
}
.msg .bubble .media audio {
  display: block;
  width: 100%;
  min-width: 220px;
}

/* Media actions (download) */
.msg .media-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.msg .media-actions a {
  background: rgba(94,184,255,.15);
  border: 1px solid rgba(94,184,255,.35);
  color: #5eb8ff;
  border-radius: 10px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* ============================================================
   ACTIONS
   ============================================================ */
.msg .actions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.msg .actions button {
  background: transparent;
  border: 1px solid rgba(94,184,255,.2);
  color: rgba(255,255,255,.6);
  border-radius: 12px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all .15s;
}
.msg .actions button:active {
  background: rgba(94,184,255,.15);
  color: #5eb8ff;
}

/* ============================================================
   WELCOME
   ============================================================ */
.welcome {
  padding: 30px 16px 20px;
  text-align: center;
}
.welcome .icon {
  width: 72px; height: 72px;
  border-radius: 22px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: #fff;
  margin: 0 auto 16px;
  box-shadow: 0 0 50px rgba(94,184,255,.4);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 50px rgba(94,184,255,.4); }
  50% { box-shadow: 0 0 70px rgba(124,58,237,.6); }
}
.welcome h1 {
  font-size: 21px;
  font-weight: 800;
  margin: 0 0 6px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.welcome p {
  color: rgba(255,255,255,.55);
  font-size: 13px;
  margin: 0 0 22px;
  line-height: 1.5;
}
.welcome .chips {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 320px;
  margin: 0 auto;
}
.chip {
  background: rgba(94,184,255,.06);
  border: 1px solid rgba(94,184,255,.22);
  border-radius: 14px;
  padding: 12px 14px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  transition: all .15s;
}
.chip:active {
  background: rgba(94,184,255,.18);
  transform: scale(.98);
}
.chip i {
  color: #5eb8ff;
  font-size: 14px;
  width: 18px;
  text-align: center;
}

/* ============================================================
   TYPING
   ============================================================ */
.typing {
  display: flex;
  gap: 4px;
  padding: 3px 0;
}
.typing span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #5eb8ff;
  animation: bounce 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* ============================================================
   ATTACHMENT PREVIEW
   ============================================================ */
.attach-preview {
  display: none;
  padding: 8px 12px;
  background: rgba(94,184,255,.06);
  border-top: 1px solid rgba(94,184,255,.2);
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
}
.attach-preview.active { display: flex; }
.attach-preview .thumb {
  width: 44px; height: 44px;
  border-radius: 10px;
  background: #000;
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #5eb8ff;
  font-size: 18px;
}
.attach-preview .thumb img,
.attach-preview .thumb video {
  width: 100%; height: 100%;
  object-fit: cover;
}
.attach-preview .info {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: rgba(255,255,255,.75);
}
.attach-preview .info .name {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.attach-preview .info .meta {
  font-size: 11px;
  color: rgba(255,255,255,.45);
  margin-top: 2px;
}
.attach-preview .remove {
  background: transparent;
  border: none;
  color: #ff7675;
  font-size: 18px;
  cursor: pointer;
  padding: 6px 8px;
  flex-shrink: 0;
}

/* ============================================================
   INPUT BAR
   ============================================================ */
.input-wrap {
  flex-shrink: 0;
  background: rgba(10,20,35,.98);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(94,184,255,.18);
  padding: 8px 10px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}

.input-inner {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  background: rgba(94,184,255,.06);
  border: 1px solid rgba(94,184,255,.22);
  border-radius: 24px;
  padding: 3px 3px 3px 6px;
  transition: border-color .15s, box-shadow .15s;
}
.input-inner:focus-within {
  border-color: #5eb8ff;
  box-shadow: 0 0 0 3px rgba(94,184,255,.12);
}

.input-inner .icon-inline {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: #5eb8ff;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.input-inner .icon-inline:active { background: rgba(94,184,255,.15); }
.input-inner .icon-inline.recording {
  background: rgba(255,118,117,.2);
  color: #ff7675;
  animation: recPulse 1s infinite;
}
@keyframes recPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

.input-inner textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  resize: none;
  max-height: 120px;
  min-height: 22px;
  line-height: 1.4;
  padding: 8px 4px;
}
.input-inner textarea::placeholder { color: rgba(255,255,255,.4); }

.input-inner .send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  color: #fff;
  border: none;
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
}
.input-inner .send-btn:active { transform: scale(.92); }
.input-inner .send-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ============================================================
   DRAWER
   ============================================================ */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 90;
  display: none;
  opacity: 0;
  transition: opacity .2s;
}
.drawer-overlay.active { display: block; opacity: 1; }

.drawer {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 82%;
  max-width: 320px;
  background: #0a1220;
  border-right: 1px solid rgba(94,184,255,.15);
  z-index: 100;
  transform: translateX(-100%);
  transition: transform .25s ease;
  display: flex;
  flex-direction: column;
}
.drawer.open { transform: translateX(0); }

.drawer-head {
  padding: 14px;
  padding-top: calc(14px + env(safe-area-inset-top));
  border-bottom: 1px solid rgba(94,184,255,.15);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.drawer-head .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 800;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.drawer-head .brand img {
  width: 26px; height: 26px;
  border-radius: 6px;
  -webkit-text-fill-color: initial;
}
.drawer-head .new-btn {
  padding: 11px 14px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.drawer-head .new-btn:active { transform: scale(.98); }

.drawer-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.drawer-list::-webkit-scrollbar { width: 3px; }
.drawer-list::-webkit-scrollbar-thumb { background: rgba(94,184,255,.3); border-radius: 2px; }

.chat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  color: rgba(255,255,255,.75);
  margin-bottom: 2px;
  transition: background .15s;
}
.chat-item:active { background: rgba(94,184,255,.15); }
.chat-item.active {
  background: rgba(94,184,255,.15);
  color: #5eb8ff;
}
.chat-item i { color: rgba(255,255,255,.4); font-size: 13px; flex-shrink: 0; }
.chat-item.active i { color: #5eb8ff; }
.chat-item .title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-item .del {
  background: none;
  border: none;
  color: rgba(255,255,255,.3);
  cursor: pointer;
  padding: 4px;
  font-size: 12px;
  flex-shrink: 0;
}
.chat-item .del:active { color: #ff7675; }

.drawer-foot {
  padding: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(94,184,255,.15);
  font-size: 11px;
  color: rgba(255,255,255,.4);
  text-align: center;
}

/* ============================================================
   IMAGE VIEWER
   ============================================================ */
.image-viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.96);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.image-viewer.active { display: flex; }
.image-viewer img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 14px;
  object-fit: contain;
}
.image-viewer .close {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top));
  right: 16px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  color: #fff;
  border: none;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-mini {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(10,20,35,.98);
  border: 1px solid rgba(94,184,255,.4);
  color: #fff;
  padding: 10px 18px;
  border-radius: 22px;
  font-size: 13px;
  font-weight: 600;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all .25s ease;
  max-width: 90%;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
.toast-mini.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <button class="icon-btn" onclick="openDrawer()" aria-label="Menu">
      <i class="fas fa-bars"></i>
    </button>
    <div class="title">
      <img src="arizonan%20png%20icon.jpeg" alt="">
      <span id="chatTitle">AI.Arizonan</span>
    </div>
    <button class="icon-btn" onclick="startNewChat()" aria-label="New chat">
      <i class="fas fa-plus"></i>
    </button>
  </header>

  <!-- MESSAGES -->
  <div class="messages" id="messages"></div>

  <!-- ATTACHMENT PREVIEW -->
  <div class="attach-preview" id="attachPreview">
    <div class="thumb" id="attachThumb"></div>
    <div class="info">
      <div class="name" id="attachName">file.jpg</div>
      <div class="meta" id="attachSize">120 KB</div>
    </div>
    <button class="remove" onclick="clearAttachment()" aria-label="Remove">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- INPUT -->
  <div class="input-wrap">
    <div class="input-inner">
      <button class="icon-inline" onclick="pickFile()" aria-label="Attach">
        <i class="fas fa-paperclip"></i>
      </button>
      <textarea id="chatInput" rows="1" placeholder="Message AI.Arizonan…"
                oninput="autoResize(this)"
                onkeydown="handleKey(event)"></textarea>
      <button class="icon-inline" id="micBtn" onclick="toggleRecording()" aria-label="Voice">
        <i class="fas fa-microphone"></i>
      </button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">
        <i class="fas fa-arrow-up"></i>
      </button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*,video/*,audio/*" style="display:none;">
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="brand">
      <img src="arizonan%20png%20icon.jpeg" alt="">
      AI.Arizonan
    </div>
    <button class="new-btn" onclick="startNewChat()">
      <i class="fas fa-plus"></i> New Chat
    </button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
  <div class="drawer-foot">
    <i class="fas fa-shield-halved"></i> Chats saved securely
  </div>
</aside>

<!-- IMAGE VIEWER -->
<div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
  <button class="close"><i class="fas fa-times"></i></button>
  <img id="imageViewerImg" src="" alt="">
</div>

<!-- TOAST -->
<div class="toast-mini" id="toastMini"></div>

<script src="auth.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
let currentChatId    = null;
let currentChatTitle = 'AI.Arizonan';
let messages         = [];
let allChats         = [];
let isSending        = false;
let pendingFile      = null;
let pendingFileUrl   = null;
let mediaRecorder    = null;
let audioChunks      = [];
let isRecording      = false;

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(async () => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      await initChat();
    }
  }, 100);

  const fileInput = document.getElementById('fileInput');
  if (fileInput) fileInput.addEventListener('change', onFilePicked);
});

async function initChat() {
  await loadChatsList();
  await startNewChat();
  setTimeout(() => document.getElementById('chatInput').focus(), 300);
}

/* ============================================================
   DRAWER
   ============================================================ */
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('active');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('active');
}

/* ============================================================
   CHAT LIST
   ============================================================ */
async function loadChatsList() {
  if (!currentUser) return;
  try {
    const { data, error } = await supabaseClient
      .from('ai_chats')
      .select('id, title, updated_at')
      .eq('user_id', currentUser.id)
      .order('updated_at', { ascending: false })
      .limit(50);
    if (error) throw error;
    allChats = data || [];
    renderDrawerList();
  } catch (e) {
    console.warn('[AI] load chats failed:', e);
  }
}

function renderDrawerList() {
  const list = document.getElementById('drawerList');
  if (allChats.length === 0) {
    list.innerHTML = `
      <div style="text-align:center;padding:30px 12px;font-size:12px;color:rgba(255,255,255,.3);">
        <i class="far fa-comments" style="font-size:22px;display:block;margin-bottom:8px;"></i>
        No chats yet
      </div>`;
    return;
  }
  list.innerHTML = allChats.map(c => `
    <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="openChat('${c.id}')">
      <i class="far fa-comment"></i>
      <span class="title">${escapeHtml(c.title || 'New chat')}</span>
      <button class="del" onclick="event.stopPropagation(); deleteChat('${c.id}')">
        <i class="fas fa-trash"></i>
      </button>
    </div>
  `).join('');
}

/* ============================================================
   CHAT OPS
   ============================================================ */
async function startNewChat() {
  messages = [];
  currentChatId = null;
  currentChatTitle = 'AI.Arizonan';
  document.getElementById('chatTitle').textContent = 'AI.Arizonan';
  clearAttachment();
  renderWelcome();
  renderDrawerList();
  closeDrawer();
  setTimeout(() => document.getElementById('chatInput').focus(), 200);
}

async function openChat(chatId) {
  if (!currentUser) return;
  try {
    const { data: chat } = await supabaseClient
      .from('ai_chats').select('*').eq('id', chatId).single();
    const { data: msgs } = await supabaseClient
      .from('ai_messages').select('*').eq('chat_id', chatId)
      .order('created_at', { ascending: true });

    currentChatId = chatId;
    currentChatTitle = chat?.title || 'Chat';
    document.getElementById('chatTitle').textContent = currentChatTitle;

    messages = (msgs || []).map(m => ({
      role: m.role,
      content: m.content,
      media_url: m.media_url || null,
      media_type: m.media_type || null
    }));

    renderMessages();
    closeDrawer();
    renderDrawerList();
  } catch (e) { console.error(e); }
}

async function deleteChat(chatId) {
  if (!confirm('Delete this chat?')) return;
  try {
    await supabaseClient.from('ai_chats').delete().eq('id', chatId).eq('user_id', currentUser.id);
    allChats = allChats.filter(c => c.id !== chatId);
    if (currentChatId === chatId) startNewChat();
    renderDrawerList();
  } catch (e) { console.error(e); }
}

async function createChatIfNeeded(firstMessage) {
  if (currentChatId) return currentChatId;
  const title = (firstMessage || 'New chat').slice(0, 40);
  const { data, error } = await supabaseClient
    .from('ai_chats')
    .insert({ user_id: currentUser.id, title })
    .select().single();
  if (error) throw error;
  currentChatId = data.id;
  currentChatTitle = title;
  document.getElementById('chatTitle').textContent = title;
  await loadChatsList();
  return currentChatId;
}

/* ============================================================
   RENDER
   ============================================================ */
function renderWelcome() {
  document.getElementById('messages').innerHTML = `
    <div class="welcome">
      <div class="icon"><i class="fas fa-robot"></i></div>
      <h1>Hi, I'm AI.Arizonan</h1>
      <p>Your AI assistant. I can chat, draw images, create videos, and compose music — just ask!</p>
      <div class="chips">
        <button class="chip" onclick="quickAsk('Draw a sunset over a desert with a tall cactus')">
          <i class="fas fa-image"></i> Draw an image
        </button>
        <button class="chip" onclick="quickAsk('Create a video of ocean waves at sunrise')">
          <i class="fas fa-video"></i> Create a video
        </button>
        <button class="chip" onclick="quickAsk('Create an upbeat electronic music track')">
          <i class="fas fa-music"></i> Make music
        </button>
        <button class="chip" onclick="quickAsk('Write a caption for my post')">
          <i class="fas fa-pen-fancy"></i> Write a caption
        </button>
      </div>
    </div>
  `;
}

function renderMessages() {
  const container = document.getElementById('messages');
  if (messages.length === 0) { renderWelcome(); return; }
  container.innerHTML = '';
  messages.forEach((m, i) => container.appendChild(createMessageEl(m, i)));
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 60);
}

function createMessageEl(msg, index) {
  const isUser = msg.role === 'user';
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'user' : 'bot');

  const avText = isUser
    ? (currentProfile?.username || currentUser?.email?.split('@')[0] || 'U').charAt(0).toUpperCase()
    : 'AI';

  let mediaHtml = '';
  let mediaActions = '';
  if (msg.media_url) {
    const url = escapeHtml(msg.media_url);
    if (msg.media_type === 'image') {
      mediaHtml = `<div class="media"><img src="${url}" alt="" loading="lazy" onclick="viewImage('${url}')"></div>`;
      mediaActions = `<div class="media-actions"><a href="${url}" download="arizona-ai-image.png" target="_blank"><i class="fas fa-download"></i> Download</a></div>`;
    } else if (msg.media_type === 'video') {
      mediaHtml = `<div class="media"><video src="${url}" controls playsinline preload="metadata"></video></div>`;
      mediaActions = `<div class="media-actions"><a href="${url}" download="arizona-ai-video.mp4" target="_blank"><i class="fas fa-download"></i> Download</a></div>`;
    } else if (msg.media_type === 'audio') {
      mediaHtml = `<div class="media"><audio src="${url}" controls preload="metadata"></audio></div>`;
      mediaActions = `<div class="media-actions"><a href="${url}" download="arizona-ai-audio.mp3" target="_blank"><i class="fas fa-download"></i> Download</a></div>`;
    }
  }

  const textContent = msg.content
    ? escapeHtml(msg.content).replace(/\n/g, '<br>')
    : '';

  const bubbleContent = textContent + mediaHtml;

  div.innerHTML = `
    <div class="av">${avText}</div>
    <div class="body">
      <div class="bubble">${bubbleContent || '<em style="opacity:.5;">…</em>'}</div>
      ${mediaActions}
      ${!isUser ? `
        <div class="actions">
          <button onclick="copyMessage(${index})"><i class="fas fa-copy"></i> Copy</button>
          <button onclick="regenerate(${index})"><i class="fas fa-rotate"></i> Regenerate</button>
        </div>
      ` : ''}
    </div>
  `;
  return div;
}

/* ============================================================
   FILE PICKER
   ============================================================ */
function pickFile() {
  document.getElementById('fileInput').click();
}

function onFilePicked(event) {
  const file = event.target.files[0];
  if (!file) return;

  const maxMB = 25;
  if (file.size > maxMB * 1024 * 1024) {
    toast(`File must be under ${maxMB} MB`);
    event.target.value = '';
    return;
  }

  pendingFile = file;
  pendingFileUrl = URL.createObjectURL(file);

  const preview = document.getElementById('attachPreview');
  const thumb = document.getElementById('attachThumb');
  const nameEl = document.getElementById('attachName');
  const sizeEl = document.getElementById('attachSize');

  let type = 'file';
  let icon = '<i class="fas fa-file"></i>';
  if (file.type.startsWith('image/')) {
    type = 'image';
    icon = `<img src="${pendingFileUrl}" alt="">`;
  } else if (file.type.startsWith('video/')) {
    type = 'video';
    icon = `<video src="${pendingFileUrl}" muted></video>`;
  } else if (file.type.startsWith('audio/')) {
    type = 'audio';
    icon = '<i class="fas fa-music"></i>';
  }

  thumb.innerHTML = icon;
  nameEl.textContent = file.name;
  sizeEl.textContent = `${type} · ${(file.size / 1024).toFixed(0)} KB`;
  preview.classList.add('active');
  document.getElementById('fileInput').value = '';
}

function clearAttachment() {
  pendingFile = null;
  if (pendingFileUrl) { URL.revokeObjectURL(pendingFileUrl); pendingFileUrl = null; }
  document.getElementById('attachPreview').classList.remove('active');
}

/* ============================================================
   VOICE RECORDING
   ============================================================ */
async function toggleRecording() {
  const btn = document.getElementById('micBtn');

  if (isRecording) {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('recording');
    btn.innerHTML = '<i class="fas fa-microphone"></i>';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const file = new File([blob], `voice-${Date.now()}.webm`, { type: 'audio/webm' });
      pendingFile = file;
      pendingFileUrl = URL.createObjectURL(file);

      document.getElementById('attachThumb').innerHTML = '<i class="fas fa-music"></i>';
      document.getElementById('attachName').textContent = file.name;
      document.getElementById('attachSize').textContent = `audio · ${(file.size / 1024).toFixed(0)} KB`;
      document.getElementById('attachPreview').classList.add('active');

      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    isRecording = true;
    btn.classList.add('recording');
    btn.innerHTML = '<i class="fas fa-stop"></i>';
    toast('Recording… tap again to stop');
  } catch (e) {
    console.error('[Voice] Error:', e);
    toast('Microphone access denied');
  }
}

/* ============================================================
   SEND MESSAGE
   ============================================================ */
async function sendMessage() {
  if (isSending) return;

  const input = document.getElementById('chatInput');
  const text = input.value.trim();

  if (!text && !pendingFile) return;

  let mediaUrl = null;
  let mediaType = null;

  // Upload file if present
  if (pendingFile && pendingFile instanceof File && currentUser) {
    try {
      const ext = (pendingFile.name.split('.').pop() || 'bin').toLowerCase();
      const path = `${currentUser.id}/ai-${Date.now()}.${ext}`;

      const { data: upload, error: upErr } = await supabaseClient.storage
        .from('ai_uploads')
        .upload(path, pendingFile, { cacheControl: '3600' });

      if (upErr) throw upErr;

      const { data: urlData } = supabaseClient.storage
        .from('ai_uploads')
        .getPublicUrl(upload.path);

      mediaUrl = urlData.publicUrl;
      mediaType = pendingFile.type.startsWith('image/') ? 'image'
                : pendingFile.type.startsWith('video/') ? 'video'
                : pendingFile.type.startsWith('audio/') ? 'audio'
                : null;
    } catch (e) {
      console.error('[Upload] Error:', e);
      toast('Upload failed');
      return;
    }
  }

  input.value = '';
  autoResize(input);

  const userMsg = { role: 'user', content: text || '', media_url: mediaUrl, media_type: mediaType };
  messages.push(userMsg);
  clearAttachment();

  // Save user message
  try {
    await createChatIfNeeded(text || `[${mediaType || 'file'}]`);
    await supabaseClient.from('ai_messages').insert({
      chat_id: currentChatId,
      role: 'user',
      content: text || '',
      media_url: mediaUrl,
      media_type: mediaType
    });
  } catch (e) { console.warn('[AI] save user msg failed:', e); }

  renderMessages();

  // Typing indicator
  const container = document.getElementById('messages');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg bot';
  typingEl.innerHTML = `
    <div class="av">AI</div>
    <div class="body"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>
  `;
  container.appendChild(typingEl);
  container.scrollTop = container.scrollHeight;

  isSending = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    const payloadMessages = messages.map(m => ({ role: m.role, content: m.content || '' }));

    const { data, error } = await supabaseClient.functions.invoke('ai-chat', {
      body: { messages: payloadMessages }
    });

    typingEl.remove();

    if (error || (!data?.reply && !data?.image_url)) {
      console.error('[AI] Error:', error, data);
      messages.push({ role: 'assistant', content: '⚠️ Something went wrong. Please try again.' });
      renderMessages();
      return;
    }

    const assistantMsg = {
      role: 'assistant',
      content: data.reply || '',
      media_url: data.image_url || null,
      media_type: data.media_type || (data.image_url ? 'image' : null)
    };
    messages.push(assistantMsg);

    if (currentUser) {
      try {
        await supabaseClient.from('ai_messages').insert({
          chat_id: currentChatId,
          role: 'assistant',
          content: data.reply || '',
          media_url: data.image_url || null,
          media_type: data.media_type || (data.image_url ? 'image' : null)
        });
      } catch (e) { console.warn('[AI] save assistant msg failed:', e); }
    }

    renderMessages();
  } catch (e) {
    typingEl.remove();
    console.error(e);
    messages.push({ role: 'assistant', content: '⚠️ Network error. Please try again.' });
    renderMessages();
  } finally {
    isSending = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatInput').focus();
    container.scrollTop = container.scrollHeight;
  }
}

/* ============================================================
   MESSAGE ACTIONS
   ============================================================ */
function copyMessage(index) {
  const msg = messages[index];
  if (!msg) return;
  navigator.clipboard.writeText(msg.content || '').then(() => toast('Copied ✅'));
}

async function regenerate(index) {
  messages = messages.slice(0, index);
  renderMessages();
  const lastUser = [...messages].reverse().find(m => m.role === 'user');
  if (lastUser) {
    const idx = messages.indexOf(lastUser);
    messages = messages.slice(0, idx);
    renderMessages();
    document.getElementById('chatInput').value = lastUser.content || '';
    await sendMessage();
  }
}

/* ============================================================
   IMAGE VIEWER
   ============================================================ */
function viewImage(url) {
  document.getElementById('imageViewerImg').src = url;
  document.getElementById('imageViewer').classList.add('active');
}
function closeImageViewer() {
  document.getElementById('imageViewer').classList.remove('active');
}

/* ============================================================
   INPUT HELPERS
   ============================================================ */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function quickAsk(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg) {
  const el = document.getElementById('toastMini');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ============================================================
   UTILS
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
