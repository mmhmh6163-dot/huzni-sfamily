<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI.Arizonan — Your AI Assistant</title>

<link rel="icon" type="image/jpeg" href="arizonan%20png%20icon.jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
* { box-sizing: border-box; }

body {
  background: #050a14;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

/* ==================== LAYOUT ==================== */
.app-layout {
  display: flex;
  height: 100vh;
  max-width: 1400px;
  margin: 0 auto;
}

/* ==================== SIDEBAR ==================== */
.sidebar {
  width: 260px;
  background: #0a1220;
  border-right: 1px solid rgba(94,184,255,.15);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 14px 12px;
  border-bottom: 1px solid rgba(94,184,255,.15);
}

.new-chat-btn {
  width: 100%;
  padding: 11px 14px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform .15s;
}
.new-chat-btn:active { transform: scale(.98); }

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-thumb { background: rgba(94,184,255,.3); border-radius: 2px; }

.chat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: rgba(255,255,255,.75);
  margin-bottom: 2px;
  transition: background .15s;
  position: relative;
}
.chat-item:hover { background: rgba(94,184,255,.08); }
.chat-item.active { background: rgba(94,184,255,.15); color: #5eb8ff; }
.chat-item i { color: rgba(255,255,255,.4); font-size: 12px; flex-shrink: 0; }
.chat-item.active i { color: #5eb8ff; }
.chat-item .title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-item .delete-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,.3);
  cursor: pointer;
  padding: 4px;
  opacity: 0;
  transition: opacity .15s;
}
.chat-item:hover .delete-btn { opacity: 1; }
.chat-item .delete-btn:hover { color: #ff7675; }

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid rgba(94,184,255,.15);
  font-size: 11px;
  color: rgba(255,255,255,.4);
  text-align: center;
}

/* ==================== MAIN CHAT ==================== */
.main-chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #050a14;
  min-width: 0;
}

.chat-topbar {
  height: 60px;
  padding: 0 16px;
  background: rgba(10,20,35,.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(94,184,255,.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.chat-topbar .menu-btn {
  display: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: none;
  border: none;
  color: #5eb8ff;
  font-size: 18px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
.chat-topbar .title {
  font-size: 15px;
  font-weight: 800;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.chat-topbar .title img {
  width: 24px; height: 24px; border-radius: 6px;
  -webkit-text-fill-color: initial;
}
.chat-topbar .title span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-topbar .icon-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: none;
  border: none;
  color: #5eb8ff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: background .15s;
}
.chat-topbar .icon-btn:hover { background: rgba(94,184,255,.1); }

/* Messages */
.messages-scroll {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
  padding-bottom: 30px;
}
.messages-scroll::-webkit-scrollbar { width: 6px; }
.messages-scroll::-webkit-scrollbar-thumb { background: rgba(94,184,255,.3); border-radius: 3px; }

/* Welcome screen */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  padding: 40px 20px;
  text-align: center;
}
.welcome .icon {
  width: 80px; height: 80px;
  border-radius: 24px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  color: #fff;
  margin-bottom: 20px;
  box-shadow: 0 0 60px rgba(94,184,255,.4);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 60px rgba(94,184,255,.4); }
  50% { box-shadow: 0 0 80px rgba(124,58,237,.6); }
}
.welcome h1 {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 8px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.welcome p {
  color: rgba(255,255,255,.5);
  font-size: 14px;
  margin-bottom: 32px;
}

/* Suggestion cards */
.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 560px;
  width: 100%;
}
.suggestion {
  background: rgba(94,184,255,.05);
  border: 1px solid rgba(94,184,255,.2);
  border-radius: 12px;
  padding: 14px 16px;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: all .2s;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.suggestion:hover {
  background: rgba(94,184,255,.12);
  border-color: #5eb8ff;
  transform: translateY(-2px);
}
.suggestion i {
  color: #5eb8ff;
  font-size: 16px;
}
.suggestion .label { font-weight: 700; }
.suggestion .desc { color: rgba(255,255,255,.5); font-size: 11px; }

/* Message bubbles */
.msg {
  padding: 16px 20px;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  gap: 14px;
  animation: slideIn .25s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(6px); }
}
.msg.user { flex-direction: row-reverse; }
.msg .av {
  width: 34px; height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  color: #fff;
}
.msg.user .av { background: linear-gradient(135deg,#FF6B35,#FFB20F); }
.msg.bot .av { background: linear-gradient(135deg,#5eb8ff,#7c3aed); }

.msg .content {
  flex: 1;
  min-width: 0;
  font-size: 14.5px;
  line-height: 1.7;
  color: #e0f2ff;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.msg.user .content {
  background: rgba(255,255,255,.06);
  padding: 10px 14px;
  border-radius: 14px;
  border-top-right-radius: 4px;
  color: #fff;
  white-space: pre-wrap;
}
.msg.bot .content {
  padding: 4px 0;
}

.msg .actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.msg .actions button {
  background: transparent;
  border: 1px solid rgba(94,184,255,.25);
  color: rgba(255,255,255,.6);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all .15s;
}
.msg .actions button:hover {
  background: rgba(94,184,255,.1);
  color: #5eb8ff;
  border-color: #5eb8ff;
}

/* Typing indicator */
.typing {
  display: flex;
  gap: 4px;
  padding: 6px 0;
}
.typing span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #5eb8ff;
  animation: bounce 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity:.4; }
  30% { transform: translateY(-6px); opacity:1; }
}

/* ==================== INPUT BAR ==================== */
.input-wrap {
  padding: 12px 16px 20px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  background: #050a14;
  flex-shrink: 0;
}
.input-inner {
  max-width: 720px;
  margin: 0 auto;
  background: rgba(94,184,255,.06);
  border: 1px solid rgba(94,184,255,.25);
  border-radius: 24px;
  padding: 8px 8px 8px 18px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  transition: border-color .15s;
}
.input-inner:focus-within {
  border-color: #5eb8ff;
  box-shadow: 0 0 20px rgba(94,184,255,.15);
}
.input-inner textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  resize: none;
  max-height: 200px;
  min-height: 24px;
  line-height: 1.5;
  padding: 6px 0;
}
.input-inner textarea::placeholder { color: rgba(255,255,255,.4); }
.input-inner button {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  color: #fff;
  border: none;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s;
}
.input-inner button:active { transform: scale(.95); }
.input-inner button:disabled { opacity: .4; cursor: not-allowed; }

.input-hint {
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,.3);
  margin-top: 8px;
}

/* ==================== MOBILE OVERLAY ==================== */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 99;
}
.sidebar-overlay.active { display: block; }

/* ==================== RESPONSIVE ==================== */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    transform: translateX(-100%);
    transition: transform .25s ease;
    width: 280px;
  }
  .sidebar.open { transform: translateX(0); }
  .chat-topbar .menu-btn { display: flex; }
  .suggestions { grid-template-columns: 1fr; }
  .msg { padding: 12px 16px; }
  .msg .content { font-size: 14px; }
}
</style>
</head>
<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="startNewChat()">
        <i class="fas fa-plus"></i> New Chat
      </button>
    </div>
    <div class="sidebar-list" id="chatsList"></div>
    <div class="sidebar-footer">
      <i class="fas fa-robot"></i> AI.Arizonan · v1.0
    </div>
  </aside>

  <!-- OVERLAY FOR MOBILE -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- MAIN CHAT -->
  <main class="main-chat">

    <div class="chat-topbar">
      <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="title">
        <img src="arizonan%20png%20icon.jpeg" alt="">
        <span id="chatTitle">AI.Arizonan</span>
      </div>
      <button class="icon-btn" onclick="startNewChat()" title="New chat"><i class="fas fa-plus"></i></button>
    </div>

    <div class="messages-scroll" id="messagesScroll">
      <!-- Welcome / Messages injected here -->
    </div>

    <div class="input-wrap">
      <div class="input-inner">
        <textarea id="chatInput" rows="1" placeholder="Message AI.Arizonan…"
                  oninput="autoResize(this)"
                  onkeydown="handleKey(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
      </div>
      <div class="input-hint">
        <i class="fas fa-info-circle"></i> AI can make mistakes. Verify important info.
      </div>
    </div>
  </main>
</div>

<script src="auth.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
let currentChatId    = null;
let currentChatTitle = 'AI.Arizonan';
let messages         = [];
let isSending        = false;
let allChats         = [];

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', async () => {
  const check = setInterval(async () => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      await initChat();
    }
  }, 100);
});

async function initChat() {
  if (!currentUser) {
    // Show welcome without chat history
    renderWelcome();
    return;
  }
  await loadChatsList();
  await startNewChat();
  setTimeout(() => document.getElementById('chatInput').focus(), 300);
}

/* ============================================================
   SIDEBAR / CHAT LIST
   ============================================================ */
async function loadChatsList() {
  if (!currentUser) return;
  try {
    const { data, error } = await supabaseClient
      .from('ai_chats')
      .select('id, title, updated_at')
      .eq('user_id', currentUser.id)
      .order('updated_at', { ascending: false })
      .limit(50);

    if (error) throw error;
    allChats = data || [];
    renderChatsList();
  } catch (e) {
    console.warn('[AI] Could not load chats:', e);
  }
}

function renderChatsList() {
  const list = document.getElementById('chatsList');
  if (allChats.length === 0) {
    list.innerHTML = `
      <div style="text-align:center; padding:20px 12px; font-size:12px; color:rgba(255,255,255,.3);">
        <i class="far fa-comments" style="font-size:20px; display:block; margin-bottom:8px;"></i>
        No chats yet
      </div>`;
    return;
  }
  list.innerHTML = allChats.map(c => `
    <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="openChat('${c.id}')">
      <i class="far fa-comment"></i>
      <span class="title">${escapeHtml(c.title || 'New chat')}</span>
      <button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${c.id}')" title="Delete">
        <i class="fas fa-trash"></i>
      </button>
    </div>
  `).join('');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}

/* ============================================================
   CHAT OPERATIONS
   ============================================================ */
async function startNewChat() {
  messages = [];
  currentChatId = null;
  currentChatTitle = 'AI.Arizonan';
  document.getElementById('chatTitle').textContent = 'AI.Arizonan';
  renderWelcome();
  renderChatsList();
  closeSidebar();
  setTimeout(() => document.getElementById('chatInput').focus(), 200);
}

async function openChat(chatId) {
  if (!currentUser) return;
  try {
    const { data: chat } = await supabaseClient
      .from('ai_chats').select('*').eq('id', chatId).single();
    const { data: msgs } = await supabaseClient
      .from('ai_messages').select('*').eq('chat_id', chatId)
      .order('created_at', { ascending: true });

    currentChatId = chatId;
    currentChatTitle = chat?.title || 'Chat';
    document.getElementById('chatTitle').textContent = currentChatTitle;

    messages = (msgs || []).map(m => ({ role: m.role, content: m.content }));
    renderMessages();
    closeSidebar();
    renderChatsList();
  } catch (e) {
    console.error('[AI] openChat error:', e);
  }
}

async function deleteChat(chatId) {
  if (!confirm('Delete this chat?')) return;
  try {
    await supabaseClient.from('ai_chats').delete().eq('id', chatId).eq('user_id', currentUser.id);
    allChats = allChats.filter(c => c.id !== chatId);
    if (currentChatId === chatId) startNewChat();
    renderChatsList();
  } catch (e) { console.error(e); }
}

async function createChatIfNeeded(firstMessage) {
  if (currentChatId) return currentChatId;

  const title = firstMessage.slice(0, 40) + (firstMessage.length > 40 ? '…' : '');

  const { data, error } = await supabaseClient
    .from('ai_chats')
    .insert({ user_id: currentUser.id, title })
    .select()
    .single();

  if (error) throw error;

  currentChatId = data.id;
  currentChatTitle = title;
  document.getElementById('chatTitle').textContent = title;
  await loadChatsList();
  return currentChatId;
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderWelcome() {
  const scroll = document.getElementById('messagesScroll');
  scroll.innerHTML = `
    <div class="welcome">
      <div class="icon"><i class="fas fa-robot"></i></div>
      <h1>Hi, I'm AI.Arizonan</h1>
      <p>Your AI assistant for content, captions, ideas and anything else.</p>

      <div class="suggestions">
        <button class="suggestion" onclick="quickAsk('Give me a caption for my post')">
          <i class="fas fa-pen-fancy"></i>
          <span class="label">Write a caption</span>
          <span class="desc">for a social media post</span>
        </button>
        <button class="suggestion" onclick="quickAsk('Suggest hashtags for a post about my new product')">
          <i class="fas fa-hashtag"></i>
          <span class="label">Suggest hashtags</span>
          <span class="desc">that boost engagement</span>
        </button>
        <button class="suggestion" onclick="quickAsk('How do I earn money on Arizona AI?')">
          <i class="fas fa-dollar-sign"></i>
          <span class="label">How to earn</span>
          <span class="desc">on Arizona AI</span>
        </button>
        <button class="suggestion" onclick="quickAsk('Write a short bio for my profile')">
          <i class="fas fa-user"></i>
          <span class="label">Write my bio</span>
          <span class="desc">for my profile</span>
        </button>
      </div>
    </div>
  `;
}

function renderMessages() {
  const scroll = document.getElementById('messagesScroll');
  if (messages.length === 0) {
    renderWelcome();
    return;
  }

  scroll.innerHTML = '';
  messages.forEach((m, i) => scroll.appendChild(createMessageEl(m, i)));

  // Scroll to bottom
  setTimeout(() => { scroll.scrollTop = scroll.scrollHeight; }, 50);
}

function createMessageEl(msg, index) {
  const isUser = msg.role === 'user';
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'user' : 'bot');

  const avText = isUser
    ? (currentProfile?.username || currentUser?.email?.split('@')[0] || 'U').charAt(0).toUpperCase()
    : 'AI';

  const safeContent = escapeHtml(msg.content).replace(/\n/g, '<br>');

  div.innerHTML = `
    <div class="av">${avText}</div>
    <div class="content">
      ${safeContent}
      ${!isUser ? `
        <div class="actions">
          <button onclick="copyMessage(${index})">
            <i class="fas fa-copy"></i> Copy
          </button>
          <button onclick="regenerate(${index})">
            <i class="fas fa-rotate"></i> Regenerate
          </button>
        </div>
      ` : ''}
    </div>
  `;
  return div;
}

/* ============================================================
   SEND MESSAGE
   ============================================================ */
async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);

  const isFirstMessage = messages.length === 0;

  // Add user message locally
  messages.push({ role: 'user', content: text });

  // Save to DB (create chat if needed)
  if (currentUser) {
    try {
      await createChatIfNeeded(text);
      await supabaseClient.from('ai_messages').insert({
        chat_id: currentChatId,
        role: 'user',
        content: text
      });
    } catch (e) { console.warn('[AI] Could not save user message:', e); }
  }

  renderMessages();

  // Show typing
  const scroll = document.getElementById('messagesScroll');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg bot';
  typingEl.innerHTML = `
    <div class="av">AI</div>
    <div class="content"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  scroll.appendChild(typingEl);
  scroll.scrollTop = scroll.scrollHeight;

  isSending = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('chatInput').disabled = true;

  try {
    const { data, error } = await supabaseClient.functions.invoke('ai-chat', {
      body: { messages: messages.map(m => ({ role: m.role, content: m.content })) }
    });

    typingEl.remove();

    if (error || !data?.reply) {
      console.error('[AI] Error:', error, data);
      messages.push({ role: 'assistant', content: '⚠️ Something went wrong. Please try again.' });
      renderMessages();
      return;
    }

    // Add assistant message
    messages.push({ role: 'assistant', content: data.reply });

    // Save to DB
    if (currentUser) {
      try {
        await supabaseClient.from('ai_messages').insert({
          chat_id: currentChatId,
          role: 'assistant',
          content: data.reply
        });
      } catch (e) { console.warn('[AI] Could not save assistant message:', e); }
    }

    renderMessages();

  } catch (e) {
    typingEl.remove();
    console.error('[AI] Unexpected error:', e);
    messages.push({ role: 'assistant', content: '⚠️ Network error. Please try again.' });
    renderMessages();
  } finally {
    isSending = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatInput').disabled = false;
    document.getElementById('chatInput').focus();
    scroll.scrollTop = scroll.scrollHeight;
  }
}

/* ============================================================
   MESSAGE ACTIONS
   ============================================================ */
function copyMessage(index) {
  const msg = messages[index];
  if (!msg) return;
  navigator.clipboard.writeText(msg.content).then(() => {
    if (typeof showToast === 'function') showToast('Copied ✅');
  });
}

async function regenerate(index) {
  // Remove assistant message at index and everything after
  messages = messages.slice(0, index);
  renderMessages();

  // Re-trigger the last user message
  const lastUser = messages[messages.length - 1];
  if (lastUser) {
    // Put message back in input and resend
    messages.pop();
    document.getElementById('chatInput').value = lastUser.content;
    sendMessage();
  }
}

/* ============================================================
   INPUT HELPERS
   ============================================================ */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function quickAsk(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

/* ============================================================
   UTILS
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
