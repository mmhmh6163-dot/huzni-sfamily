<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050a14">
<title>AI.Arizonan — Chat</title>

<link rel="icon" type="image/jpeg" href="arizonan%20png%20icon.jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
/* ============================================================
   MOBILE-FIRST AI CHAT (Instagram-style)
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  background: #050a14;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #fff;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #050a14;
  position: relative;
}

@media (min-width: 500px) {
  body { background: #01030a; }
  .app {
    border-left: 1px solid rgba(94,184,255,.15);
    border-right: 1px solid rgba(94,184,255,.15);
    box-shadow: 0 0 60px rgba(0,0,0,.5);
  }
}

/* ==================== TOP BAR ==================== */
.topbar {
  height: 56px;
  flex-shrink: 0;
  padding: 0 12px;
  background: rgba(10,20,35,.98);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(94,184,255,.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  z-index: 10;
}
.topbar .icon-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: none;
  border: none;
  color: #5eb8ff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: background .15s;
}
.topbar .icon-btn:active { background: rgba(94,184,255,.15); }
.topbar .title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.topbar .title img {
  width: 22px; height: 22px;
  border-radius: 5px;
  -webkit-text-fill-color: initial;
}
.topbar .title span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

/* ==================== MESSAGES ==================== */
.messages {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 12px 12px 20px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: rgba(94,184,255,.3); border-radius: 2px; }

/* Message wrapper */
.msg {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  animation: slideIn .2s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(6px); }
}
.msg.user { flex-direction: row-reverse; }

.msg .av {
  width: 32px; height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: #fff;
}
.msg.user .av { background: linear-gradient(135deg,#FF6B35,#FFB20F); }
.msg.bot .av { background: linear-gradient(135deg,#5eb8ff,#7c3aed); }

.msg .bubble-wrap {
  max-width: 78%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.msg .bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.55;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.msg.user .bubble {
  background: linear-gradient(135deg,#FF6B35,#FFB20F);
  color: #fff;
  border-bottom-right-radius: 4px;
  align-self: flex-end;
}
.msg.bot .bubble {
  background: rgba(94,184,255,.1);
  border: 1px solid rgba(94,184,255,.25);
  color: #e0f2ff;
  border-bottom-left-radius: 4px;
}

/* Media inside bubble */
.msg .bubble img,
.msg .bubble video,
.msg .bubble audio {
  display: block;
  max-width: 100%;
  border-radius: 12px;
  margin-top: 8px;
  background: #000;
}
.msg .bubble img {
  max-height: 340px;
  object-fit: cover;
  cursor: zoom-in;
}
.msg .bubble video {
  max-height: 340px;
  width: 100%;
  background: #000;
}
.msg .bubble audio {
  width: 100%;
  min-width: 220px;
}

/* Actions */
.msg .actions {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding: 0 2px;
}
.msg .actions button {
  background: transparent;
  border: 1px solid rgba(94,184,255,.25);
  color: rgba(255,255,255,.6);
  border-radius: 12px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all .15s;
}
.msg .actions button:active {
  background: rgba(94,184,255,.15);
  color: #5eb8ff;
}

/* Attachment preview inside a user message */
.msg .attachment {
  margin-top: 6px;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}
.msg .attachment img { max-height: 300px; width: 100%; object-fit: cover; border-radius: 12px; display: block; }
.msg .attachment video { max-height: 300px; width: 100%; display: block; }
.msg .attachment audio { width: 100%; }

/* ==================== WELCOME ==================== */
.welcome {
  padding: 40px 20px;
  text-align: center;
}
.welcome .icon {
  width: 76px; height: 76px;
  border-radius: 24px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  color: #fff;
  margin: 0 auto 18px;
  box-shadow: 0 0 50px rgba(94,184,255,.4);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 50px rgba(94,184,255,.4); }
  50% { box-shadow: 0 0 70px rgba(124,58,237,.6); }
}
.welcome h1 {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 6px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.welcome p {
  color: rgba(255,255,255,.5);
  font-size: 13px;
  margin-bottom: 24px;
  line-height: 1.5;
}
.welcome .chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.chip {
  background: rgba(94,184,255,.08);
  border: 1px solid rgba(94,184,255,.25);
  border-radius: 18px;
  padding: 9px 14px;
  color: #5eb8ff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
}
.chip:active {
  background: rgba(94,184,255,.2);
  transform: scale(.97);
}
.chip i { font-size: 12px; }

/* ==================== TYPING ==================== */
.typing {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}
.typing span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #5eb8ff;
  animation: bounce 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* ==================== ATTACHMENT PREVIEW BAR ==================== */
.attach-preview {
  display: none;
  padding: 8px 12px;
  background: rgba(94,184,255,.08);
  border-top: 1px solid rgba(94,184,255,.2);
  gap: 10px;
  align-items: center;
}
.attach-preview.active { display: flex; }
.attach-preview .thumb {
  width: 48px; height: 48px;
  border-radius: 10px;
  background: #000;
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #5eb8ff;
  font-size: 20px;
}
.attach-preview .thumb img,
.attach-preview .thumb video {
  width: 100%; height: 100%;
  object-fit: cover;
}
.attach-preview .info {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: rgba(255,255,255,.75);
}
.attach-preview .info .name {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.attach-preview .remove {
  background: transparent;
  border: none;
  color: #ff7675;
  font-size: 18px;
  cursor: pointer;
  padding: 6px 10px;
}

/* ==================== INPUT BAR ==================== */
.input-wrap {
  flex-shrink: 0;
  background: rgba(10,20,35,.98);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(94,184,255,.2);
  padding: 8px 12px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}

.input-inner {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  background: rgba(94,184,255,.06);
  border: 1px solid rgba(94,184,255,.25);
  border-radius: 24px;
  padding: 4px 4px 4px 12px;
  transition: border-color .15s;
}
.input-inner:focus-within {
  border-color: #5eb8ff;
  box-shadow: 0 0 16px rgba(94,184,255,.15);
}

.input-inner .icon-inline {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: #5eb8ff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.input-inner .icon-inline:active {
  background: rgba(94,184,255,.15);
}
.input-inner .icon-inline.recording {
  background: rgba(255,118,117,.2);
  color: #ff7675;
  animation: recPulse 1s infinite;
}
@keyframes recPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.input-inner textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  resize: none;
  max-height: 120px;
  min-height: 24px;
  line-height: 1.4;
  padding: 8px 0;
}
.input-inner textarea::placeholder { color: rgba(255,255,255,.4); }

.input-inner .send-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  color: #fff;
  border: none;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s;
}
.input-inner .send-btn:active { transform: scale(.92); }
.input-inner .send-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ==================== SIDEBAR (drawer) ==================== */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 90;
  display: none;
  opacity: 0;
  transition: opacity .2s;
}
.drawer-overlay.active { display: block; opacity: 1; }

.drawer {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 84%;
  max-width: 340px;
  background: #0a1220;
  border-right: 1px solid rgba(94,184,255,.15);
  z-index: 100;
  transform: translateX(-100%);
  transition: transform .25s ease;
  display: flex;
  flex-direction: column;
}
.drawer.open { transform: translateX(0); }

.drawer-head {
  padding: 14px;
  border-bottom: 1px solid rgba(94,184,255,.15);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.drawer-head .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 800;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.drawer-head .brand img {
  width: 26px; height: 26px;
  border-radius: 6px;
  -webkit-text-fill-color: initial;
}
.drawer-head .new-btn {
  padding: 11px 14px;
  background: linear-gradient(135deg,#5eb8ff,#7c3aed);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.drawer-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.drawer-list::-webkit-scrollbar { width: 4px; }
.drawer-list::-webkit-scrollbar-thumb { background: rgba(94,184,255,.3); border-radius: 2px; }

.chat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  color: rgba(255,255,255,.75);
  margin-bottom: 2px;
  transition: background .15s;
}
.chat-item:active { background: rgba(94,184,255,.15); }
.chat-item.active {
  background: rgba(94,184,255,.15);
  color: #5eb8ff;
}
.chat-item i { color: rgba(255,255,255,.4); font-size: 13px; }
.chat-item.active i { color: #5eb8ff; }
.chat-item .title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-item .del {
  background: none;
  border: none;
  color: rgba(255,255,255,.3);
  cursor: pointer;
  padding: 4px;
  font-size: 12px;
}
.chat-item .del:active { color: #ff7675; }

.drawer-foot {
  padding: 12px;
  border-top: 1px solid rgba(94,184,255,.15);
  font-size: 11px;
  color: rgba(255,255,255,.4);
  text-align: center;
}

/* ==================== IMAGE VIEWER ==================== */
.image-viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.96);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.image-viewer.active { display: flex; }
.image-viewer img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 14px;
  object-fit: contain;
}
.image-viewer .close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  color: #fff;
  border: none;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ==================== TOAST ==================== */
.toast-mini {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(10,20,35,.98);
  border: 1px solid rgba(94,184,255,.4);
  color: #fff;
  padding: 10px 18px;
  border-radius: 22px;
  font-size: 13px;
  font-weight: 600;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all .25s ease;
}
.toast-mini.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <button class="icon-btn" onclick="openDrawer()"><i class="fas fa-bars"></i></button>
    <div class="title">
      <img src="arizonan%20png%20icon.jpeg" alt="">
      <span id="chatTitle">AI.Arizonan</span>
    </div>
    <button class="icon-btn" onclick="startNewChat()"><i class="fas fa-plus"></i></button>
  </header>

  <!-- MESSAGES -->
  <div class="messages" id="messages"></div>

  <!-- ATTACHMENT PREVIEW -->
  <div class="attach-preview" id="attachPreview">
    <div class="thumb" id="attachThumb"></div>
    <div class="info">
      <div class="name" id="attachName">file.jpg</div>
      <div id="attachSize">120 KB</div>
    </div>
    <button class="remove" onclick="clearAttachment()"><i class="fas fa-times"></i></button>
  </div>

  <!-- INPUT -->
  <div class="input-wrap">
    <div class="input-inner">
      <button class="icon-inline" onclick="pickFile()" title="Attach"><i class="fas fa-paperclip"></i></button>
      <textarea id="chatInput" rows="1" placeholder="Message AI.Arizonan…"
                oninput="autoResize(this)"
                onkeydown="handleKey(event)"></textarea>
      <button class="icon-inline" id="micBtn" onclick="toggleRecording()" title="Voice"><i class="fas fa-microphone"></i></button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*,video/*,audio/*" style="display:none;">
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="brand">
      <img src="arizonan%20png%20icon.jpeg" alt="">
      AI.Arizonan
    </div>
    <button class="new-btn" onclick="startNewChat()">
      <i class="fas fa-plus"></i> New Chat
    </button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
  <div class="drawer-foot">
    <i class="fas fa-shield-halved"></i> Chats saved securely
  </div>
</aside>

<!-- IMAGE VIEWER -->
<div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
  <button class="close"><i class="fas fa-times"></i></button>
  <img id="imageViewerImg" src="" alt="">
</div>

<!-- TOAST -->
<div class="toast-mini" id="toastMini"></div>

<script src="auth.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
let currentChatId    = null;
let currentChatTitle = 'AI.Arizonan';
let messages         = [];
let allChats         = [];
let isSending        = false;
let pendingFile      = null;
let pendingFileUrl   = null;
let mediaRecorder    = null;
let audioChunks      = [];
let isRecording      = false;

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(async () => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      await initChat();
    }
  }, 100);

  // Bind file input
  const fileInput = document.getElementById('fileInput');
  if (fileInput) {
    fileInput.addEventListener('change', onFilePicked);
  }
});

async function initChat() {
  await loadChatsList();
  await startNewChat();
  setTimeout(() => document.getElementById('chatInput').focus(), 300);
}

/* ============================================================
   DRAWER
   ============================================================ */
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('active');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('active');
}

/* ============================================================
   CHAT LIST
   ============================================================ */
async function loadChatsList() {
  if (!currentUser) return;
  try {
    const { data, error } = await supabaseClient
      .from('ai_chats')
      .select('id, title, updated_at')
      .eq('user_id', currentUser.id)
      .order('updated_at', { ascending: false })
      .limit(50);
    if (error) throw error;
    allChats = data || [];
    renderDrawerList();
  } catch (e) {
    console.warn('[AI] Could not load chats:', e);
  }
}

function renderDrawerList() {
  const list = document.getElementById('drawerList');
  if (allChats.length === 0) {
    list.innerHTML = `
      <div style="text-align:center;padding:30px 12px;font-size:12px;color:rgba(255,255,255,.3);">
        <i class="far fa-comments" style="font-size:22px;display:block;margin-bottom:8px;"></i>
        No chats yet
      </div>`;
    return;
  }
  list.innerHTML = allChats.map(c => `
    <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="openChat('${c.id}')">
      <i class="far fa-comment"></i>
      <span class="title">${escapeHtml(c.title || 'New chat')}</span>
      <button class="del" onclick="event.stopPropagation(); deleteChat('${c.id}')"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');
}

/* ============================================================
   CHAT OPS
   ============================================================ */
async function startNewChat() {
  messages = [];
  currentChatId = null;
  currentChatTitle = 'AI.Arizonan';
  document.getElementById('chatTitle').textContent = 'AI.Arizonan';
  clearAttachment();
  renderWelcome();
  renderDrawerList();
  closeDrawer();
  setTimeout(() => document.getElementById('chatInput').focus(), 200);
}

async function openChat(chatId) {
  if (!currentUser) return;
  try {
    const { data: chat } = await supabaseClient
      .from('ai_chats').select('*').eq('id', chatId).single();
    const { data: msgs } = await supabaseClient
      .from('ai_messages').select('*').eq('chat_id', chatId)
      .order('created_at', { ascending: true });

    currentChatId = chatId;
    currentChatTitle = chat?.title || 'Chat';
    document.getElementById('chatTitle').textContent = currentChatTitle;

    messages = (msgs || []).map(m => ({
      role: m.role,
      content: m.content,
      media_url: m.media_url || null,
      media_type: m.media_type || null
    }));

    renderMessages();
    closeDrawer();
    renderDrawerList();
  } catch (e) { console.error(e); }
}

async function deleteChat(chatId) {
  if (!confirm('Delete this chat?')) return;
  try {
    await supabaseClient.from('ai_chats').delete().eq('id', chatId).eq('user_id', currentUser.id);
    allChats = allChats.filter(c => c.id !== chatId);
    if (currentChatId === chatId) startNewChat();
    renderDrawerList();
  } catch (e) { console.error(e); }
}

async function createChatIfNeeded(firstMessage) {
  if (currentChatId) return currentChatId;
  const title = firstMessage.slice(0, 40) + (firstMessage.length > 40 ? '…' : '');
  const { data, error } = await supabaseClient
    .from('ai_chats')
    .insert({ user_id: currentUser.id, title })
    .select().single();
  if (error) throw error;
  currentChatId = data.id;
  currentChatTitle = title;
  document.getElementById('chatTitle').textContent = title;
  await loadChatsList();
  return currentChatId;
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderWelcome() {
  document.getElementById('messages').innerHTML = `
    <div class="welcome">
      <div class="icon"><i class="fas fa-robot"></i></div>
      <h1>Hi, I'm AI.Arizonan</h1>
      <p>Your AI assistant. Send text, images, videos, or voice — I'll help.</p>
      <div class="chips">
        <button class="chip" onclick="quickAsk('Write a caption for my post')">
          <i class="fas fa-pen-fancy"></i> Caption
        </button>
        <button class="chip" onclick="quickAsk('Suggest hashtags for a post')">
          <i class="fas fa-hashtag"></i> Hashtags
        </button>
        <button class="chip" onclick="quickAsk('How do I earn on Arizona AI?')">
          <i class="fas fa-dollar-sign"></i> Earn tips
        </button>
        <button class="chip" onclick="quickAsk('Write a short bio for me')">
          <i class="fas fa-user"></i> Bio
        </button>
      </div>
    </div>
  `;
}

function renderMessages() {
  const container = document.getElementById('messages');
  if (messages.length === 0) {
    renderWelcome();
    return;
  }
  container.innerHTML = '';
  messages.forEach((m, i) => container.appendChild(createMessageEl(m, i)));
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
}

function createMessageEl(msg, index) {
  const isUser = msg.role === 'user';
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'user' : 'bot');

  const avText = isUser
    ? (currentProfile?.username || currentUser?.email?.split('@')[0] || 'U').charAt(0).toUpperCase()
    : 'AI';

  // Media HTML
  let mediaHtml = '';
  if (msg.media_url) {
    if (msg.media_type === 'image') {
      mediaHtml = `<div class="attachment"><img src="${escapeHtml(msg.media_url)}" alt="" onclick="viewImage('${escapeHtml(msg.media_url)}')"></div>`;
    } else if (msg.media_type === 'video') {
      mediaHtml = `<div class="attachment"><video src="${escapeHtml(msg.media_url)}" controls playsinline preload="metadata"></video></div>`;
    } else if (msg.media_type === 'audio') {
      mediaHtml = `<div class="attachment"><audio src="${escapeHtml(msg.media_url)}" controls preload="metadata"></audio></div>`;
    }
  }

  const textHtml = msg.content
    ? `<div class="bubble">${escapeHtml(msg.content).replace(/\n/g, '<br>')}${mediaHtml}</div>`
    : (mediaHtml ? `<div class="bubble">${mediaHtml}</div>` : '');

  div.innerHTML = `
    <div class="av">${avText}</div>
    <div class="bubble-wrap">
      ${textHtml}
      ${!isUser ? `
        <div class="actions">
          <button onclick="copyMessage(${index})"><i class="fas fa-copy"></i> Copy</button>
          <button onclick="regenerate(${index})"><i class="fas fa-rotate"></i> Regenerate</button>
        </div>
      ` : ''}
    </div>
  `;
  return div;
}

/* ============================================================
   FILE PICKER
   ============================================================ */
function pickFile() {
  document.getElementById('fileInput').click();
}

function onFilePicked(event) {
  const file = event.target.files[0];
  if (!file) return;

  const maxMB = 25;
  if (file.size > maxMB * 1024 * 1024) {
    toast(`File must be under ${maxMB} MB`);
    event.target.value = '';
    return;
  }

  pendingFile = file;
  pendingFileUrl = URL.createObjectURL(file);

  // Build preview
  const preview = document.getElementById('attachPreview');
  const thumb = document.getElementById('attachThumb');
  const nameEl = document.getElementById('attachName');
  const sizeEl = document.getElementById('attachSize');

  let type = 'file';
  let icon = '<i class="fas fa-file"></i>';
  if (file.type.startsWith('image/')) {
    type = 'image';
    icon = `<img src="${pendingFileUrl}" alt="">`;
  } else if (file.type.startsWith('video/')) {
    type = 'video';
    icon = `<video src="${pendingFileUrl}" muted></video>`;
  } else if (file.type.startsWith('audio/')) {
    type = 'audio';
    icon = '<i class="fas fa-music"></i>';
  }

  thumb.innerHTML = icon;
  nameEl.textContent = file.name;
  sizeEl.textContent = `${type} · ${(file.size / 1024).toFixed(0)} KB`;
  preview.classList.add('active');

  document.getElementById('fileInput').value = '';
}

function clearAttachment() {
  pendingFile = null;
  if (pendingFileUrl) {
    URL.revokeObjectURL(pendingFileUrl);
    pendingFileUrl = null;
  }
  document.getElementById('attachPreview').classList.remove('active');
}

/* ============================================================
   VOICE RECORDING
   ============================================================ */
async function toggleRecording() {
  const btn = document.getElementById('micBtn');

  if (isRecording) {
    // Stop
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    isRecording = false;
    btn.classList.remove('recording');
    btn.innerHTML = '<i class="fas fa-microphone"></i>';
    return;
  }

  // Start
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const file = new File([blob], `voice-${Date.now()}.webm`, { type: 'audio/webm' });
      pendingFile = file;
      pendingFileUrl = URL.createObjectURL(file);

      const preview = document.getElementById('attachPreview');
      document.getElementById('attachThumb').innerHTML = '<i class="fas fa-music"></i>';
      document.getElementById('attachName').textContent = file.name;
      document.getElementById('attachSize').textContent = `audio · ${(file.size / 1024).toFixed(0)} KB`;
      preview.classList.add('active');

      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    isRecording = true;
    btn.classList.add('recording');
    btn.innerHTML = '<i class="fas fa-stop"></i>';
    toast('Recording… tap again to stop');
  } catch (e) {
    console.error('[Voice] Error:', e);
    toast('Microphone access denied');
  }
}

/* ============================================================
   SEND MESSAGE
   ============================================================ */
async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();

  if (!text && !pendingFile) return;

  // Prepare media
  let mediaUrl = null;
  let mediaType = null;

  if (pendingFile && currentUser) {
    try {
      const ext = pendingFile.name.split('.').pop() || 'bin';
      const path = `${currentUser.id}/ai-${Date.now()}.${ext}`;

      const { data: upload, error: upErr } = await supabaseClient.storage
        .from('ai_uploads')
        .upload(path, pendingFile, { cacheControl: '3600' });

      if (upErr) throw upErr;

      const { data: urlData } = supabaseClient.storage
        .from('ai_uploads')
        .getPublicUrl(upload.path);

      mediaUrl = urlData.publicUrl;
      mediaType = pendingFile.type.startsWith('image/') ? 'image'
                : pendingFile.type.startsWith('video/') ? 'video'
                : pendingFile.type.startsWith('audio/') ? 'audio'
                : null;
    } catch (e) {
      console.error('[Upload] Error:', e);
      toast('Upload failed');
      return;
    }
  }

  input.value = '';
  autoResize(input);

  const userMsg = {
    role: 'user',
    content: text || '',
    media_url: mediaUrl,
    media_type: mediaType
  };
  messages.push(userMsg);
  clearAttachment();

  // Save user message
  if (currentUser && currentChatId !== null || text || mediaUrl) {
    try {
      await createChatIfNeeded(text || `[${mediaType || 'file'}]`);
      await supabaseClient.from('ai_messages').insert({
        chat_id: currentChatId,
        role: 'user',
        content: text || '',
        media_url: mediaUrl,
        media_type: mediaType
      });
    } catch (e) { console.warn('[AI] save user msg failed:', e); }
  }

  renderMessages();

  // Typing indicator
  const container = document.getElementById('messages');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg bot';
  typingEl.innerHTML = `
    <div class="av">AI</div>
    <div class="bubble-wrap"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>
  `;
  container.appendChild(typingEl);
  container.scrollTop = container.scrollHeight;

  isSending = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    const payloadMessages = messages.map(m => ({ role: m.role, content: m.content || '' }));

    const { data, error } = await supabaseClient.functions.invoke('ai-chat', {
      body: { messages: payloadMessages }
    });

    typingEl.remove();

    if (error || !data?.reply) {
      console.error('[AI] Error:', error, data);
      messages.push({ role: 'assistant', content: '⚠️ Something went wrong. Please try again.' });
      renderMessages();
      return;
    }

    messages.push({ role: 'assistant', content: data.reply });

    if (currentUser) {
      try {
        await supabaseClient.from('ai_messages').insert({
          chat_id: currentChatId,
          role: 'assistant',
          content: data.reply
        });
      } catch (e) { console.warn('[AI] save assistant msg failed:', e); }
    }

    renderMessages();
  } catch (e) {
    typingEl.remove();
    console.error(e);
    messages.push({ role: 'assistant', content: '⚠️ Network error. Please try again.' });
    renderMessages();
  } finally {
    isSending = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatInput').focus();
    container.scrollTop = container.scrollHeight;
  }
}

/* ============================================================
   MESSAGE ACTIONS
   ============================================================ */
function copyMessage(index) {
  const msg = messages[index];
  if (!msg) return;
  navigator.clipboard.writeText(msg.content || '').then(() => toast('Copied ✅'));
}

async function regenerate(index) {
  messages = messages.slice(0, index);
  renderMessages();
  const lastUser = messages[messages.length - 1];
  if (lastUser) {
    messages.pop();
    document.getElementById('chatInput').value = lastUser.content || '';
    sendMessage();
  }
}

/* ============================================================
   IMAGE VIEWER
   ============================================================ */
function viewImage(url) {
  document.getElementById('imageViewerImg').src = url;
  document.getElementById('imageViewer').classList.add('active');
}
function closeImageViewer() {
  document.getElementById('imageViewer').classList.remove('active');
}

/* ============================================================
   INPUT HELPERS
   ============================================================ */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function quickAsk(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg) {
  const el = document.getElementById('toastMini');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ============================================================
   UTILS
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
