<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - huzni's Family</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .register-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message {
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .logo-icon { font-size: 48px; color: #764ba2; }
        .benefit-text {
            font-size: 13px;
            color: #6b7280;
            margin: 4px 0;
        }
        .benefit-text i { color: #16a34a; margin-right: 6px; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="text-center mb-8">
            <i class="fas fa-rocket logo-icon"></i>
            <h2 class="text-3xl font-bold text-gray-800 mt-2">Create Account</h2>
            <p class="text-gray-600">Start earning today!</p>
        </div>
        <div id="error-message" class="error-message">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span id="error-text"></span>
        </div>
        <div id="success-message" class="success-message">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="success-text"></span>
        </div>
        <form id="register-form" onsubmit="return handleRegister(event)">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email address" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password (min 6 chars)" required minlength="6">
            </div>
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="btn-primary">
                <i class="fas fa-user-plus mr-2"></i> Create Free Account
            </button>
        </form>
        
        <div class="mt-6 p-4 bg-gray-50 rounded-lg">
            <p class="text-sm font-semibold text-gray-700"><i class="fas fa-gift text-green-500"></i> What you get:</p>
            <p class="benefit-text"><i class="fas fa-check-circle"></i> Free account forever</p>
            <p class="benefit-text"><i class="fas fa-dollar-sign text-green-500"></i> Earn money from your posts</p>
            <p class="benefit-text"><i class="fas fa-video"></i> Share videos, shorts, and notes</p>
            <p class="benefit-text"><i class="fas fa-robot"></i> AI-powered content recommendations</p>
        </div>
        
        <p class="text-center text-gray-600 mt-4">
            Already have an account? <a href="login.html" class="text-purple-600 font-semibold hover:underline">Sign In</a>
        </p>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            
            if (!username) { showError('Username is required'); return; }
            if (password !== confirm) { showError('Passwords do not match'); return; }
            if (password.length < 6) { showError('Password must be at least 6 characters'); return; }
            
            showSuccess('🎉 Account created successfully! Redirecting...');
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
            return false;
        }
        
        function showError(msg) {
            document.getElementById('error-text').textContent = msg;
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
            setTimeout(() => { document.getElementById('error-message').style.display = 'none'; }, 5000);
        }
        
        function showSuccess(msg) {
            document.getElementById('success-text').textContent = msg;
            document.getElementById('success-message').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }
    </script>
</body>
</html>
