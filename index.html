<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arizona AI — Earn While You Share</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
body { background:#0a0a0a; padding-top:60px; padding-bottom:70px; }

/* ==================== TOP BAR ==================== */
.ig-topbar {
  position:fixed; top:0; left:0; right:0; height:60px;
  background:rgba(10,10,10,.97); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,107,53,.25);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; z-index:1000; max-width:640px; margin:0 auto;
}
.ig-topbar .brand {
  font-size:20px; font-weight:800;
  display:flex; align-items:center; gap:8px;
  text-decoration:none; color:inherit;
}
.ig-topbar .brand i { color:var(--az-accent); font-size:22px; }
.ig-topbar .brand span {
  background:var(--az-gradient);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.ig-topbar .actions { display:flex; align-items:center; gap:4px; }
.ig-icon-btn {
  width:40px; height:40px; border-radius:50%;
  background:transparent; border:none; color:var(--az-text);
  font-size:19px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  position:relative; text-decoration:none;
}
.ig-icon-btn:hover { background:rgba(255,255,255,.06); }
.ig-icon-btn .dot {
  position:absolute; top:8px; right:8px;
  width:8px; height:8px; border-radius:50%;
  background:var(--az-primary); border:2px solid #0a0a0a;
}

/* ==================== USER STRIP (only when logged in) ==================== */
.ig-user-strip {
  max-width:640px; margin:0 auto;
  padding:12px 16px;
  display:flex; align-items:center; gap:12px;
  background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,107,53,.15);
}
.ig-user-strip .avatar {
  width:42px; height:42px; border-radius:50%;
  background:var(--az-gradient);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:16px; flex-shrink:0;
  text-decoration:none; overflow:hidden;
}
.ig-user-strip .info { flex:1; min-width:0; }
.ig-user-strip .name {
  font-weight:700; font-size:14px; color:var(--az-text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ig-user-strip .balance {
  font-size:12px; color:var(--az-accent);
  display:flex; align-items:center; gap:4px;
}
.ig-user-strip .logout-mini {
  background:transparent;
  border:1px solid rgba(255,118,117,.5);
  color:var(--az-danger); padding:6px 12px;
  border-radius:18px; font-size:12px; font-weight:600;
  cursor:pointer; text-decoration:none;
}
.ig-user-strip .logout-mini:hover { background:var(--az-danger); color:#fff; }

/* ==================== GUEST CTA (only when logged out) ==================== */
.guest-cta {
  max-width:640px; margin:0 auto;
  padding:16px;
  display:flex; align-items:center; gap:12px;
  background:linear-gradient(135deg,rgba(255,107,53,.15),rgba(255,178,15,.08));
  border-bottom:1px solid rgba(255,107,53,.2);
}
.guest-cta .text { flex:1; font-size:13px; color:var(--az-text); }
.guest-cta .text strong { display:block; font-size:14px; margin-bottom:2px; }
.guest-cta a {
  padding:9px 16px; border-radius:20px;
  background:var(--az-gradient); color:#fff;
  font-weight:700; font-size:13px; text-decoration:none;
  white-space:nowrap;
}

/* ==================== STORIES ==================== */
.ig-stories {
  max-width:640px; margin:0 auto;
  display:flex; gap:14px; padding:14px 16px;
  overflow-x:auto; scrollbar-width:none;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.ig-stories::-webkit-scrollbar { display:none; }
.ig-story { flex-shrink:0; text-align:center; cursor:pointer; width:72px; }
.ig-story-ring {
  width:64px; height:64px; border-radius:50%;
  background:var(--az-gradient); padding:2.5px; margin:0 auto 6px;
}
.ig-story-ring .inner {
  width:100%; height:100%; border-radius:50%;
  background:#0a0a0a; border:2px solid #0a0a0a;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:20px; overflow:hidden;
}
.ig-story.add .inner { background:var(--az-accent); color:#1a1a1a; }
.ig-story .label {
  font-size:11px; color:var(--az-text-secondary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ==================== FEED ==================== */
.ig-feed { max-width:640px; margin:0 auto; }
.ig-post {
  background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,255,255,.06);
  margin-bottom:8px;
}
.ig-post-head {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px;
}
.ig-post-head .p-avatar {
  width:38px; height:38px; border-radius:50%;
  background:var(--az-gradient);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:15px; flex-shrink:0;
  text-decoration:none; overflow:hidden;
}
.ig-post-head .meta { flex:1; min-width:0; }
.ig-post-head .meta .name {
  font-weight:700; font-size:14px; color:var(--az-text);
  display:flex; align-items:center; gap:5px;
  text-decoration:none;
}
.ig-post-head .meta .name .verified { color:#3b82f6; font-size:12px; }
.ig-post-head .meta .sub {
  font-size:11px; color:var(--az-text-secondary);
}
.ig-post-head .more {
  color:var(--az-text-secondary);
  background:none; border:none;
  font-size:18px; cursor:pointer; padding:6px;
}

.ig-post-media {
  width:100%; background:#000;
  display:flex; align-items:center; justify-content:center;
  max-height:620px; overflow:hidden;
}
.ig-post-media img,
.ig-post-media video {
  width:100%; height:auto;
  max-height:620px; object-fit:contain;
  display:block;
}
.ig-post-body { padding:10px 16px 14px; }
.ig-post-caption {
  font-size:14px; line-height:1.5; color:var(--az-text);
  margin-top:6px; word-wrap:break-word;
}
.ig-post-caption .cap-user { font-weight:700; margin-right:6px; }

.ig-actions {
  display:flex; align-items:center; gap:16px;
  padding:8px 16px 6px;
}
.ig-action {
  background:none; border:none; color:var(--az-text);
  font-size:22px; cursor:pointer; padding:4px;
  display:flex; align-items:center;
  transition:transform .15s ease;
}
.ig-action:hover { transform:scale(1.1); }
.ig-action.liked { color:var(--az-primary); }
.ig-action.save { margin-left:auto; }

.ig-likes {
  padding:2px 16px 4px;
  font-size:13px; font-weight:700; color:var(--az-text);
}
.ig-time {
  padding:4px 16px 12px;
  font-size:10px; color:var(--az-text-secondary);
  text-transform:uppercase; letter-spacing:.5px;
}

/* ==================== EMPTY ==================== */
.ig-empty {
  text-align:center; padding:60px 24px;
  color:var(--az-text-secondary);
}
.ig-empty i {
  font-size:56px; color:var(--az-primary);
  opacity:.4; margin-bottom:16px; display:block;
}
.ig-empty h3 { color:var(--az-text); font-size:17px; margin-bottom:6px; }
.ig-empty p { font-size:14px; }

/* ==================== BOTTOM NAV ==================== */
.ig-bottom-nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:640px;
  background:rgba(10,10,10,.98);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,107,53,.25);
  display:flex; justify-content:space-around; align-items:center;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index:1000;
}
.ig-bottom-nav .bnav-item {
  background:none; border:none; color:var(--az-text-secondary);
  display:flex; flex-direction:column; align-items:center;
  gap:3px; cursor:pointer; padding:4px 12px;
  font-size:10px; text-decoration:none;
}
.ig-bottom-nav .bnav-item i { font-size:22px; }
.ig-bottom-nav .bnav-item.active { color:var(--az-text); }
.ig-bottom-nav .bnav-item.create {
  color:#fff; background:var(--az-gradient);
  width:44px; height:44px; border-radius:12px;
  padding:0; justify-content:center;
}
.ig-bottom-nav .bnav-item.create i { font-size:20px; }
.ig-bottom-nav .bnav-avatar {
  width:26px; height:26px; border-radius:50%;
  background:var(--az-gradient);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:11px;
  border:2px solid var(--az-text);
}
.ig-bottom-nav .bnav-avatar.no-auth {
  background:transparent; border:2px solid var(--az-text-secondary);
  color:var(--az-text-secondary);
}

/* ==================== MOBILE ==================== */
@media (max-width:380px) {
  .ig-user-strip .name { font-size:13px; }
  .ig-story { width:64px; }
  .ig-story-ring { width:56px; height:56px; }
}
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay"><div class="loader"></div></div>

<!-- ==================== TOP BAR ==================== -->
<header class="ig-topbar">
  <a href="index.html" class="brand">
    <i class="fas fa-mountain-sun"></i>
    <span>Arizona AI</span>
  </a>
  <div class="actions" id="topActions">
    <!-- Filled by JS -->
  </div>
</header>

<!-- ==================== USER STRIP (logged in) ==================== -->
<div class="ig-user-strip" id="userStrip" style="display:none;">
  <a href="profile.html" class="avatar" id="uAvatar">U</a>
  <div class="info">
    <div class="name" id="uName">User</div>
    <div class="balance">
      <i class="fas fa-wallet"></i>
      <span id="uBalance">$0.00</span>
      <span style="color:var(--az-text-secondary);"> · Earn more by posting</span>
    </div>
  </div>
  <a href="logout.html" class="logout-mini">
    <i class="fas fa-sign-out-alt"></i> Logout
  </a>
</div>

<!-- ==================== GUEST CTA (logged out) ==================== -->
<div class="guest-cta" id="guestCta" style="display:none;">
  <div class="text">
    <strong>🏜️ Welcome to Arizona AI</strong>
    Sign up free — earn money for your posts!
  </div>
  <a href="register.html">Sign Up</a>
</div>

<!-- ==================== STORIES ==================== -->
<div class="ig-stories" id="storiesRow">
  <div class="ig-story add" onclick="goToPost()">
    <div class="ig-story-ring"><div class="inner"><i class="fas fa-plus"></i></div></div>
    <div class="label">Your story</div>
  </div>
</div>

<!-- ==================== FEED ==================== -->
<main class="ig-feed" id="feed">
  <div class="ig-empty">
    <i class="fas fa-circle-notch fa-spin"></i>
    Loading posts…
  </div>
</main>

<!-- ==================== BOTTOM NAV ==================== -->
<nav class="ig-bottom-nav" id="bottomNav">
  <a href="index.html" class="bnav-item active">
    <i class="fas fa-home"></i><span>Home</span>
  </a>
  <a href="Friends.html" class="bnav-item">
    <i class="fas fa-search"></i><span>Search</span>
  </a>
  <a href="Post.html" class="bnav-item create" id="createBtn">
    <i class="fas fa-plus"></i>
  </a>
  <a href="chats.html" class="bnav-item">
    <i class="far fa-heart"></i><span>Activity</span>
  </a>
  <a href="profile.html" class="bnav-item" id="profileNav">
    <div class="bnav-avatar no-auth" id="bnavAvatar"><i class="far fa-user"></i></div>
    <span>Profile</span>
  </a>
</nav>

<script src="auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      init();
    }
  }, 100);
});

function init() {
  renderTopActions();
  renderUserSection();
  renderBottomAvatar();
  loadFeed();
}

/* ==================== TOP ACTIONS ==================== */
function renderTopActions() {
  const el = document.getElementById('topActions');
  if (currentUser) {
    el.innerHTML = `
      <a href="Friends.html" class="ig-icon-btn" title="Friends">
        <i class="far fa-heart"></i>
      </a>
      <a href="chats.html" class="ig-icon-btn" title="Messages">
        <i class="far fa-paper-plane"></i>
        <span class="dot"></span>
      </a>
      <a href="notifications.html" class="ig-icon-btn" title="Notifications">
        <i class="far fa-bell"></i>
      </a>
    `;
  } else {
    el.innerHTML = `
      <a href="login.html" class="ig-icon-btn" title="Login" style="width:auto; padding:0 12px; font-size:13px; font-weight:600;">
        Login
      </a>
      <a href="register.html" class="ig-icon-btn" title="Sign Up" style="width:auto; padding:0 12px; font-size:13px; font-weight:600; background:var(--az-gradient); color:#fff;">
        Sign Up
      </a>
    `;
  }
}

/* ==================== USER SECTION ==================== */
function renderUserSection() {
  const strip = document.getElementById('userStrip');
  const cta   = document.getElementById('guestCta');

  if (currentUser) {
    strip.style.display = 'flex';
    cta.style.display   = 'none';

    const name = currentProfile?.username || currentUser.email?.split('@')[0] || 'User';
    const bal  = Number(currentWallet?.balance ?? 0).toFixed(2);
    const initial = name.charAt(0).toUpperCase();

    document.getElementById('uName').textContent    = name;
    document.getElementById('uBalance').textContent = '$' + bal;
    document.getElementById('uAvatar').textContent  = initial;
  } else {
    strip.style.display = 'none';
    cta.style.display   = 'flex';
  }
}

/* ==================== BOTTOM AVATAR ==================== */
function renderBottomAvatar() {
  const av = document.getElementById('bnavAvatar');
  if (currentUser) {
    const name = currentProfile?.username || currentUser.email?.split('@')[0] || 'U';
    av.classList.remove('no-auth');
    av.textContent = name.charAt(0).toUpperCase();
    av.style.background = 'var(--az-gradient)';
    av.style.color = '#fff';
    av.style.border = '2px solid var(--az-text)';
  } else {
    av.classList.add('no-auth');
    av.innerHTML = '<i class="far fa-user"></i>';
    av.style.background = 'transparent';
    av.style.color = 'var(--az-text-secondary)';
    av.style.border = '2px solid var(--az-text-secondary)';
  }
}

/* ==================== NAV TO POST ==================== */
function goToPost() {
  if (!currentUser) {
    window.location.href = 'login.html';
  } else {
    window.location.href = 'Post.html';
  }
}

/* ==================== FEED ==================== */
async function loadFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div class="ig-empty"><i class="fas fa-circle-notch fa-spin"></i>Loading posts…</div>';

  try {
    // Public feed — no auth required
    const { data, error } = await supabaseClient
      .from('posts')
      .select(`
        *,
        profiles:user_id (
          username, display_name, avatar_url, is_verified
        )
      `)
      .eq('visibility', 'public')
      .order('created_at', { ascending: false })
      .limit(50);

    if (error) throw error;

    if (!data || data.length === 0) {
      feed.innerHTML = `
        <div class="ig-empty">
          <i class="far fa-newspaper"></i>
          <h3>No posts yet</h3>
          <p>${currentUser ? 'Be the first to post — tap ➕ below!' : 'Sign up to be the first to post!'}</p>
        </div>`;
      return;
    }

    feed.innerHTML = data.map(post => renderPost(post)).join('');

  } catch (err) {
    console.error('Feed error:', err);
    feed.innerHTML = `
      <div class="ig-empty">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Couldn't load feed</h3>
        <p style="opacity:.6; font-size:12px;">${escapeHtml(err.message)}</p>
      </div>`;
  }
}

function renderPost(post) {
  const prof    = post.profiles || {};
  const name    = prof.display_name || prof.username || 'user';
  const uname   = prof.username || 'user';
  const initial = name.charAt(0).toUpperCase();
  const verified = prof.is_verified ? '<i class="fas fa-circle-check verified"></i>' : '';
  const timeAgo = formatTimeAgo(post.created_at);
  const avatarHtml = prof.avatar_url
    ? `<img src="${escapeHtml(prof.avatar_url)}" alt="">`
    : initial;

  const mediaUrls = Array.isArray(post.media_urls) ? post.media_urls : [];
  const mediaHtml = mediaUrls.map(url => {
    if (/\.(mp4|webm|ogg|mov)$/i.test(url)) {
      return `<video src="${escapeHtml(url)}" controls playsinline preload="metadata"></video>`;
    }
    return `<img src="${escapeHtml(url)}" alt="" loading="lazy">`;
  }).join('');

  const caption = post.content
    ? `<div class="ig-post-caption"><span class="cap-user">${escapeHtml(uname)}</span>${escapeHtml(post.content)}</div>`
    : '';

  return `
    <article class="ig-post" data-id="${post.id}">
      <div class="ig-post-head">
        <a href="profile.html?user=${post.user_id}" class="p-avatar">${avatarHtml}</a>
        <div class="meta">
          <a href="profile.html?user=${post.user_id}" class="name">${escapeHtml(name)} ${verified}</a>
          <div class="sub">@${escapeHtml(uname)} · ${timeAgo}</div>
        </div>
        <button class="more"><i class="fas fa-ellipsis-h"></i></button>
      </div>

      ${mediaHtml ? `<div class="ig-post-media">${mediaHtml}</div>` : ''}

      <div class="ig-actions">
        <button class="ig-action" onclick="likePost('${post.id}', this)">
          <i class="far fa-heart"></i>
        </button>
        <button class="ig-action" onclick="showToast('Comments coming soon')">
          <i class="far fa-comment"></i>
        </button>
        <button class="ig-action" onclick="sharePost('${post.id}')">
          <i class="far fa-paper-plane"></i>
        </button>
        <button class="ig-action save" onclick="showToast('Saved to collection')">
          <i class="far fa-bookmark"></i>
        </button>
      </div>

      <div class="ig-likes" id="likes-${post.id}">${post.likes_count || 0} likes</div>
      ${caption}
      <div class="ig-time">${timeAgo}</div>
    </article>
  `;
}

/* ==================== LIKE ==================== */
async function likePost(postId, btn) {
  if (!currentUser) {
    showToast('Sign in to like posts', 'error');
    return;
  }

  const icon = btn.querySelector('i');
  const liked = btn.classList.toggle('liked');
  icon.className = liked ? 'fas fa-heart' : 'far fa-heart';

  try {
    const { data, error } = await supabaseClient
      .from('posts').select('likes_count').eq('id', postId).single();
    if (error) throw error;

    const newCount = (data.likes_count || 0) + (liked ? 1 : -1);
    await supabaseClient.from('posts').update({ likes_count: newCount }).eq('id', postId);

    const likesEl = document.getElementById('likes-' + postId);
    if (likesEl) likesEl.textContent = `${newCount} likes`;
  } catch (err) {
    console.error(err);
  }
}

/* ==================== SHARE ==================== */
async function sharePost(postId) {
  const url = window.location.origin + '/huzni-sfamily/index.html?post=' + postId;

  if (navigator.share) {
    try {
      await navigator.share({
        title: 'Arizona AI',
        text: 'Check out this post on Arizona AI!',
        url: url
      });
      return;
    } catch (e) {
      // user cancelled → fall through
    }
  }

  // Clipboard fallback
  try {
    await navigator.clipboard.writeText(url);
    showToast('Link copied! 📋', 'success');
  } catch {
    showToast('Link: ' + url);
  }
}

/* ==================== HELPERS ==================== */
function formatTimeAgo(dateStr) {
  const seconds = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (seconds < 60) return 'Just now';
  const mins = Math.floor(seconds / 60);
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `${days}d ago`;
  return new Date(dateStr).toLocaleDateString();
}
</script>
