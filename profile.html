<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Profile — Arizona AI</title>

<link rel="icon" type="image/jpeg" href="arizonan%20png%20icon.jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { padding-top: 54px; padding-bottom: 75px; }

:root {
  --az-primary: #fe2c55;
  --az-accent: #25f4ee;
  --az-gradient: linear-gradient(135deg, #fe2c55 0%, #ff0050 100%);
  --az-card-bg: #141414;
  --az-border: rgba(255,255,255,0.12);
  --az-text-secondary: rgba(255,255,255,0.65);
}

/* ==================== TOP NAVIGATION ==================== */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 54px;
  background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--az-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 1000; max-width: 600px; margin: 0 auto;
}
.topbar .icon-btn, .topbar .back {
  color: #fff; font-size: 18px; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; text-decoration: none; cursor: pointer;
  background: none; border: none;
}
.topbar .title { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 4px; }

/* ==================== TIKTOK PROFILE HEADER ==================== */
.tiktok-header {
  max-width: 600px; margin: 0 auto;
  padding: 18px 16px 8px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}

.profile-avatar-wrap {
  position: relative; cursor: pointer; margin-bottom: 10px;
}
.profile-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: #222; display: flex; align-items: center; justify-content: center;
  font-size: 34px; font-weight: 800; color: #fff;
  border: 2px solid #000; box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
  overflow: hidden; transition: transform 0.2s; position: relative; z-index: 1;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Story ring */
.profile-avatar-wrap.has-story::before {
  content: ''; position: absolute; inset: -4px; border-radius: 50%;
  background: conic-gradient(from 0deg, #fe2c55, #25f4ee, #fe2c55);
  z-index: 0; animation: spinRing 4s linear infinite;
}
@keyframes spinRing { to { transform: rotate(360deg); } }

.profile-avatar-wrap .camera-badge {
  position: absolute; bottom: 2px; right: 2px;
  background: var(--az-primary); color: #fff;
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; border: 2px solid #000; cursor: pointer; z-index: 10;
}

.tiktok-username {
  font-size: 18px; font-weight: 700; color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tiktok-handle {
  font-size: 13px; color: var(--az-text-secondary); margin-bottom: 14px;
}

/* 4-Column Clickable Stats */
.tiktok-stats {
  display: flex; align-items: center; justify-content: space-around;
  width: 100%; max-width: 440px; margin-bottom: 16px;
}
.stat-col {
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; padding: 4px 10px; border-radius: 8px;
  transition: background 0.15s;
}
.stat-col:hover { background: rgba(255,255,255,0.06); }
.stat-col .num { font-size: 17px; font-weight: 800; color: #fff; }
.stat-col .lbl { font-size: 12px; color: var(--az-text-secondary); margin-top: 2px; }

/* Action Buttons (Area 1: Story added here) */
.tiktok-actions {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; width: 100%; max-width: 480px; margin-bottom: 14px;
}
.btn-tt {
  padding: 10px 14px; border-radius: 8px; font-size: 13px;
  font-weight: 600; cursor: pointer; border: none;
  font-family: inherit; display: inline-flex; align-items: center;
  justify-content: center; gap: 6px; text-decoration: none; flex: 1;
}
.btn-tt-primary { background: var(--az-primary); color: #fff; }
.btn-tt-secondary { background: rgba(255,255,255,0.12); color: #fff; }
.btn-tt-secondary:hover { background: rgba(255,255,255,0.18); }
.btn-tt-story {
  background: linear-gradient(135deg, rgba(254,44,85,0.2), rgba(37,244,238,0.15));
  border: 1px solid rgba(254,44,85,0.4); color: #fff;
}
.btn-tt-icon {
  width: 42px; flex: 0 0 42px; padding: 0; height: 40px; border-radius: 8px;
}

/* Bio & Linktree */
.tiktok-bio {
  font-size: 14px; line-height: 1.45; color: #eee;
  max-width: 460px; margin-bottom: 10px; white-space: pre-wrap;
}
.profile-links {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  margin-bottom: 14px;
}
.profile-link-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 16px;
  background: rgba(37, 244, 238, 0.1); border: 1px solid rgba(37, 244, 238, 0.3);
  color: var(--az-accent); font-size: 12px; font-weight: 600;
  text-decoration: none;
}

/* Referral Banner */
.referral-banner {
  width: 100%; max-width: 480px;
  background: linear-gradient(90deg, rgba(254,44,85,0.1), rgba(37,244,238,0.08));
  border: 1px dashed rgba(255,255,255,0.2); border-radius: 10px;
  padding: 8px 14px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; font-size: 13px;
}
.referral-banner .code { font-weight: 800; color: var(--az-accent); font-size: 13px; letter-spacing: 0.5px; }
.referral-banner button {
  background: rgba(255,255,255,0.12); border: none; color: #fff;
  padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
}

/* ==================== 2. WALLET & BALANCE CARD ==================== */
.wallet-strip {
  width: 100%; max-width: 480px;
  background: #111; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.wallet-strip .left { display: flex; align-items: center; gap: 12px; }
.wallet-strip .wallet-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: rgba(254,44,85,0.15); color: var(--az-primary);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.wallet-strip .bal-lbl { font-size: 11px; text-transform: uppercase; color: var(--az-text-secondary); font-weight: 700; }
.wallet-strip .bal-val { font-size: 18px; font-weight: 800; color: var(--az-accent); margin-top: 1px; }
.wallet-strip .btn-wallet {
  background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15);
  padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}

/* ==================== TABS ==================== */
.tt-tabs {
  max-width: 600px; margin: 0 auto;
  display: flex; border-bottom: 1px solid var(--az-border);
}
.tt-tab {
  flex: 1; padding: 12px 0; background: none; border: none;
  cursor: pointer; color: var(--az-text-secondary);
  font-size: 18px; position: relative; display: flex; align-items: center; justify-content: center;
}
.tt-tab.active { color: #fff; }
.tt-tab.active::after {
  content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
  height: 2px; background: #fff;
}
.tt-tab .tab-badge {
  position: absolute; top: 6px; right: 28%;
  background: var(--az-primary); color: #fff;
  font-size: 9px; font-weight: 800; border-radius: 10px;
  padding: 1px 5px;
}

/* ==================== POSTS GRID (TikTok 3x3) ==================== */
.profile-grid {
  max-width: 600px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 2px; padding: 2px 0;
}
.grid-item {
  position: relative; aspect-ratio: 9/16;
  background: #111; overflow: hidden; cursor: pointer;
}
.grid-item img, .grid-item video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.grid-item .badge-pinned {
  position: absolute; top: 6px; left: 6px;
  background: var(--az-primary); color: #fff;
  padding: 2px 6px; border-radius: 4px;
  font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 3px; z-index: 2;
}
.grid-item .views-counter {
  position: absolute; bottom: 6px; left: 6px;
  font-size: 11px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 4px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
.grid-item .del-btn {
  position: absolute; top: 6px; right: 6px;
  background: rgba(0,0,0,0.6); color: #ff4757;
  border: none; width: 26px; height: 26px; border-radius: 50%;
  font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  z-index: 3;
}

/* ==================== 💬 WALL / TESTIMONIALS ==================== */
.wall-container {
  max-width: 600px; margin: 0 auto; padding: 16px;
}
.wall-input-box {
  background: #151515; border: 1px solid var(--az-border);
  border-radius: 12px; padding: 12px; margin-bottom: 18px;
}
.wall-input-box textarea {
  width: 100%; min-height: 70px; background: transparent;
  border: none; color: #fff; font-family: inherit; font-size: 13px;
  outline: none; resize: vertical;
}
.wall-input-box button {
  float: right; margin-top: 6px;
  padding: 6px 16px; border-radius: 20px;
  background: var(--az-primary); color: #fff;
  border: none; font-weight: 700; font-size: 12px; cursor: pointer;
}
.wall-input-box::after { content: ''; display: table; clear: both; }
.wall-list { display: flex; flex-direction: column; gap: 10px; }
.wall-card {
  display: flex; gap: 10px; background: #121212;
  padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);
}
.wall-card .wav {
  width: 36px; height: 36px; border-radius: 50%;
  background: #333; overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.wall-card .wav img { width: 100%; height: 100%; object-fit: cover; }
.wall-card .wauthor { font-size: 13px; font-weight: 700; color: #fff; }
.wall-card .wtext { font-size: 13px; color: #ddd; margin-top: 3px; word-break: break-word; }
.wall-card .wtime { font-size: 11px; color: var(--az-text-secondary); margin-top: 4px; }

/* ==================== 📱 TIKTOK VERTICAL SWIPE FEED ==================== */
.tiktok-feed-modal {
  display: none; position: fixed; inset: 0;
  background: #000; z-index: 4000;
  overflow-y: scroll; scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
}
.tiktok-feed-modal.active { display: block; }
.tiktok-feed-close {
  position: fixed; top: 16px; left: 16px;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  color: #fff; border: none; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 4500;
}
.tiktok-post-slide {
  position: relative; width: 100%; height: 100vh; height: 100dvh;
  scroll-snap-align: start; scroll-snap-stop: always;
  display: flex; align-items: center; justify-content: center;
  background: #000; overflow: hidden;
}
.tiktok-post-slide video, .tiktok-post-slide img {
  width: 100%; height: 100%; object-fit: cover;
}
.tiktok-side-actions {
  position: absolute; right: 12px; bottom: 80px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  z-index: 4100;
}
.side-btn-wrap {
  display: flex; flex-direction: column; align-items: center;
  color: #fff; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
.side-btn-wrap .icon-circle {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; transition: transform 0.15s;
}
.side-btn-wrap .icon-circle:active { transform: scale(0.9); }
.side-btn-wrap.liked .icon-circle { color: #fe2c55; }
.side-btn-wrap .label { font-size: 11px; font-weight: 700; margin-top: 4px; }
.tiktok-bottom-info {
  position: absolute; bottom: 20px; left: 16px; right: 80px;
  color: #fff; z-index: 4100; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
.tiktok-bottom-info .uname { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.tiktok-bottom-info .ucaption { font-size: 13px; line-height: 1.4; max-height: 80px; overflow-y: auto; }

/* ==================== BOTTOM SHEETS & MODALS ==================== */
.modal-sheet {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); z-index: 5000;
  align-items: flex-end; justify-content: center;
}
.modal-sheet.active { display: flex; }
.modal-sheet-content {
  background: #181818; width: 100%; max-width: 500px;
  border-radius: 16px 16px 0 0; padding: 20px;
  max-height: 85vh; overflow-y: auto;
}
.modal-sheet-content .field { margin-bottom: 12px; }
.modal-sheet-content label { display: block; font-size: 12px; color: var(--az-text-secondary); margin-bottom: 4px; }
.modal-sheet-content input, .modal-sheet-content textarea {
  width: 100%; padding: 10px 12px; background: #0c0c0c;
  border: 1px solid var(--az-border); border-radius: 8px; color: #fff;
  font-family: inherit; font-size: 14px;
}
.modal-btn-row { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn-row button {
  flex: 1; padding: 12px; border-radius: 8px;
  font-size: 14px; font-weight: 700; cursor: pointer; border: none;
}

/* User List for Followers / Following */
.user-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.user-row .uav {
  width: 42px; height: 42px; border-radius: 50%;
  background: #333; overflow: hidden; display: flex; align-items: center; justify-content: center;
}
.user-row .uav img { width: 100%; height: 100%; object-fit: cover; }
.user-row .uinfo { flex: 1; }
.user-row .uinfo .uname { font-size: 14px; font-weight: 700; color: #fff; }
.user-row .uinfo .uhandle { font-size: 12px; color: var(--az-text-secondary); }
.user-row button {
  padding: 6px 14px; border-radius: 16px; font-size: 12px;
  font-weight: 700; cursor: pointer; border: none;
}

/* Toast */
.toast-msg {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,0.92); color: #000;
  padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 700;
  z-index: 9999; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.empty-view {
  text-align: center; padding: 60px 20px; color: var(--az-text-secondary);
}
.empty-view i { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
</style>
</head>
<body>

<div id="toast" class="toast-msg"></div>

<!-- ==================== TOP BAR ==================== -->
<header class="topbar">
  <a href="index.html" class="back"><i class="fas fa-chevron-left"></i></a>
  <span class="title" id="topbarUsername">@user</span>
  <div style="display:flex; gap:4px;">
    <button class="icon-btn" onclick="shareProfile()"><i class="fas fa-share-nodes"></i></button>
    <a href="chats.html" class="icon-btn" title="Messages"><i class="fas fa-paper-plane"></i></a>
    <button class="icon-btn" onclick="openEdit()"><i class="fas fa-bars"></i></button>
  </div>
</header>

<!-- Hidden File Pickers -->
<input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarSelected(event)">
<input type="file" id="storyFileInput" accept="image/*,video/*" style="display:none;" onchange="handleStorySelected(event)">

<!-- ==================== TIKTOK PROFILE CONTENT ==================== -->
<div id="profileContainer">
  <div class="tiktok-header">
    <div class="profile-avatar-wrap" id="avatarWrap" onclick="triggerAvatarUpload()">
      <div class="profile-avatar" id="avatarDisplay">U</div>
      <div class="camera-badge" id="cameraBtn" style="display:none;" title="Change Photo"><i class="fas fa-camera"></i></div>
    </div>

    <div class="tiktok-username">
      <span id="dispName">User</span>
      <i class="fas fa-circle-check" id="verifiedIcon" style="color:var(--az-accent); font-size:14px; display:none;"></i>
    </div>
    <div class="tiktok-handle" id="userHandle">@username</div>

    <!-- 4 Clickable Stats Columns -->
    <div class="tiktok-stats">
      <div class="stat-col" onclick="openFollowModal('following')">
        <span class="num" id="statFollowing">0</span>
        <span class="lbl">Following</span>
      </div>
      <div class="stat-col" onclick="openFollowModal('followers')">
        <span class="num" id="statFollowers">0</span>
        <span class="lbl">Followers</span>
      </div>
      <div class="stat-col" onclick="openViewsModal()">
        <span class="num" id="statViews">0</span>
        <span class="lbl">Views</span>
      </div>
      <div class="stat-col" onclick="scrollToPosts()">
        <span class="num" id="statPosts">0</span>
        <span class="lbl">Posts</span>
      </div>
    </div>

    <!-- Area 1: Action Buttons With Story Creation for Owner -->
    <div class="tiktok-actions" id="ownActions">
      <button class="btn-tt btn-tt-story" onclick="triggerStoryUpload()">
        <i class="fas fa-plus-circle" style="color:var(--az-primary);"></i> Story
      </button>
      <button class="btn-tt btn-tt-secondary" onclick="openEdit()">Edit profile</button>
      <button class="btn-tt btn-tt-secondary" onclick="shareProfile()">Share</button>
      <a href="Post.html" class="btn-tt btn-tt-primary btn-tt-icon" title="Create Post"><i class="fas fa-plus"></i></a>
    </div>

    <!-- Action Buttons for Visitors -->
    <div class="tiktok-actions" id="otherActions" style="display:none;">
      <button class="btn-tt btn-tt-primary" id="btnFollow" onclick="toggleFollow()"><i class="fas fa-user-plus"></i> Follow</button>
      <a class="btn-tt btn-tt-secondary" id="btnMsg" href="#"><i class="fas fa-paper-plane"></i> Message</a>
      <button class="btn-tt btn-tt-secondary btn-tt-icon" onclick="shareProfile()"><i class="fas fa-share-nodes"></i></button>
    </div>

    <!-- Bio -->
    <div class="tiktok-bio" id="userBio">Welcome to my profile! 🏜️</div>

    <!-- Linktree pills -->
    <div class="profile-links" id="linktreeContainer"></div>

    <!-- Referral Banner -->
    <div class="referral-banner" id="referralBox">
      <div>Referral: <span class="code" id="refCode">AZ-CREATOR</span></div>
      <button onclick="copyRef()"><i class="fas fa-copy"></i> Copy</button>
    </div>

    <!-- Area 2: Wallet & Balance Strip Under Referral -->
    <div class="wallet-strip" id="walletStrip">
      <div class="left">
        <div class="wallet-icon"><i class="fas fa-wallet"></i></div>
        <div>
          <div class="bal-lbl">Your Balance</div>
          <div class="bal-val" id="walletBalanceVal">$0.00</div>
        </div>
      </div>
      <a href="wallets.html" class="btn-wallet">
        <span>Wallet</span> <i class="fas fa-arrow-right"></i>
      </a>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tt-tabs">
    <button class="tt-tab active" onclick="switchTab('posts', this)"><i class="fas fa-bars-staggered"></i></button>
    <button class="tt-tab" onclick="switchTab('reels', this)"><i class="fas fa-play"></i></button>
    <button class="tt-tab" onclick="switchTab('wall', this)">
      <i class="fas fa-comment-dots"></i>
      <span class="tab-badge" id="wallCountBadge" style="display:none;">0</span>
    </button>
  </div>

  <!-- Posts Grid (3x3) -->
  <div class="profile-grid" id="postsGrid"></div>
  <div class="empty-view" id="emptyNotice" style="display:none;">
    <i class="fas fa-film"></i>
    <p>No content uploaded yet</p>
  </div>

  <!-- Wall Comments Tab -->
  <div class="wall-container" id="wallSection" style="display:none;">
    <div class="wall-input-box">
      <textarea id="wallInput" placeholder="Leave a comment on this profile..." maxlength="500"></textarea>
      <button onclick="sendWallComment()"><i class="fas fa-paper-plane"></i> Post</button>
    </div>
    <div class="wall-list" id="wallList"></div>
  </div>
</div>

<!-- ==================== 📱 FULLSCREEN VERTICAL SWIPE FEED ==================== -->
<div class="tiktok-feed-modal" id="tiktokSwipeFeed">
  <button class="tiktok-feed-close" onclick="closeSwipeFeed()"><i class="fas fa-times"></i></button>
  <div id="swipeSlidesContainer"></div>
</div>

<!-- ==================== FOLLOWERS / FOLLOWING MODAL ==================== -->
<div class="modal-sheet" id="followModal">
  <div class="modal-sheet-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="margin:0;" id="followModalTitle">Followers</h3>
      <button onclick="closeFollowModal()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <div id="followListContainer" style="max-height:50vh; overflow-y:auto;"></div>
  </div>
</div>

<!-- ==================== PROFILE VIEWS MODAL ==================== -->
<div class="modal-sheet" id="viewsModal">
  <div class="modal-sheet-content" style="text-align:center;">
    <i class="fas fa-eye" style="font-size:36px; color:var(--az-accent); margin-bottom:10px;"></i>
    <h3 style="margin:0 0 6px;">Profile Views</h3>
    <div style="font-size:28px; font-weight:800; color:var(--az-primary); margin-bottom:6px;" id="modalViewsCount">0</div>
    <p style="font-size:13px; color:var(--az-text-secondary); margin-bottom:20px;">Total visits received on this profile.</p>
    <div class="modal-btn-row">
      <button style="background:rgba(255,255,255,0.12); color:#fff;" onclick="closeViewsModal()">Close</button>
    </div>
  </div>
</div>

<!-- ==================== EDIT PROFILE SHEET ==================== -->
<div class="modal-sheet" id="editSheet">
  <div class="modal-sheet-content">
    <h3 style="margin-top:0; text-align:center;">Edit Profile</h3>
    <div class="field">
      <label>Display Name</label>
      <input type="text" id="editDisplayName" maxlength="50">
    </div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="editUsername" maxlength="30">
    </div>
    <div class="field">
      <label>Bio</label>
      <textarea id="editBio" maxlength="250" rows="3"></textarea>
    </div>
    <div class="field">
      <label>Custom Links (Format: Title|URL, one per line)</label>
      <textarea id="editLinks" rows="3" placeholder="YouTube|https://youtube.com/@me&#10;My Store|https://shop.com"></textarea>
    </div>
    <div class="modal-btn-row">
      <button style="background:rgba(255,255,255,0.1); color:#fff;" onclick="closeEdit()">Cancel</button>
      <button style="background:var(--az-primary); color:#fff;" id="btnSaveProfile" onclick="saveProfileChanges()">Save</button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
/* ==================== STATE ==================== */
let profileId = null;
let isOwner = false;
let posts = [];
let isFollowing = false;
let currentTab = 'posts';
let currentSlideIndex = 0;
let userFollowers = [];
let userFollowing = [];

/* ==================== INITIALIZATION ==================== */
document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      boot();
    }
  }, 100);
});

async function boot() {
  const params = new URLSearchParams(window.location.search);
  const targetUser = params.get('user');

  if (!currentUser && !targetUser) {
    window.location.href = 'login.html';
    return;
  }

  profileId = targetUser || currentUser.id;
  isOwner = currentUser && profileId === currentUser.id;

  if (isOwner) {
    document.getElementById('ownActions').style.display = 'flex';
    document.getElementById('otherActions').style.display = 'none';
    document.getElementById('cameraBtn').style.display = 'flex';
    document.getElementById('walletStrip').style.display = 'flex';
  } else {
    document.getElementById('ownActions').style.display = 'none';
    document.getElementById('otherActions').style.display = 'flex';
    document.getElementById('btnMsg').href = `chats.html?user=${profileId}`;
    document.getElementById('walletStrip').style.display = 'none';
    checkFollowState();
    logProfileView();
  }

  await loadProfile();
  await loadWallet();
  await loadPosts();
  await checkStories();
}

/* ==================== LOG & LOAD PROFILE ==================== */
async function logProfileView() {
  try {
    await supabaseClient.rpc('log_profile_view', { p_profile_id: profileId });
  } catch (e) {
    try {
      await supabaseClient.from('profiles').update({
        profile_views: supabaseClient.raw('COALESCE(profile_views, 0) + 1')
      }).eq('id', profileId);
    } catch(err) {}
  }
}

async function loadProfile() {
  const { data: p } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', profileId)
    .maybeSingle();

  if (!p) return;

  const uname = p.username || 'user';
  document.getElementById('topbarUsername').textContent = '@' + uname;
  document.getElementById('userHandle').textContent = '@' + uname;
  document.getElementById('dispName').textContent = p.display_name || uname;
  document.getElementById('userBio').textContent = p.bio || 'Arizona AI member 🏜️';

  document.getElementById('statFollowing').textContent = p.following_count ?? 0;
  document.getElementById('statFollowers').textContent = p.followers_count ?? 0;
  document.getElementById('statPosts').textContent = p.posts_count ?? 0;
  const views = p.profile_views ?? 0;
  document.getElementById('statViews').textContent = views;
  document.getElementById('modalViewsCount').textContent = views;

  if (p.is_verified) {
    document.getElementById('verifiedIcon').style.display = 'inline-block';
  }

  const avEl = document.getElementById('avatarDisplay');
  if (p.avatar_url) {
    avEl.innerHTML = `<img src="${escapeHtml(p.avatar_url)}" alt="">`;
  } else {
    avEl.textContent = uname.charAt(0).toUpperCase();
  }

  const code = p.referral_code || ('AZ-' + uname.toUpperCase().slice(0, 6));
  document.getElementById('refCode').textContent = code;

  renderLinks(p.links);
}

/* ==================== WALLET & BALANCE ==================== */
async function loadWallet() {
  if (!isOwner) return;
  try {
    const { data: w } = await supabaseClient
      .from('wallets')
      .select('balance')
      .eq('user_id', currentUser.id)
      .maybeSingle();

    if (w) {
      document.getElementById('walletBalanceVal').textContent = '$' + Number(w.balance || 0).toFixed(2);
    }
  } catch(e) {}
}

/* ==================== STORY STATUS ==================== */
async function checkStories() {
  try {
    const { data } = await supabaseClient
      .from('stories')
      .select('id')
      .eq('user_id', profileId)
      .gt('expires_at', new Date().toISOString())
      .limit(1);

    if (data && data.length > 0) {
      document.getElementById('avatarWrap').classList.add('has-story');
    }
  } catch(e) {}
}

function triggerStoryUpload() {
  document.getElementById('storyFileInput').click();
}

async function handleStorySelected(e) {
  const file = e.target.files[0];
  if (!file) return;

  toast('Uploading story...');
  try {
    const isVideo = file.type.startsWith('video/');
    const ext = file.name.split('.').pop();
    const path = `${currentUser.id}/story-${Date.now()}.${ext}`;

    const { data: up, error: upErr } = await supabaseClient.storage
      .from('stories')
      .upload(path, file, { cacheControl: '3600' });
    if (upErr) throw upErr;

    const { data: pub } = supabaseClient.storage.from('stories').getPublicUrl(up.path);
    const expiresAt = new Date(Date.now() + 24 * 3600 * 1000).toISOString();

    await supabaseClient.from('stories').insert({
      user_id: currentUser.id,
      media_url: pub.publicUrl,
      media_type: isVideo ? 'video' : 'image',
      expires_at: expiresAt
    });

    toast('Story posted for 24 hours! 🎉');
    document.getElementById('avatarWrap').classList.add('has-story');
  } catch (err) {
    toast(err.message || 'Story upload failed');
  }
}

/* ==================== CUSTOM LINKTREE LINKS ==================== */
function renderLinks(links) {
  const container = document.getElementById('linktreeContainer');
  let arr = [];
  if (Array.isArray(links)) arr = links;
  else if (typeof links === 'string' && links.trim()) {
    try { arr = JSON.parse(links); } catch(e){}
  }

  if (arr.length > 0) {
    container.innerHTML = arr.map(l => `
      <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener" class="profile-link-pill">
        <i class="fas fa-link"></i> ${escapeHtml(l.title)}
      </a>
    `).join('');
    container.style.display = 'flex';
  } else {
    container.innerHTML = '';
    container.style.display = 'none';
  }
}

/* ==================== POSTS & PINNED SORTING ==================== */
async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;"><i class="fas fa-spinner fa-spin"></i></div>';

  try {
    const { data, error } = await supabaseClient
      .from('posts')
      .select('*')
      .eq('user_id', profileId)
      .order('is_pinned', { ascending: false, nullsFirst: false })
      .order('created_at', { ascending: false });

    if (error) throw error;
    posts = data || [];
    renderPostsGrid();
  } catch (err) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#fe2c55;">${escapeHtml(err.message)}</div>`;
  }
}

function renderPostsGrid() {
  const grid = document.getElementById('postsGrid');
  const empty = document.getElementById('emptyNotice');

  let list = posts;
  if (currentTab === 'reels') {
    list = posts.filter(p => p.post_type === 'reel' || (p.media_urls && p.media_urls.some(u => /\.(mp4|webm|mov)$/i.test(u))));
  }

  if (list.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = list.map((p, idx) => {
    const media = (p.media_urls && p.media_urls[0]) || '';
    const isVideo = /\.(mp4|webm|mov)$/i.test(media);

    const mediaTag = isVideo
      ? `<video src="${escapeHtml(media)}#t=0.001" preload="metadata" muted></video>`
      : (media ? `<img src="${escapeHtml(media)}" loading="lazy">` : `<div style="padding:10px;font-size:12px;color:#aaa;">${escapeHtml((p.content||'').slice(0,50))}</div>`);

    const pinBadge = p.is_pinned ? `<div class="badge-pinned"><i class="fas fa-thumbtack"></i> Pinned</div>` : '';
    const delBtn = isOwner ? `<button class="del-btn" onclick="event.stopPropagation(); deletePost('${p.id}')"><i class="fas fa-trash"></i></button>` : '';

    return `
      <div class="grid-item" onclick="openSwipeFeed(${idx})">
        ${mediaTag}
        ${pinBadge}
        ${delBtn}
        <div class="views-counter"><i class="fas fa-play"></i> ${p.views_count || 0}</div>
      </div>
    `;
  }).join('');
}

/* ==================== 📱 TIKTOK VERTICAL SWIPE FEED ==================== */
function openSwipeFeed(startIndex = 0) {
  const modal = document.getElementById('tiktokSwipeFeed');
  const container = document.getElementById('swipeSlidesContainer');

  let list = posts;
  if (currentTab === 'reels') {
    list = posts.filter(p => p.post_type === 'reel' || (p.media_urls && p.media_urls.some(u => /\.(mp4|webm|mov)$/i.test(u))));
  }
  if (!list.length) return;

  currentSlideIndex = startIndex;
  container.innerHTML = list.map((p, i) => {
    const media = (p.media_urls && p.media_urls[0]) || '';
    const isVideo = /\.(mp4|webm|mov)$/i.test(media);

    const mediaElem = isVideo
      ? `<video id="slide-vid-${i}" src="${escapeHtml(media)}" loop playsinline onclick="toggleVideoPlay(this)"></video>`
      : (media ? `<img src="${escapeHtml(media)}">` : `<div style="padding:40px;text-align:center;font-size:18px;">${escapeHtml(p.content||'')}</div>`);

    const pinBtn = isOwner ? `
      <div class="side-btn-wrap" onclick="togglePin('${p.id}', ${!p.is_pinned})">
        <div class="icon-circle"><i class="fas fa-thumbtack"></i></div>
        <span class="label">${p.is_pinned ? 'Unpin' : 'Pin'}</span>
      </div>` : '';

    return `
      <div class="tiktok-post-slide" id="slide-${i}">
        ${mediaElem}
        
        <!-- TikTok Floating Right Side Actions -->
        <div class="tiktok-side-actions">
          <div class="side-btn-wrap" onclick="likePost('${p.id}', this)">
            <div class="icon-circle"><i class="fas fa-heart"></i></div>
            <span class="label">${p.likes_count || 0}</span>
          </div>
          <div class="side-btn-wrap" onclick="toast('Comments')">
            <div class="icon-circle"><i class="fas fa-comment-dots"></i></div>
            <span class="label">${p.comments_count || 0}</span>
          </div>
          ${pinBtn}
          <div class="side-btn-wrap" onclick="sharePost('${p.id}')">
            <div class="icon-circle"><i class="fas fa-share"></i></div>
            <span class="label">Share</span>
          </div>
        </div>

        <div class="tiktok-bottom-info">
          <div class="uname">@${escapeHtml(document.getElementById('topbarUsername').textContent.replace('@',''))}</div>
          <div class="ucaption">${escapeHtml(p.content || '')}</div>
        </div>
      </div>
    `;
  }).join('');

  modal.classList.add('active');
  document.body.style.overflow = 'hidden';

  setTimeout(() => {
    const target = document.getElementById(`slide-${startIndex}`);
    if (target) target.scrollIntoView();
    playSlideVideo(startIndex);
  }, 50);

  setupIntersectionObserver();
}

function closeSwipeFeed() {
  const modal = document.getElementById('tiktokSwipeFeed');
  modal.classList.remove('active');
  document.body.style.overflow = '';
  document.querySelectorAll('.tiktok-post-slide video').forEach(v => v.pause());
}

function toggleVideoPlay(video) {
  if (video.paused) video.play();
  else video.pause();
}

function playSlideVideo(idx) {
  document.querySelectorAll('.tiktok-post-slide video').forEach((vid, i) => {
    if (i === idx) vid.play().catch(()=>{});
    else vid.pause();
  });
}

function setupIntersectionObserver() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idParts = entry.target.id.split('-');
        const idx = parseInt(idParts[1]);
        currentSlideIndex = idx;
        playSlideVideo(idx);
      }
    });
  }, { threshold: 0.6 });

  document.querySelectorAll('.tiktok-post-slide').forEach(slide => observer.observe(slide));
}

/* ==================== 📌 PIN POSTS ==================== */
async function togglePin(postId, shouldPin) {
  if (!isOwner || !currentUser) return;
  try {
    const { error } = await supabaseClient
      .from('posts')
      .update({ is_pinned: shouldPin })
      .eq('id', postId)
      .eq('user_id', currentUser.id);

    if (error) throw error;
    toast(shouldPin ? 'Pinned to top 📌' : 'Unpinned');
    closeSwipeFeed();
    await loadPosts();
  } catch (err) {
    toast(err.message);
  }
}

async function deletePost(postId) {
  if (!confirm('Delete this post?')) return;
  try {
    await supabaseClient.from('posts').delete().eq('id', postId).eq('user_id', currentUser.id);
    posts = posts.filter(p => p.id !== postId);
    renderPostsGrid();
    toast('Post deleted');
  } catch(err) {
    toast(err.message);
  }
}

async function likePost(postId, btn) {
  if (!currentUser) { toast('Sign in to like'); return; }
  try {
    await supabaseClient.from('likes').insert({ user_id: currentUser.id, post_id: postId });
    btn.classList.add('liked');
    toast('Liked ❤️');
  } catch (e) {
    await supabaseClient.from('likes').delete().eq('user_id', currentUser.id).eq('post_id', postId);
    btn.classList.remove('liked');
    toast('Unliked');
  }
}

/* ==================== FOLLOWERS / FOLLOWING MODAL ==================== */
async function openFollowModal(type) {
  const modal = document.getElementById('followModal');
  const title = document.getElementById('followModalTitle');
  const container = document.getElementById('followListContainer');

  title.textContent = type === 'followers' ? 'Followers' : 'Following';
  container.innerHTML = '<div style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i></div>';
  modal.classList.add('active');

  try {
    const idField = type === 'followers' ? 'follower_id' : 'following_id';
    const matchField = type === 'followers' ? 'following_id' : 'follower_id';

    const { data: rows } = await supabaseClient
      .from('follows')
      .select(`${idField}`)
      .eq(matchField, profileId);

    const ids = (rows || []).map(r => r[idField]);
    if (ids.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:30px;color:var(--az-text-secondary);">No ${type} yet</div>`;
      return;
    }

    const { data: users } = await supabaseClient
      .from('profiles')
      .select('id, username, display_name, avatar_url')
      .in('id', ids);

    container.innerHTML = (users || []).map(u => {
      const name = u.display_name || u.username || 'User';
      const av = u.avatar_url ? `<img src="${escapeHtml(u.avatar_url)}">` : name.charAt(0).toUpperCase();

      return `
        <div class="user-row" onclick="window.location.href='profile.html?user=${u.id}'" style="cursor:pointer;">
          <div class="uav">${av}</div>
          <div class="uinfo">
            <div class="uname">${escapeHtml(name)}</div>
            <div class="uhandle">@${escapeHtml(u.username||'user')}</div>
          </div>
          <button style="background:rgba(255,255,255,0.12); color:#fff;">View</button>
        </div>
      `;
    }).join('');
  } catch (err) {
    container.innerHTML = `<div style="color:#fe2c55;text-align:center;">${escapeHtml(err.message)}</div>`;
  }
}

function closeFollowModal() {
  document.getElementById('followModal').classList.remove('active');
}

/* ==================== VIEWS MODAL ==================== */
function openViewsModal() {
  document.getElementById('viewsModal').classList.add('active');
}
function closeViewsModal() {
  document.getElementById('viewsModal').classList.remove('active');
}

function scrollToPosts() {
  switchTab('posts', document.querySelectorAll('.tt-tab')[0]);
  document.getElementById('postsGrid').scrollIntoView({ behavior: 'smooth' });
}

/* ==================== 💬 WALL COMMENTS ==================== */
async function loadWall() {
  const list = document.getElementById('wallList');
  list.innerHTML = '<div style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i></div>';

  try {
    const { data, error } = await supabaseClient
      .from('profile_comments')
      .select('*, profiles:user_id(username, display_name, avatar_url)')
      .eq('profile_id', profileId)
      .order('created_at', { ascending: false });

    if (error) throw error;

    const count = data ? data.length : 0;
    const badge = document.getElementById('wallCountBadge');
    if (count > 0) {
      badge.textContent = count;
      badge.style.display = 'block';
    }

    if (!data || data.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">No comments yet. Say something!</div>';
      return;
    }

    list.innerHTML = data.map(c => {
      const p = c.profiles || {};
      const name = p.display_name || p.username || 'User';
      const av = p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}">` : name.charAt(0).toUpperCase();

      return `
        <div class="wall-card">
          <div class="wav">${av}</div>
          <div style="flex:1;">
            <div class="wauthor">${escapeHtml(name)}</div>
            <div class="wtext">${escapeHtml(c.content)}</div>
            <div class="wtime">${new Date(c.created_at).toLocaleDateString()}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    list.innerHTML = `<div style="color:#fe2c55;text-align:center;">${escapeHtml(err.message)}</div>`;
  }
}

async function sendWallComment() {
  if (!currentUser) { toast('Please log in'); return; }
  const input = document.getElementById('wallInput');
  const text = input.value.trim();
  if (!text) return;

  try {
    const { error } = await supabaseClient.from('profile_comments').insert({
      profile_id: profileId,
      user_id: currentUser.id,
      content: text
    });
    if (error) throw error;
    input.value = '';
    toast('Comment posted 💬');
    await loadWall();
  } catch (err) {
    toast(err.message);
  }
}

/* ==================== FOLLOW / UNFOLLOW ==================== */
async function checkFollowState() {
  if (!currentUser) return;
  const { data } = await supabaseClient
    .from('follows')
    .select('follower_id')
    .eq('follower_id', currentUser.id)
    .eq('following_id', profileId)
    .maybeSingle();

  isFollowing = !!data;
  updateFollowBtn();
}

function updateFollowBtn() {
  const btn = document.getElementById('btnFollow');
  if (!btn) return;
  if (isFollowing) {
    btn.className = 'btn-tt btn-tt-secondary';
    btn.innerHTML = '<i class="fas fa-check"></i> Following';
  } else {
    btn.className = 'btn-tt btn-tt-primary';
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Follow';
  }
}

async function toggleFollow() {
  if (!currentUser) { toast('Please sign in'); return; }
  const btn = document.getElementById('btnFollow');
  btn.disabled = true;

  try {
    if (isFollowing) {
      await supabaseClient.from('follows').delete()
        .eq('follower_id', currentUser.id)
        .eq('following_id', profileId);
      isFollowing = false;
      toast('Unfollowed');
    } else {
      await supabaseClient.from('follows').insert({
        follower_id: currentUser.id,
        following_id: profileId
      });
      isFollowing = true;
      toast('Following ✅');
    }
    updateFollowBtn();
    const { data: p } = await supabaseClient.from('profiles').select('followers_count').eq('id', profileId).single();
    if (p) document.getElementById('statFollowers').textContent = p.followers_count ?? 0;
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
  }
}

/* ==================== EDIT PROFILE & LINKS ==================== */
function openEdit() {
  if (!isOwner) return;
  const p = currentProfile || {};
  document.getElementById('editDisplayName').value = document.getElementById('dispName').textContent || '';
  document.getElementById('editUsername').value = document.getElementById('userHandle').textContent.replace('@','') || '';
  document.getElementById('editBio').value = document.getElementById('userBio').textContent || '';

  let arr = [];
  if (Array.isArray(p.links)) arr = p.links;
  else if (typeof p.links === 'string' && p.links.trim()) {
    try { arr = JSON.parse(p.links); } catch(e){}
  }
  document.getElementById('editLinks').value = arr.map(l => `${l.title || ''}|${l.url || ''}`).join('\n');

  document.getElementById('editSheet').classList.add('active');
}
function closeEdit() { document.getElementById('editSheet').classList.remove('active'); }

async function saveProfileChanges() {
  const btn = document.getElementById('btnSaveProfile');
  btn.disabled = true;

  const display_name = document.getElementById('editDisplayName').value.trim();
  const username = document.getElementById('editUsername').value.trim();
  const bio = document.getElementById('editBio').value.trim();

  const rawLinks = document.getElementById('editLinks').value.trim();
  const links = rawLinks ? rawLinks.split('\n').map(line => {
    const parts = line.split('|');
    return { title: (parts[0] || '').trim(), url: (parts[1] || '').trim() };
  }).filter(l => l.title && l.url) : [];

  try {
    const { error } = await supabaseClient.from('profiles').update({
      display_name, username, bio, links
    }).eq('id', currentUser.id);

    if (error) throw error;
    closeEdit();
    toast('Profile saved ✅');
    await loadProfile();
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
  }
}

/* ==================== AVATAR UPLOAD ==================== */
function triggerAvatarUpload() {
  if (!isOwner) return;
  document.getElementById('avatarFileInput').click();
}

async function handleAvatarSelected(e) {
  const file = e.target.files[0];
  if (!file) return;

  toast('Uploading photo...');
  try {
    const ext = file.name.split('.').pop();
    const path = `${currentUser.id}/avatar-${Date.now()}.${ext}`;

    const { data: up, error: upErr } = await supabaseClient.storage
      .from('avatars')
      .upload(path, file, { upsert: true });
    if (upErr) throw upErr;

    const { data: pub } = supabaseClient.storage.from('avatars').getPublicUrl(up.path);
    await supabaseClient.from('profiles').update({ avatar_url: pub.publicUrl }).eq('id', currentUser.id);

    toast('Avatar updated!');
    document.getElementById('avatarDisplay').innerHTML = `<img src="${pub.publicUrl}">`;
  } catch (err) {
    toast(err.message);
  }
}

/* ==================== HELPERS ==================== */
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tt-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const grid = document.getElementById('postsGrid');
  const wall = document.getElementById('wallSection');

  if (tab === 'wall') {
    grid.style.display = 'none';
    wall.style.display = 'block';
    loadWall();
  } else {
    wall.style.display = 'none';
    grid.style.display = 'grid';
    renderPostsGrid();
  }
}

function shareProfile() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: 'Profile', url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(() => toast('Link copied to clipboard 📋'));
  }
}

function sharePost(postId) {
  const url = `${window.location.origin}/index.html?post=${postId}`;
  navigator.clipboard.writeText(url).then(() => toast('Post link copied! 📋'));
}

function copyRef() {
  const code = document.getElementById('refCode').textContent;
  navigator.clipboard.writeText(code).then(() => toast('Referral code copied!'));
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._tTimer);
  window._tTimer = setTimeout(() => { el.style.display = 'none'; }, 2200);
}
</script>
