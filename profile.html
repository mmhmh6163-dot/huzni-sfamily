<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Profile — Arizona AI</title>

<link rel="icon" type="image/jpeg" href="arizonan%20png%20icon.jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
/* ==================== 1. CSS VARIABLES & BASE RESET ==================== */
:root {
  --az-bg: #0a0a0a;
  --az-card: #151515;
  --az-border: rgba(255, 255, 255, 0.08);
  --az-primary: #FF6B35;
  --az-accent: #FFB20F;
  --az-gradient: linear-gradient(135deg, #FF6B35, #FFB20F);
  --az-danger: #ff4757;
  --az-text: #FFFFFF;
  --az-text-secondary: #8e8e93;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: var(--az-bg); color: var(--az-text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}

body {
  padding-top: calc(56px + env(safe-area-inset-top));
  padding-bottom: calc(70px + env(safe-area-inset-bottom));
}

/* ==================== 2. PWA SAFE TOPBAR ==================== */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: calc(56px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  background: rgba(10,10,10,.95); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--az-border);
  display: flex; align-items: center; justify-content: space-between;
  padding-left: 14px; padding-right: 14px; z-index: 1000;
  max-width: 680px; margin: 0 auto;
}
.topbar .title {
  font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 5px;
}
.topbar .actions { display: flex; align-items: center; gap: 2px; }
.topbar .icon-btn {
  color: var(--az-text); font-size: 18px; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; text-decoration: none; cursor: pointer;
  background: none; border: none; transition: background .15s;
}
.topbar .icon-btn:active { background: rgba(255,255,255,.1); }

/* ==================== 3. TIKTOK-STYLE PROFILE HEADER ==================== */
.profile-wrap { max-width: 680px; margin: 0 auto; padding: 14px 16px 0; }

.tt-profile-head {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  margin-bottom: 16px;
}
.avatar-container { position: relative; margin-bottom: 10px; cursor: pointer; }
.profile-avatar {
  width: 90px; height: 90px; border-radius: 50%;
  background: var(--az-gradient);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 800; color: #fff;
  border: 3px solid #0a0a0a; box-shadow: 0 0 0 2px var(--az-border);
  overflow: hidden; position: relative; z-index: 1;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Story Gradient Rings */
.avatar-container.has-story::before {
  content:''; position: absolute; inset: -4px; border-radius: 50%;
  background: conic-gradient(from 0deg, #FF6B35, #FFB20F, #7c3aed, #FF6B35);
  animation: storyRingSpin 4s linear infinite; z-index: 0;
}
@keyframes storyRingSpin { to { transform: rotate(360deg); } }

.avatar-cam-btn {
  position: absolute; bottom: 0; right: 0; width: 28px; height: 28px;
  border-radius: 50%; background: var(--az-primary); color: #fff;
  border: 2px solid #0a0a0a; font-size: 12px; display: flex;
  align-items: center; justify-content: center; cursor: pointer; z-index: 5;
}

.user-names h1 {
  font-size: 18px; font-weight: 800; margin: 0;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.user-names .username-tag {
  font-size: 13px; color: var(--az-text-secondary); margin-top: 2px;
}

/* TikTok Triplet Stats */
.tt-stats {
  display: flex; justify-content: center; gap: 26px; margin: 14px 0 16px;
}
.tt-stat-item { text-align: center; cursor: pointer; }
.tt-stat-item .num { font-size: 18px; font-weight: 800; color: #fff; }
.tt-stat-item .lbl { font-size: 11.5px; color: var(--az-text-secondary); margin-top: 1px; }

/* Compact Bio & Links */
.profile-bio {
  font-size: 13.5px; line-height: 1.45; max-width: 440px; margin: 0 auto 10px;
  text-align: center; white-space: pre-wrap;
}
.profile-links {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 14px;
}
.profile-link-item {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 16px;
  background: rgba(255, 107, 53, 0.12); border: 1px solid rgba(255, 107, 53, 0.35);
  color: var(--az-accent); font-size: 12px; font-weight: 700; text-decoration: none;
}

/* Side Referral Pill */
.referral-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 20px;
  background: linear-gradient(135deg, rgba(255,178,15,.15), rgba(255,107,53,.15));
  border: 1px dashed var(--az-accent); font-size: 12px; font-weight: 700;
  color: var(--az-accent); cursor: pointer; margin-bottom: 14px;
}

/* TikTok Action Button Bar */
.tt-action-row {
  display: flex; gap: 8px; width: 100%; max-width: 440px; margin: 0 auto 16px;
}
.tt-action-row button, .tt-action-row a {
  flex: 1; padding: 10px 14px; border-radius: 8px;
  font-size: 13px; font-weight: 700; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  text-decoration: none; border: none; cursor: pointer;
}
.btn-primary-action { background: var(--az-gradient); color: #fff; }
.btn-secondary-action {
  background: rgba(255,255,255,.08); color: #fff; border: 1px solid var(--az-border);
}
.btn-secondary-action:active { background: rgba(255,255,255,.14); }

/* ==================== 4. TRIBES & STORIES STRIP ==================== */
.horizontal-section { margin-bottom: 14px; }
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; font-weight: 800; color: var(--az-text-secondary);
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;
}
.horizontal-scroll-row {
  display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px;
}
.horizontal-scroll-row::-webkit-scrollbar { display: none; }

.tribe-chip {
  min-width: 130px; background: rgba(94,184,255,.08);
  border: 1px solid rgba(94,184,255,.25); border-radius: 12px;
  padding: 8px 12px; display: flex; align-items: center; gap: 8px;
  cursor: pointer; flex-shrink: 0;
}
.tribe-chip .tav {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg,#7c3aed,#5eb8ff);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
  overflow: hidden;
}
.tribe-chip .tname { font-size: 12.5px; font-weight: 700; color: #fff; }
.tribe-chip .tsub { font-size: 10px; color: var(--az-text-secondary); }

/* ==================== 5. CONTENT TABS ==================== */
.profile-tabs {
  display: flex; border-top: 1px solid var(--az-border); border-bottom: 1px solid var(--az-border);
  margin-top: 10px;
}
.profile-tabs .tab {
  flex: 1; padding: 13px 0; background: none; border: none; cursor: pointer;
  color: var(--az-text-secondary); font-size: 18px; display: flex;
  align-items: center; justify-content: center; position: relative;
}
.profile-tabs .tab.active { color: var(--az-primary); }
.profile-tabs .tab.active::after {
  content: ''; position: absolute; bottom: 0; left: 25%; right: 25%;
  height: 2px; background: var(--az-primary); border-radius: 2px;
}

/* Grid layout */
.profile-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px 0;
}
.grid-item {
  position: relative; aspect-ratio: 3/4; background: #161616; overflow: hidden; cursor: pointer;
}
.grid-item img, .grid-item video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.grid-item .pinned-badge {
  position: absolute; top: 6px; left: 6px;
  background: var(--az-accent); color: #000;
  padding: 2px 6px; border-radius: 6px; font-size: 9px; font-weight: 800; z-index: 2;
}
.grid-item .views-count {
  position: absolute; bottom: 6px; left: 6px; color: #fff;
  font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px;
  text-shadow: 0 1px 3px rgba(0,0,0,.8);
}

/* ==================== 6. FULL-SCREEN VERTICAL SWIPE FEED ==================== */
.swipe-feed-modal {
  display: none; position: fixed; inset: 0; background: #000; z-index: 4000;
}
.swipe-feed-modal.active { display: block; }
.swipe-feed-container {
  width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.swipe-feed-container::-webkit-scrollbar { display: none; }

.snap-card {
  width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  position: relative; display: flex; align-items: center; justify-content: center;
  background: #000;
}
.snap-card .media-box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.snap-card img, .snap-card video { width: 100%; height: 100%; object-fit: contain; }

.snap-close-btn {
  position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 16px;
  width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.6);
  color: #fff; border: none; font-size: 18px; z-index: 50; cursor: pointer;
  display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);
}

/* Right Floating Action Column (TikTok Style) */
.snap-side-actions {
  position: absolute; right: 12px; bottom: calc(85px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 40;
}
.snap-action-btn {
  background: none; border: none; color: #fff; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.snap-action-btn .icon-circle {
  width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.15);
  backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
  font-size: 20px; transition: transform .15s;
}
.snap-action-btn:active .icon-circle { transform: scale(.85); }
.snap-action-btn.liked .icon-circle { color: var(--az-danger); background: rgba(255,71,87,.25); }
.snap-action-btn span { font-size: 11px; font-weight: 700; }

/* Bottom Content Info */
.snap-bottom-info {
  position: absolute; left: 16px; right: 75px;
  bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 40;
}
.snap-creator { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
.snap-caption { font-size: 13.5px; line-height: 1.4; color: #eee; margin-bottom: 8px; }

/* ==================== 7. SEARCH OVERLAY ==================== */
.search-modal {
  display: none; position: fixed; inset: 0; background: rgba(10,10,10,.98);
  padding: calc(20px + env(safe-area-inset-top)) 16px 20px; z-index: 3500;
  max-width: 680px; margin: 0 auto;
}
.search-modal.active { display: flex; flex-direction: column; }
.search-input-wrap { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
.search-input-wrap input {
  flex: 1; padding: 12px 16px; background: #1a1a1a; border: 1px solid var(--az-border);
  border-radius: 12px; color: #fff; font-size: 14px; outline: none;
}
.search-results-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

/* ==================== 8. GENERAL MODALS & TOAST ==================== */
.modal-backdrop {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
  backdrop-filter: blur(6px); z-index: 3000; align-items: flex-end; justify-content: center;
}
.modal-backdrop.active { display: flex; }
.modal-content {
  background: #161616; width: 100%; max-width: 640px;
  border-top-left-radius: 20px; border-top-right-radius: 20px;
  padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
  max-height: 85vh; overflow-y: auto;
}
.modal-content .handle {
  width: 40px; height: 4px; background: #333; border-radius: 2px; margin: 0 auto 16px;
}
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions button {
  flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer;
}
.mini-toast {
  position: fixed; bottom: calc(85px + env(safe-area-inset-bottom)); left: 50%;
  transform: translateX(-50%) translateY(20px); background: #222;
  border: 1px solid var(--az-primary); color: #fff; padding: 10px 18px;
  border-radius: 22px; font-size: 13px; font-weight: 700; z-index: 9999;
  opacity: 0; pointer-events: none; transition: all .25s ease;
}
.mini-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay"><div class="loader"></div></div>

<!-- HIDDEN FILE INPUTS -->
<input type="file" id="avatarInput" accept="image/*" style="display:none;">
<input type="file" id="storyFileInput" accept="image/*,video/*" style="display:none;">

<!-- ==================== TOP BAR ==================== -->
<header class="topbar" id="topbar">
  <a href="index.html" class="icon-btn"><i class="fas fa-arrow-left"></i></a>
  <span class="title" id="topbarTitle">@user</span>
  <div class="actions">
    <button class="icon-btn" onclick="openSearchOverlay()" title="Search Creators"><i class="fas fa-search"></i></button>
    <a href="wallets.html" class="icon-btn" title="My Wallet"><i class="fas fa-wallet" style="color:var(--az-accent);"></i></a>
    <button class="icon-btn" onclick="shareProfile()" title="Share Profile"><i class="fas fa-share-nodes"></i></button>
    <button class="icon-btn" onclick="openSettings()" title="Settings"><i class="fas fa-ellipsis-vertical"></i></button>
  </div>
</header>

<!-- ==================== MAIN PROFILE ==================== -->
<main class="profile-wrap" id="profileContent" style="display:none;">

  <div class="tt-profile-head">
    <div class="avatar-container" id="avatarWrap" onclick="openAvatarViewer()">
      <div class="profile-avatar" id="avatar">U</div>
      <div class="avatar-cam-btn" id="avatarCam" onclick="event.stopPropagation(); triggerAvatarPick();" style="display:none;">
        <i class="fas fa-camera"></i>
      </div>
    </div>

    <div class="user-names">
      <h1><span id="displayName">User</span> <i class="fas fa-circle-check" id="nameVerified" style="color:#3b82f6;display:none;"></i></h1>
      <div class="username-tag" id="usernameMeta">@username</div>
    </div>

    <!-- TikTok Three Stats (Following, Followers, Likes) -->
    <div class="tt-stats">
      <div class="tt-stat-item" onclick="openFollowers('following')">
        <div class="num" id="statFollowing">0</div>
        <div class="lbl">Following</div>
      </div>
      <div class="tt-stat-item" onclick="openFollowers('followers')">
        <div class="num" id="statFollowers">0</div>
        <div class="lbl">Followers</div>
      </div>
      <div class="tt-stat-item">
        <div class="num" id="statLikes">0</div>
        <div class="lbl">Likes</div>
      </div>
    </div>

    <!-- Referral Code Pill (Own Profile) -->
    <div class="referral-pill" id="referralPill" onclick="copyRefCode()" style="display:none;">
      <i class="fas fa-gift"></i> <span id="refCodeDisplay">AZ-CODE</span> · Tap to Copy
    </div>

    <!-- Bio & Custom Links -->
    <div class="profile-bio" id="bio">Arizona AI member 🏜️</div>
    <div class="profile-links" id="profileLinks" style="display:none;"></div>

    <!-- Actions (Dynamic: Own vs Visitor) -->
    <div class="tt-action-row" id="actionButtonsRow"></div>
  </div>

  <!-- Tribes Preview Strip -->
  <div class="horizontal-section" id="myTribesSection" style="display:none;">
    <div class="section-header">
      <span><i class="fas fa-users" style="color:#5eb8ff;"></i> Tribes</span>
      <a href="chats.html" style="color:var(--az-primary);text-decoration:none;">See All</a>
    </div>
    <div class="horizontal-scroll-row" id="myTribesRow"></div>
  </div>

  <!-- Tabs Navigation -->
  <div class="profile-tabs">
    <button class="tab active" onclick="switchTab('posts', this)"><i class="fas fa-border-all"></i></button>
    <button class="tab" onclick="switchTab('reels', this)"><i class="fas fa-clapperboard"></i></button>
    <button class="tab" onclick="switchTab('wall', this)"><i class="fas fa-comment-dots"></i></button>
  </div>

  <!-- Grid of Posts -->
  <div class="profile-grid" id="postsGrid"></div>
  <div id="emptyPosts" style="display:none;text-align:center;padding:50px 20px;color:var(--az-text-secondary);">
    <i class="fas fa-film" style="font-size:36px;opacity:.3;margin-bottom:10px;"></i>
    <div>No posts yet</div>
  </div>

  <!-- Profile Wall Container -->
  <div id="wallContainer" style="display:none;padding:16px 0;">
    <div style="background:#151515;border-radius:12px;padding:12px;margin-bottom:14px;border:1px solid var(--az-border);">
      <textarea id="wallCommentInput" placeholder="Write on this profile wall..." style="width:100%;height:65px;background:none;border:none;color:#fff;outline:none;font-family:inherit;"></textarea>
      <button onclick="postWallComment()" class="btn-primary-action" style="float:right;padding:6px 14px;border-radius:8px;font-size:12px;"><i class="fas fa-paper-plane"></i> Post</button>
      <div style="clear:both;"></div>
    </div>
    <div id="wallCommentsList" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>

</main>

<!-- ==================== 1. FULL-SCREEN VERTICAL SWIPE FEED ==================== -->
<div class="swipe-feed-modal" id="swipeFeedModal">
  <button class="snap-close-btn" onclick="closeSwipeFeed()"><i class="fas fa-times"></i></button>
  <div class="swipe-feed-container" id="swipeFeedContainer">
    <!-- Populated by JS for snap scrolling -->
  </div>
</div>

<!-- ==================== 2. SEARCH OVERLAY ==================== -->
<div class="search-modal" id="searchModal">
  <div class="search-input-wrap">
    <input type="text" id="searchInput" placeholder="Search creators by username..." oninput="handleLiveSearch(this.value)">
    <button class="icon-btn" onclick="closeSearchOverlay()"><i class="fas fa-times"></i></button>
  </div>
  <div class="search-results-list" id="searchResults"></div>
</div>

<!-- ==================== EDIT PROFILE MODAL ==================== -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-content">
    <div class="handle"></div>
    <h3 style="text-align:center;margin:0 0 16px;">Edit Profile</h3>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <input type="text" id="editDisplayName" placeholder="Display Name" maxlength="50" style="padding:12px;background:#0d0d0d;border:1px solid #333;border-radius:10px;color:#fff;">
      <input type="text" id="editUsername" placeholder="Username" maxlength="30" style="padding:12px;background:#0d0d0d;border:1px solid #333;border-radius:10px;color:#fff;">
      <textarea id="editBio" placeholder="Bio" maxlength="200" style="padding:12px;background:#0d0d0d;border:1px solid #333;border-radius:10px;color:#fff;min-height:70px;"></textarea>
      <textarea id="editLinks" placeholder="Custom Links: Title|URL (one per line)" style="padding:12px;background:#0d0d0d;border:1px solid #333;border-radius:10px;color:#fff;min-height:70px;"></textarea>
    </div>
    <div class="modal-actions">
      <button onclick="closeEdit()" style="background:#222;color:#fff;border:none;">Cancel</button>
      <button onclick="saveProfile()" class="btn-primary-action">Save</button>
    </div>
  </div>
</div>

<!-- ==================== BOOST POST MODAL ==================== -->
<div class="modal-backdrop" id="boostModal">
  <div class="modal-content">
    <div class="handle"></div>
    <h3 style="text-align:center;margin:0 0 12px;">🚀 Boost Content</h3>
    <p style="text-align:center;color:var(--az-text-secondary);font-size:12px;">Boosted posts receive priority distribution and a gold badge.</p>
    <div style="font-size:24px;font-weight:800;color:var(--az-accent);text-align:center;margin:16px 0;">$1.00 <span style="font-size:12px;color:#aaa;">/ 24 hours</span></div>
    <div class="modal-actions">
      <button onclick="closeBoostModal()" style="background:#222;color:#fff;border:none;">Cancel</button>
      <button id="boostConfirmBtn" onclick="confirmBoostSecure()" class="btn-primary-action"><i class="fas fa-bolt"></i> Boost Now</button>
    </div>
  </div>
</div>

<div class="mini-toast" id="toastMini"></div>

<!-- ==================== SCRIPTS ==================== -->
<script src="auth.js"></script>
<script>
/* STATE */
let userPosts = [];
let viewedUserId = null;
let isOwnProfile = false;
let currentTab = 'posts';
let isFollowingUser = false;
let boostContextPostId = null;

document.addEventListener('DOMContentLoaded', () => {
  const avInput = document.getElementById('avatarInput');
  if (avInput) avInput.addEventListener('change', handleAvatarPicked);

  const poll = setInterval(() => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(poll);
      initProfile();
    }
  }, 100);
});

async function initProfile() {
  const params = new URLSearchParams(window.location.search);
  const urlUser = params.get('user');

  viewedUserId = urlUser || currentUser?.id;
  if (!viewedUserId) { window.location.href = 'login.html'; return; }
  isOwnProfile = currentUser && (viewedUserId === currentUser.id);

  document.getElementById('profileContent').style.display = 'block';
  renderActionBar();

  await loadProfileData();
  await loadUserPosts();
  if (isOwnProfile) {
    document.getElementById('avatarCam').style.display = 'flex';
    document.getElementById('referralPill').style.display = 'inline-flex';
    loadMyTribes();
  }
}

function renderActionBar() {
  const row = document.getElementById('actionButtonsRow');
  if (isOwnProfile) {
    row.innerHTML = `
      <button class="btn-secondary-action" onclick="openEdit()"><i class="fas fa-pen"></i> Edit Profile</button>
      <button class="btn-secondary-action" onclick="shareProfile()"><i class="fas fa-share-nodes"></i> Share</button>
      <a href="Post.html" class="btn-primary-action"><i class="fas fa-plus"></i> Post</a>
    `;
  } else {
    row.innerHTML = `
      <button class="btn-primary-action" id="followBtn" onclick="toggleFollow()"><i class="fas fa-user-plus"></i> Follow</button>
      <a class="btn-secondary-action" id="msgBtn" href="chats.html?user=${viewedUserId}"><i class="fas fa-paper-plane"></i> Message</a>
    `;
    checkFollowStatus();
  }
}

/* PROFILE DATA */
async function loadProfileData() {
  const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', viewedUserId).maybeSingle();
  if (!prof) return;

  const uname = prof.username || 'user';
  document.getElementById('topbarTitle').textContent = '@' + uname;
  document.getElementById('displayName').textContent = prof.display_name || uname;
  document.getElementById('usernameMeta').textContent = '@' + uname;
  document.getElementById('bio').textContent = prof.bio || 'Arizona AI member 🏜️';

  if (prof.is_verified) document.getElementById('nameVerified').style.display = 'inline';

  const avEl = document.getElementById('avatar');
  if (prof.avatar_url) avEl.innerHTML = `<img src="${prof.avatar_url}">`;
  else avEl.textContent = uname.charAt(0).toUpperCase();

  document.getElementById('statFollowing').textContent = formatCompact(prof.following_count || 0);
  document.getElementById('statFollowers').textContent = formatCompact(prof.followers_count || 0);

  // Referral
  const code = prof.referral_code || ('AZ-' + uname.toUpperCase().slice(0, 6));
  document.getElementById('refCodeDisplay').textContent = code;

  // Custom links
  const linksWrap = document.getElementById('profileLinks');
  let linksArr = Array.isArray(prof.links) ? prof.links : [];
  if (typeof prof.links === 'string') { try { linksArr = JSON.parse(prof.links); } catch(e){} }
  if (linksArr.length > 0) {
    linksWrap.innerHTML = linksArr.map(l => `<a href="${l.url}" target="_blank" class="profile-link-item"><i class="fas fa-link"></i> ${l.title}</a>`).join('');
    linksWrap.style.display = 'flex';
  }
}

/* POSTS & PIN TO TOP */
async function loadUserPosts() {
  const { data, error } = await supabaseClient
    .from('posts').select('*').eq('user_id', viewedUserId)
    .order('is_pinned', { ascending: false, nullsFirst: false })
    .order('created_at', { ascending: false });

  if (error) return;
  userPosts = data || [];

  const totalLikes = userPosts.reduce((acc, p) => acc + (p.likes_count || 0), 0);
  document.getElementById('statLikes').textContent = formatCompact(totalLikes);

  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('postsGrid');
  const empty = document.getElementById('emptyPosts');
  let filtered = userPosts;

  if (currentTab === 'reels') filtered = userPosts.filter(p => p.post_type === 'reel');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map((p, idx) => {
    const firstMedia = (p.media_urls && p.media_urls[0]) || '';
    const isVideo = /\.(mp4|webm|mov)$/i.test(firstMedia);
    return `
      <div class="grid-item" onclick="openSwipeFeed(${idx})">
        ${isVideo ? `<video src="${firstMedia}" muted></video>` : `<img src="${firstMedia || 'arizonan%20png%20icon.jpeg'}">`}
        ${p.is_pinned ? `<div class="pinned-badge"><i class="fas fa-thumbtack"></i> Pinned</div>` : ''}
        <div class="views-count"><i class="fas fa-play"></i> ${p.views_count || 0}</div>
      </div>
    `;
  }).join('');
}

/* ==================== 1. VERTICAL SNAP-SCROLL FEED ==================== */
function openSwipeFeed(startIndex) {
  const modal = document.getElementById('swipeFeedModal');
  const container = document.getElementById('swipeFeedContainer');

  container.innerHTML = userPosts.map((post, idx) => {
    const firstMedia = (post.media_urls && post.media_urls[0]) || '';
    const isVid = /\.(mp4|webm|mov)$/i.test(firstMedia);

    return `
      <div class="snap-card" id="snap-${idx}">
        <div class="media-box">
          ${isVid ? `<video src="${firstMedia}" playsinline loop autoplay></video>` : `<img src="${firstMedia || 'arizonan%20png%20icon.jpeg'}">`}
        </div>

        <div class="snap-side-actions">
          <button class="snap-action-btn" onclick="toggleLikeSnap('${post.id}', this)">
            <div class="icon-circle"><i class="fas fa-heart"></i></div>
            <span>${post.likes_count || 0}</span>
          </button>
          <button class="snap-action-btn" onclick="sharePostDetail('${post.id}')">
            <div class="icon-circle"><i class="fas fa-share"></i></div>
            <span>Share</span>
          </button>
          ${isOwnProfile ? `
            <button class="snap-action-btn" onclick="togglePin('${post.id}', ${!post.is_pinned})">
              <div class="icon-circle"><i class="fas fa-thumbtack"></i></div>
              <span>${post.is_pinned ? 'Unpin' : 'Pin'}</span>
            </button>
            <button class="snap-action-btn" onclick="openBoostPost('${post.id}')">
              <div class="icon-circle"><i class="fas fa-bolt" style="color:var(--az-accent);"></i></div>
              <span>Boost</span>
            </button>
          ` : ''}
        </div>

        <div class="snap-bottom-info">
          <div class="snap-creator">@${document.getElementById('displayName').textContent}</div>
          <div class="snap-caption">${post.content || ''}</div>
        </div>
      </div>
    `;
  }).join('');

  modal.classList.add('active');
  const target = document.getElementById(`snap-${startIndex}`);
  if (target) target.scrollIntoView();
}

function closeSwipeFeed() {
  document.getElementById('swipeFeedModal').classList.remove('active');
  // Pause any playing videos
  document.querySelectorAll('#swipeFeedContainer video').forEach(v => v.pause());
}

async function togglePin(postId, shouldPin) {
  if (!isOwnProfile || !currentUser) return;
  try {
    const { error } = await supabaseClient
      .from('posts').update({ is_pinned: shouldPin })
      .eq('id', postId).eq('user_id', currentUser.id);
    if (error) throw error;
    toast(shouldPin ? 'Post pinned to top 📌' : 'Post unpinned');
    await loadUserPosts();
    closeSwipeFeed();
  } catch(e) { toast(e.message); }
}

/* ==================== 2. CRITICAL SECURITY BOOST FIX ==================== */
function openBoostPost(id) {
  boostContextPostId = id;
  document.getElementById('boostModal').classList.add('active');
}
function closeBoostModal() {
  document.getElementById('boostModal').classList.remove('active');
}

async function confirmBoostSecure() {
  if (!currentUser || !boostContextPostId) return;
  const btn = document.getElementById('boostConfirmBtn');
  btn.disabled = true;

  try {
    // Calling atomic database procedure purchase_boost to avoid client-side wallet bypass
    const { data, error } = await supabaseClient.rpc('boost_story', {
      p_story_id: boostContextPostId,
      p_user_id: currentUser.id,
      p_duration: '24h',
      p_price: 1.00
    });

    if (error) throw error;
    toast('⚡ Post Boosted successfully for 24h!');
    closeBoostModal();
    loadUserPosts();
  } catch (err) {
    toast(err.message || 'Boost failed');
  } finally {
    btn.disabled = false;
  }
}

/* ==================== 3. SEARCH OVERLAY ==================== */
function openSearchOverlay() {
  document.getElementById('searchModal').classList.add('active');
  document.getElementById('searchInput').focus();
}
function closeSearchOverlay() {
  document.getElementById('searchModal').classList.remove('active');
}

async function handleLiveSearch(query) {
  const container = document.getElementById('searchResults');
  if (!query || query.trim().length < 2) { container.innerHTML = ''; return; }

  const { data } = await supabaseClient
    .from('profiles').select('id, username, display_name, avatar_url')
    .or(`username.ilike.%${query}%,display_name.ilike.%${query}%`)
    .limit(10);

  container.innerHTML = (data || []).map(u => `
    <div onclick="window.location.href='profile.html?user=${u.id}'" style="display:flex;align-items:center;gap:12px;padding:10px;background:#151515;border-radius:10px;cursor:pointer;">
      <div style="width:36px;height:36px;border-radius:50%;background:var(--az-gradient);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;">
        ${u.avatar_url ? `<img src="${u.avatar_url}" style="width:100%;height:100%;object-fit:cover;">` : (u.username||'U').charAt(0).toUpperCase()}
      </div>
      <div>
        <div style="font-size:13px;font-weight:700;">${u.display_name || u.username}</div>
        <div style="font-size:11px;color:var(--az-text-secondary);">@${u.username}</div>
      </div>
    </div>
  `).join('');
}

/* ==================== 4. FOLLOW / UNFOLLOW ==================== */
async function checkFollowStatus() {
  if (!currentUser) return;
  const { data } = await supabaseClient.from('follows').select('follower_id').eq('follower_id', currentUser.id).eq('following_id', viewedUserId).maybeSingle();
  isFollowingUser = !!data;
  const btn = document.getElementById('followBtn');
  if (btn) btn.innerHTML = isFollowingUser ? '<i class="fas fa-check"></i> Following' : '<i class="fas fa-user-plus"></i> Follow';
}

async function toggleFollow() {
  if (!currentUser) return;
  if (isFollowingUser) {
    await supabaseClient.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', viewedUserId);
    isFollowingUser = false;
  } else {
    await supabaseClient.from('follows').insert({ follower_id: currentUser.id, following_id: viewedUserId });
    isFollowingUser = true;
  }
  checkFollowStatus();
  loadProfileData();
}

/* HELPERS */
function copyRefCode() {
  const code = document.getElementById('refCodeDisplay').textContent;
  navigator.clipboard.writeText(`${window.location.origin}/register.html?ref=${code}`);
  toast('Referral link copied! 📋');
}

function shareProfile() {
  const url = `${window.location.origin}/profile.html?user=${viewedUserId}`;
  if (navigator.share) navigator.share({ title: 'Arizona AI', url }).catch(()=>{});
  else { navigator.clipboard.writeText(url); toast('Profile link copied! 📋'); }
}

function switchTab(t, el) {
  currentTab = t;
  document.querySelectorAll('.profile-tabs .tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');

  const g = document.getElementById('postsGrid');
  const w = document.getElementById('wallContainer');
  if (t === 'wall') { g.style.display = 'none'; w.style.display = 'block'; loadWallComments(); }
  else { w.style.display = 'none'; g.style.display = 'grid'; renderGrid(); }
}

function formatCompact(num) {
  return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(num);
}
function toast(m) {
  const t = document.getElementById('toastMini');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function openEdit() { document.getElementById('editModal').classList.add('active'); }
function closeEdit() { document.getElementById('editModal').classList.remove('active'); }
function triggerAvatarPick() { document.getElementById('avatarInput').click(); }
</script>
