<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Profile — Arizona AI</title>

<!-- Dynamic Open Graph Tags for Profile Sharing -->
<meta property="og:type" content="profile">
<meta property="og:title" id="ogTitle" content="Arizona AI Profile">
<meta property="og:description" id="ogDesc" content="Check out this profile on Arizona AI">
<meta property="og:image" id="ogImage" content="https://aiarizonan.com/icon-512.png">
<meta property="og:url" id="ogUrl" content="https://aiarizonan.com/profile.html">

<link rel="icon" type="image/png" href="/icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body { background:#0a0a0a; padding-top:60px; padding-bottom:70px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

/* ==================== TOP BAR ==================== */
.topbar {
  position:fixed; top:0; left:0; right:0; height:60px;
  background:rgba(10,10,10,.97); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,107,53,.25);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; z-index:1000; max-width:640px; margin:0 auto;
}
.topbar .back, .topbar .icon-btn {
  color:var(--az-text); font-size:19px;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; text-decoration:none; cursor:pointer;
  background:none; border:none;
}
.topbar .icon-btn:hover { background:rgba(255,255,255,.06); }
.topbar .title { font-size:16px; font-weight:700; color:var(--az-text); }

/* ==================== PROFILE HEADER ==================== */
.profile-header { max-width:640px; margin:0 auto; padding:24px 20px 16px; }
.profile-top { display:flex; align-items:center; gap:24px; margin-bottom:16px; }

.profile-avatar-wrap { position:relative; flex-shrink:0; cursor:pointer; }
.profile-avatar {
  width:92px; height:92px; border-radius:50%;
  background:var(--az-gradient);
  display:flex; align-items:center; justify-content:center;
  font-size:34px; font-weight:800; color:#fff;
  border:3px solid #0a0a0a;
  box-shadow:0 0 0 3px var(--az-primary);
  overflow:hidden; transition: transform .2s; position:relative; z-index:1;
}
.profile-avatar:active { transform:scale(.95); }
.profile-avatar img { width:100%; height:100%; object-fit:cover; }

/* Story ring around avatar */
.profile-avatar-wrap.has-story .profile-avatar { box-shadow: 0 0 0 3px transparent, 0 0 0 3px #FF6B35; }
.profile-avatar-wrap.has-story::before {
  content: ''; position: absolute; inset: -3px; border-radius: 50%;
  background: conic-gradient(from 0deg, #FF6B35, #FFB20F, #7c3aed, #FF6B35);
  z-index: 0; animation: storyRingSpin 4s linear infinite;
}
@keyframes storyRingSpin { to { transform: rotate(360deg); } }
.profile-avatar-wrap.has-boosted-story::before {
  background: conic-gradient(from 0deg, #FFB20F, #7c3aed, #5eb8ff, #FFB20F);
  animation: storyRingSpin 2s linear infinite, boostGlow 2s ease-in-out infinite;
}
@keyframes boostGlow { 0%,100% { filter: drop-shadow(0 0 6px rgba(255,178,15,.7)); } 50% { filter: drop-shadow(0 0 16px rgba(124,58,237,.9)); } }

.profile-avatar-wrap .camera {
  position:absolute; bottom:2px; right:2px;
  background:var(--az-primary); color:#fff;
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; border:2px solid #0a0a0a; cursor:pointer; z-index:10;
}
.profile-avatar-wrap .verified-badge {
  position:absolute; top:2px; right:2px;
  background:#3b82f6; color:#fff;
  width:24px; height:24px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
  font-size:12px; border:2px solid #0a0a0a; z-index:11;
}
.profile-avatar-wrap .verified-badge.show { display:flex; }

.add-story-btn {
  position:absolute; bottom:-4px; right:-4px;
  width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg,#FF6B35,#FFB20F);
  color:#fff; border:3px solid #0a0a0a;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:800; cursor:pointer; z-index:12;
  box-shadow: 0 4px 12px rgba(255,107,53,.4); transition: transform .15s;
}
.add-story-btn:active { transform:scale(.9); }

.profile-stats { flex:1; display:flex; justify-content:space-around; text-align:center; }
.profile-stats .stat { cursor:pointer; padding:4px 8px; border-radius:8px; }
.profile-stats .stat:hover { background:rgba(255,255,255,.04); }
.profile-stats .stat .num { font-size:18px; font-weight:800; color:var(--az-text); }
.profile-stats .stat .lbl { font-size:12px; color:var(--az-text-secondary); margin-top:2px; }

.profile-name { padding:0 20px 16px; max-width:640px; margin:0 auto; }
.profile-name h1 { font-size:17px; font-weight:700; color:var(--az-text); display:flex; align-items:center; gap:6px; }
.profile-name h1 .verified { color:#3b82f6; font-size:14px; }
.profile-name .bio { margin-top:6px; font-size:14px; line-height:1.5; color:var(--az-text); white-space:pre-wrap; }
.profile-name .meta { margin-top:8px; font-size:13px; color:var(--az-text-secondary); display:flex; flex-wrap:wrap; gap:12px; }
.profile-name .meta span { display:flex; align-items:center; gap:5px; }

/* ==================== NEW: CUSTOM LINKS ==================== */
.profile-links { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
.profile-link-item { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); padding:6px 12px; border-radius:20px; font-size:12px; color:var(--az-accent); text-decoration:none; font-weight:700; }
.profile-link-item:hover { background:rgba(255,107,53,.1); }

/* ==================== STORIES ==================== */
.my-stories { max-width:640px; margin:0 auto 16px; padding:0 20px; }
.my-stories .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.my-stories .head h3 { font-size:13px; font-weight:800; color:var(--az-text); text-transform:uppercase; display:flex; align-items:center; gap:6px; }
.my-stories .row { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
.my-stories .row::-webkit-scrollbar { display:none; }
.story-tile { width:80px; height:110px; border-radius:12px; overflow:hidden; position:relative; flex-shrink:0; cursor:pointer; border:2px solid rgba(255,255,255,.08); background:#111; }
.story-tile img, .story-tile video { width:100%; height:100%; object-fit:cover; }
.story-tile .expiry { position:absolute; top:4px; left:4px; background:rgba(0,0,0,.7); border-radius:8px; padding:2px 6px; font-size:9px; font-weight:800; color:#fff; }
.story-tile .stats { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent, rgba(0,0,0,.85)); padding:14px 6px 5px; display:flex; justify-content:space-between; font-size:9px; color:#fff; font-weight:700; }
.story-tile .delete-btn, .story-tile .boost-btn { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; border:none; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; z-index:3; }
.story-tile:hover .delete-btn, .story-tile:hover .boost-btn { opacity:1; }
.story-tile .delete-btn { background:rgba(255,71,87,.9); color:#fff; }
.story-tile .boost-btn { right:28px; background:linear-gradient(135deg,#5eb8ff,#7c3aed); color:#fff; }
.my-stories .add-tile { width:80px; height:110px; border-radius:12px; border:2px dashed rgba(255,107,53,.5); background:rgba(255,107,53,.06); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; flex-shrink:0; cursor:pointer; color:var(--az-primary); font-size:11px; font-weight:700; }

/* ==================== WALLET & TRIBES ==================== */
.wallet-card { max-width:640px; margin:0 20px 20px; background:linear-gradient(135deg,rgba(255,107,53,.15),rgba(255,178,15,.08)); border:1px solid rgba(255,107,53,.35); border-radius:16px; padding:18px; }
.wallet-card .label { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--az-text-secondary); margin-bottom:6px; }
.wallet-card .balance { font-size:34px; font-weight:800; color:var(--az-accent); line-height:1; }
.wallet-card .row { display:flex; gap:20px; margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,107,53,.25); }
.wallet-card .row .col { flex:1; }
.wallet-card .row .col .n { font-size:15px; font-weight:700; color:var(--az-text); }
.wallet-card .row .col .l { font-size:11px; color:var(--az-text-secondary); text-transform:uppercase; letter-spacing:.5px; }
.wallet-card .actions { display:flex; gap:10px; margin-top:16px; }
.wallet-card .actions a { flex:1; text-align:center; padding:11px; border-radius:10px; text-decoration:none; font-weight:600; font-size:13px; border:1px solid rgba(255,178,15,.4); color:var(--az-accent); }
.wallet-card .actions a.primary { background:var(--az-gradient); color:#fff; border:none; }
.my-tribes { max-width:640px; margin:0 auto 20px; padding:0 20px; }
.my-tribes .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.my-tribes .head h3 { font-size:13px; font-weight:800; color:var(--az-text); text-transform:uppercase; display:flex; align-items:center; gap:6px; }
.my-tribes .row { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
.tribe-chip { min-width:130px; max-width:160px; background:rgba(94,184,255,.06); border:1px solid rgba(94,184,255,.2); border-radius:14px; padding:12px; flex-shrink:0; cursor:pointer; display:flex; gap:10px; align-items:center; }
.tribe-chip .tav { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#5eb8ff); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; flex-shrink:0; overflow:hidden; }
.tribe-chip .tinfo { flex:1; min-width:0; }
.tribe-chip .tinfo .tname { font-size:13px; font-weight:700; color:var(--az-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tribe-chip .tinfo .tsub { font-size:10px; color:var(--az-text-secondary); margin-top:2px; }

/* ==================== ACTIONS & TABS ==================== */
.profile-actions { max-width:640px; margin:0 auto 20px; padding:0 20px; display:flex; gap:8px; }
.profile-actions button, .profile-actions a { flex:1; padding:10px 6px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:10px; color:var(--az-text); font-size:12px; font-weight:600; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px; font-family:inherit; }
.profile-tabs { max-width:640px; margin:0 auto; display:flex; border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08); }
.profile-tabs .tab { flex:1; padding:14px 0; background:none; border:none; cursor:pointer; color:var(--az-text-secondary); display:flex; align-items:center; justify-content:center; font-size:20px; border-bottom:2px solid transparent; }
.profile-tabs .tab.active { color:var(--az-text); border-bottom-color:var(--az-text); }

/* ==================== GRID ==================== */
.profile-grid { max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px 0; }
.grid-item { position:relative; aspect-ratio:1/1; background:#111; overflow:hidden; cursor:pointer; }
.grid-item img, .grid-item video { width:100%; height:100%; object-fit:cover; display:block; }
.grid-item .overlay { position:absolute; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; gap:14px; color:#fff; font-weight:700; font-size:13px; flex-wrap:wrap; padding:8px; }
.grid-item:hover .overlay { display:flex; }
.grid-item .del-post { position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; background:rgba(255,71,87,.9); color:#fff; border:none; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; z-index:5; }
.grid-item:hover .del-post { opacity:1; }
.pin-icon { position: absolute; top: 6px; left: 6px; color: #fff; font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 5;}

/* ==================== NEW: WALL COMMENTS ==================== */
.wall-container { max-width:640px; margin:0 auto; padding:16px; display:none; }
.wall-container.active { display:block; }
.wall-input-box { display:flex; gap:8px; margin-bottom:16px; }
.wall-input-box input { flex:1; padding:12px; border-radius:10px; border:1px solid #333; background:#0a0a0a; color:#fff; font-family:inherit; }
.wall-input-box button { padding:0 20px; background:var(--az-gradient); color:#fff; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
.wall-comment { display:flex; gap:12px; margin-bottom:16px; }
.wall-comment .av { width:40px; height:40px; border-radius:50%; background:var(--az-gradient); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex-shrink:0;}
.wall-comment .av img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
.wall-comment .content { background:rgba(255,255,255,.05); padding:10px 14px; border-radius:12px; border-top-left-radius:2px; flex:1; font-size:14px; }
.wall-comment .name { font-weight:700; font-size:12px; color:var(--az-accent); margin-bottom:4px;}

/* ==================== NEW: INSTAGRAM ACTIONS & REFERRAL ==================== */
.insta-actions { display:flex; gap:8px; padding: 0 20px 16px; max-width:640px; margin: 0 auto;}
.insta-actions button, .insta-actions a { flex:1; padding:10px; border-radius:10px; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; text-decoration:none; border:none; font-family:inherit; }
.btn-follow { background:var(--az-gradient); color:#fff; }
.btn-following { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2) !important; }
.btn-message { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2) !important; }

.referral-card { max-width:640px; margin:0 20px 20px; background:linear-gradient(135deg, rgba(255,107,53,.1), rgba(255,178,15,.05)); border:1px solid rgba(255,178,15,.3); border-radius:16px; padding:16px; display:flex; align-items:center; gap:12px; }
.referral-card .icon { width:44px; height:44px; border-radius:12px; background:var(--az-gradient); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; }
.referral-card .info { flex:1; }
.referral-card .info .title { font-size:13px; color:var(--az-text-secondary); text-transform:uppercase; font-weight:700; }
.referral-card .info .code { font-size:20px; font-weight:800; color:#fff; letter-spacing:1px; margin-top:2px;}
.referral-card .copy-btn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; padding:10px 16px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; }

/* ==================== MODALS & TOASTS ==================== */
.modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:2000; align-items:flex-end; justify-content:center; }
.modal-backdrop.active { display:flex; }
.modal-content { background:#151515; width:100%; max-width:640px; border-top-left-radius:20px; border-top-right-radius:20px; padding:20px; max-height:90vh; overflow-y:auto; }
.modal-content .handle { width:40px; height:4px; background:#333; border-radius:2px; margin:0 auto 16px; }
.modal-content h3 { text-align:center; color:var(--az-accent); margin-bottom:18px; font-size:17px; }
.modal-actions { display:flex; gap:10px; margin-top:16px; }
.modal-actions button { flex:1; padding:13px; border-radius:12px; font-weight:700; cursor:pointer; font-size:14px; }
.modal-actions .cancel { background:transparent; border:1px solid #333; color:#fff; }
.modal-actions .primary { background:var(--az-gradient); border:none; color:#fff; }
.toast-mini { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(10,10,10,.98); border:1px solid rgba(255,107,53,.4); color:#fff; padding:10px 18px; border-radius:22px; font-size:13px; font-weight:600; z-index:9999; opacity:0; pointer-events:none; transition:all .25s ease; }
.toast-mini.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay"><div class="loader"></div></div>
<input type="file" id="avatarInput" accept="image/*" style="display:none;">
<input type="file" id="storyFileInput" accept="image/*,video/*" style="display:none;">

<header class="topbar" id="topbar" style="display:none;">
  <a href="index.html" class="back"><i class="fas fa-arrow-left"></i></a>
  <span class="title" id="topbarTitle">Profile</span>
  <div style="display:flex; gap:4px;">
    <button class="icon-btn" onclick="openEdit()" title="Settings"><i class="fas fa-cog"></i></button>
    <a href="logout.html" class="icon-btn"><i class="fas fa-sign-out-alt"></i></a>
  </div>
</header>

<div id="profileContent" style="display:none;">
  <div class="profile-header">
    <div class="profile-top">
      <div class="profile-avatar-wrap" id="avatarWrap">
        <div class="profile-avatar" id="avatar">U</div>
        <div class="camera" id="cameraBtn" onclick="triggerAvatarPick()" style="display:none;"><i class="fas fa-camera"></i></div>
      </div>
      <div class="profile-stats">
        <div class="stat"><div class="num" id="statPosts">0</div><div class="lbl">Posts</div></div>
        <div class="stat"><div class="num" id="statFollowers">0</div><div class="lbl">Followers</div></div>
        <!-- NEW: Views Counter -->
        <div class="stat"><div class="num" id="statViews">0</div><div class="lbl">Views</div></div>
      </div>
    </div>
  </div>

  <div class="profile-name">
    <h1><span id="displayName">User</span></h1>
    <div class="bio" id="bio">Arizona AI member 🏜️</div>
    <!-- NEW: Custom Links -->
    <div class="profile-links" id="profileLinks"></div>
  </div>

  <!-- NEW: Insta Actions (Show on other profiles) -->
  <div class="insta-actions" id="otherUserActions" style="display:none;">
    <button id="followBtn" class="btn-follow" onclick="toggleFollow()"><i class="fas fa-plus"></i> Follow</button>
    <a href="#" id="messageBtn" class="btn-message"><i class="far fa-paper-plane"></i> Message</a>
  </div>

  <!-- NEW: Referral Card (Show on own profile) -->
  <div class="referral-card" id="referralCard" style="display:none;">
    <div class="icon"><i class="fas fa-gift"></i></div>
    <div class="info">
      <div class="title">Your Invite Code</div>
      <div class="code" id="refCodeDisplay">LOADING...</div>
    </div>
    <button class="copy-btn" onclick="copyRefCode()"><i class="fas fa-copy"></i> Copy</button>
  </div>

  <!-- MY STORIES -->
  <div class="my-stories" id="myStoriesWrap" style="display:none;">
    <div class="head"><h3><i class="fas fa-circle-play"></i> My Stories</h3><button class="see-all" onclick="openStoryUploadModal()">+ Add New</button></div>
    <div class="row" id="myStoriesRow"></div>
  </div>

  <!-- MY TRIBES -->
  <div class="my-tribes" id="myTribesWrap" style="display:none;">
    <div class="head"><h3><i class="fas fa-users"></i> My Tribes</h3><button class="see-all" onclick="window.location.href='chats.html'">See All</button></div>
    <div class="row" id="myTribesRow"></div>
  </div>

  <!-- WALLET -->
  <div class="wallet-card" id="walletCard">
    <div class="label"><i class="fas fa-wallet"></i> Your Balance</div>
    <div class="balance" id="walletBalance">$0.00</div>
    <div class="row">
      <div class="col"><div class="n" id="walletEarned">$0.00</div><div class="l">Total Earned</div></div>
      <div class="col"><div class="n" id="walletSpent">$0.00</div><div class="l">Total Spent</div></div>
    </div>
    <div class="actions">
      <a href="wallets.html" class="primary"><i class="fas fa-wallet"></i> Wallet</a>
      <a href="offers.html"><i class="fas fa-gift"></i> Offers</a>
    </div>
  </div>

  <!-- Actions -->
  <div class="profile-actions" id="profileActions">
    <button onclick="openEdit()"><i class="fas fa-pen"></i> Edit</button>
    <button onclick="openStoryUploadModal()"><i class="fas fa-circle-plus"></i> Story</button>
    <a href="Post.html"><i class="fas fa-plus-circle"></i> Post</a>
  </div>

  <!-- Tabs -->
  <div class="profile-tabs">
    <button class="tab active" onclick="switchTab('posts', this)"><i class="fas fa-th"></i></button>
    <button class="tab" onclick="switchTab('reels', this)"><i class="fas fa-video"></i></button>
    <!-- NEW: WALL TAB -->
    <button class="tab" onclick="switchTab('wall', this)"><i class="fas fa-comment-dots"></i></button>
  </div>

  <!-- POSTS GRID -->
  <div class="profile-grid" id="postsGrid"></div>

  <!-- NEW: WALL COMMENTS SECTION -->
  <div class="wall-container" id="wallContainer">
    <div class="wall-input-box">
      <input type="text" id="wallInput" placeholder="Leave a message for this user...">
      <button onclick="postWallComment()">Send</button>
    </div>
    <div id="wallCommentsList"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-content">
    <div class="handle"></div>
    <h3>Edit Profile</h3>
    <div class="form-field" style="margin-bottom:14px;"><label>Display Name</label><input type="text" id="editDisplayName" style="width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#0a0a0a; color:#fff;"></div>
    <div class="form-field" style="margin-bottom:14px;"><label>Bio</label><textarea id="editBio" style="width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#0a0a0a; color:#fff;"></textarea></div>
    <!-- NEW: Links Editor -->
    <div class="form-field"><label>Links (Title|URL, comma separated)</label><input type="text" id="editLinks" style="width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#0a0a0a; color:#fff;" placeholder="YouTube|https://youtube.com, Store|https://store.com"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeEdit()">Cancel</button>
      <button class="primary" onclick="saveProfile()">Save</button>
    </div>
  </div>
</div>

<div id="toastMini" class="toast-mini"></div>

<script src="auth.js"></script>
<script>
let viewedUserId = null;
let isOwnProfile = false;
let userPosts = [];
let currentTab = 'posts';
let isFollowing = false;

document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      initProfile();
    }
  }, 100);
});

async function initProfile() {
  const params = new URLSearchParams(window.location.search);
  const urlUserId = params.get('user');
  if (!currentUser && !urlUserId) { window.location.href = 'login.html'; return; }

  viewedUserId = urlUserId || currentUser.id;
  isOwnProfile = currentUser && viewedUserId === currentUser.id;

  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('profileContent').style.display = 'block';

  if (isOwnProfile) {
    document.getElementById('referralCard').style.display = 'flex';
    document.getElementById('profileActions').style.display = 'flex';
    document.getElementById('cameraBtn').style.display = 'flex';
    document.getElementById('myStoriesWrap').style.display = 'block';
    document.getElementById('myTribesWrap').style.display = 'block';
  } else {
    document.getElementById('otherUserActions').style.display = 'flex';
    document.getElementById('cameraBtn').style.display = 'none';
    document.getElementById('messageBtn').href = `chats.html?user=${viewedUserId}`;
  }

  // Log View
  if (!isOwnProfile && currentUser) {
    supabaseClient.rpc('log_profile_view', { p_profile_id: viewedUserId }).catch(()=>{});
  }

  await loadProfileData();
  await loadUserPosts();
  await checkIfFollowing();
  await loadWallComments();
}

async function loadProfileData() {
  const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', viewedUserId).maybeSingle();
  const { data: wall } = await supabaseClient.from('wallets').select('*').eq('user_id', viewedUserId).maybeSingle();
  if (!prof) { showToast('User not found'); return; }

  const name = prof.username || 'user';
  const display = prof.display_name || name;
  const initial = name.charAt(0).toUpperCase();

  document.getElementById('avatar').innerHTML = prof.avatar_url ? `<img src="${prof.avatar_url}">` : initial;
  document.getElementById('displayName').textContent = display;
  document.getElementById('bio').textContent = prof.bio || 'Arizona AI member 🏜️';
  document.getElementById('statPosts').textContent = prof.posts_count || 0;
  document.getElementById('statFollowers').textContent = prof.followers_count || 0;
  document.getElementById('statViews').textContent = prof.profile_views || 0;
  document.getElementById('topbarTitle').textContent = isOwnProfile ? 'Profile' : '@' + name;

  if (isOwnProfile) {
    document.getElementById('refCodeDisplay').textContent = prof.referral_code || 'NO CODE';
    document.getElementById('walletBalance').textContent = '$' + Number(wall?.balance || 0).toFixed(2);
    document.getElementById('walletEarned').textContent = '$' + Number(wall?.total_earned || 0).toFixed(2);
    document.getElementById('walletSpent').textContent = '$' + Number(wall?.total_spent || 0).toFixed(2);
  }

  // Render Custom Links
  const linksContainer = document.getElementById('profileLinks');
  linksContainer.innerHTML = '';
  if (prof.links && Array.isArray(prof.links)) {
    prof.links.forEach(link => {
      if(link.title && link.url) {
        linksContainer.innerHTML += `<a href="${link.url}" target="_blank" class="profile-link-item"><i class="fas fa-link"></i> ${link.title}</a>`;
      }
    });
  }

  document.getElementById('ogTitle').content = `${display} (@${name}) — Arizona AI`;
  document.getElementById('ogDesc').content = prof.bio || 'Check out my profile on Arizona AI!';
  if (prof.avatar_url) document.getElementById('ogImage').content = prof.avatar_url;
  document.getElementById('ogUrl').content = window.location.href;
}

async function loadUserPosts() {
  const grid = document.getElementById('postsGrid');
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666;"><i class="fas fa-circle-notch fa-spin"></i></div>';

  // Sort by is_pinned first!
  const { data, error } = await supabaseClient
    .from('posts')
    .select('*')
    .eq('user_id', viewedUserId)
    .order('is_pinned', { ascending: false })
    .order('created_at', { ascending: false });
    
  if (error) { grid.innerHTML = 'Error loading posts'; return; }
  userPosts = data || [];
  renderGrid();
}

async function checkIfFollowing() {
  if (!currentUser || isOwnProfile) return;
  const { data } = await supabaseClient.from('follows').select('id').eq('follower_id', currentUser.id).eq('following_id', viewedUserId).maybeSingle();
  isFollowing = !!data;
  updateFollowButton();
}

function updateFollowButton() {
  const btn = document.getElementById('followBtn');
  if (isFollowing) {
    btn.className = 'btn-following';
    btn.innerHTML = '<i class="fas fa-check"></i> Following';
  } else {
    btn.className = 'btn-follow';
    btn.innerHTML = '<i class="fas fa-plus"></i> Follow';
  }
}

async function toggleFollow() {
  if (!currentUser) return;
  const btn = document.getElementById('followBtn');
  btn.disabled = true;
  try {
    if (isFollowing) {
      await supabaseClient.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', viewedUserId);
      isFollowing = false;
      showToast('Unfollowed');
    } else {
      await supabaseClient.from('follows').insert({ follower_id: currentUser.id, following_id: viewedUserId });
      isFollowing = true;
      showToast('Following ✅');
    }
    updateFollowButton();
    loadProfileData(); 
  } catch (err) { showToast(err.message); }
  finally { btn.disabled = false; }
}

function renderGrid() {
  const grid = document.getElementById('postsGrid');
  if (userPosts.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666;">No posts yet</div>`;
    return;
  }

  grid.innerHTML = userPosts.map(post => {
    const media = post.media_urls?.[0];
    const isVideo = media?.match(/\.(mp4|webm|mov)$/i);
    const html = isVideo ? `<video src="${media}" muted></video>` : `<img src="${media}">`;
    
    const pin = post.is_pinned ? `<div class="pin-icon"><i class="fas fa-thumbtack"></i></div>` : '';

    return `
      <div class="grid-item" onclick="togglePin('${post.id}', ${post.is_pinned})">
        ${media ? html : `<div style="padding:10px;font-size:12px;">${(post.content||'').slice(0,50)}</div>`}
        ${pin}
        <div class="overlay"><span><i class="fas fa-heart"></i> ${post.likes_count || 0}</span></div>
      </div>
    `;
  }).join('');
}

// NEW: Pin Toggle
async function togglePin(postId, isPinned) {
  if (!isOwnProfile) { showToast('View Post'); return; }
  const action = isPinned ? 'unpin' : 'pin';
  if (!confirm(`Do you want to ${action} this post?`)) return;

  try {
    if (!isPinned) {
      await supabaseClient.from('posts').update({ is_pinned: false }).eq('user_id', currentUser.id);
    }
    await supabaseClient.from('posts').update({ is_pinned: !isPinned }).eq('id', postId);
    showToast(`Post ${action}ned!`);
    loadUserPosts();
  } catch (err) { showToast(err.message); }
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.profile-tabs .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  
  if (tab === 'posts' || tab === 'reels') {
    document.getElementById('postsGrid').style.display = 'grid';
    document.getElementById('wallContainer').classList.remove('active');
  } else if (tab === 'wall') {
    document.getElementById('postsGrid').style.display = 'none';
    document.getElementById('wallContainer').classList.add('active');
  }
}

/* ==================== NEW: WALL COMMENTS ==================== */
async function loadWallComments() {
  const list = document.getElementById('wallCommentsList');
  if (!list) return;
  list.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">Loading...</div>';

  const { data } = await supabaseClient
    .from('profile_comments')
    .select('*, author:profiles!profile_comments_author_id_fkey(username, avatar_url)')
    .eq('profile_id', viewedUserId)
    .order('created_at', { ascending: false });

  if (!data || data.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">No messages yet. Be the first!</div>';
    return;
  }

  list.innerHTML = data.map(c => {
    const av = c.author.avatar_url ? `<img src="${c.author.avatar_url}">` : c.author.username.charAt(0).toUpperCase();
    return `
      <div class="wall-comment">
        <div class="av">${av}</div>
        <div class="content">
          <div class="name">@${c.author.username}</div>
          <div>${c.content}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function postWallComment() {
  if (!currentUser) return;
  const input = document.getElementById('wallInput');
  const text = input.value.trim();
  if (!text) return;

  try {
    await supabaseClient.from('profile_comments').insert({
      profile_id: viewedUserId,
      author_id: currentUser.id,
      content: text
    });
    input.value = '';
    loadWallComments();
  } catch (err) { showToast(err.message); }
}

/* ==================== REFERRAL & SHARE ==================== */
function copyRefCode() {
  const code = document.getElementById('refCodeDisplay').textContent;
  navigator.clipboard.writeText(code).then(() => showToast('Referral code copied! 📋'));
}

/* ==================== AVATAR & EDIT ==================== */
function triggerAvatarPick() {
  if (!isOwnProfile) return;
  document.getElementById('avatarInput').click();
}

document.getElementById('avatarInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const btn = document.getElementById('cameraBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  
  try {
    const path = `${currentUser.id}/avatar-${Date.now()}.jpg`;
    await supabaseClient.storage.from('avatars').upload(path, file);
    const { data } = supabaseClient.storage.from('avatars').getPublicUrl(path);
    await supabaseClient.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', currentUser.id);
    document.getElementById('avatar').innerHTML = `<img src="${data.publicUrl}">`;
    showToast('Photo updated ✅');
  } catch(err) { showToast(err.message); }
  finally { btn.innerHTML = '<i class="fas fa-camera"></i>'; }
});

function openEdit() {
  if (!isOwnProfile) return;
  document.getElementById('editDisplayName').value = document.getElementById('displayName').textContent;
  document.getElementById('editBio').value = document.getElementById('bio').textContent;
  document.getElementById('editLinks').value = "";
  document.getElementById('editModal').classList.add('active');
}

function closeEdit() { document.getElementById('editModal').classList.remove('active'); }

async function saveProfile() {
  const btn = document.getElementById('saveBtn');
  if(btn) btn.disabled = true;
  
  const display_name = document.getElementById('editDisplayName').value;
  const bio = document.getElementById('editBio').value;
  
  const linksInput = document.getElementById('editLinks').value;
  const linksArray = linksInput.split(',').map(l => {
    const [title, url] = l.split('|');
    if(title && url) return { title: title.trim(), url: url.trim() };
    return null;
  }).filter(Boolean);

  try {
    await supabaseClient.from('profiles').update({ display_name, bio, links: linksArray }).eq('id', currentUser.id);
    document.getElementById('displayName').textContent = display_name;
    document.getElementById('bio').textContent = bio;
    closeEdit();
    loadProfileData();
    showToast('Profile updated ✅');
  } catch(err) { showToast(err.message); }
  finally { if(btn) btn.innerHTML = 'Save'; }
}

function showToast(msg) {
  const el = document.getElementById('toastMini');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
</body>
</html>
