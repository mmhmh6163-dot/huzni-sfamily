<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Arizona AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loader"></div>
  <p style="margin-top:20px;">Loading…</p>
</div>

<div id="app-header"></div>

<main>
  <div class="form-card">
    <h2>Welcome Back</h2>
    <p class="form-sub">Sign in to your Arizona AI account</p>

    <div class="form-alert error"   id="loginError"></div>
    <div class="form-alert success" id="loginSuccess"></div>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com"
               required autocomplete="email">
      </div>

      <div class="form-field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Your password"
               required minlength="6" autocomplete="current-password">
      </div>

      <div style="text-align:right; margin-bottom:10px;">
        <a href="forgot-password.html"
           style="font-size:13px; color:var(--az-primary); text-decoration:none;">
          Forgot password?
        </a>
      </div>

      <button type="submit" class="btn-primary-full" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <p class="form-switch">
      Don't have an account? <a href="register.html">Create one</a>
    </p>
  </div>
</main>

<div id="app-footer"></div>

<script src="auth.js"></script>
<script>
  // Redirect if already signed in
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      if (currentUser) window.location.href = 'index.html';
    }, 300);
  });

  async function doLogin(e) {
    e.preventDefault();
    hideAlerts();

    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email)             return showAlert('error', 'Please enter your email.');
    if (password.length < 6) return showAlert('error', 'Password must be at least 6 characters.');

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in…';

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        // Handle unconfirmed email specifically
        if (error.message && error.message.toLowerCase().includes('email not confirmed')) {
          throw new Error(
            'Your email is not confirmed yet. Please check your inbox (and spam folder) ' +
            'for the confirmation link we sent you.'
          );
        }
        // Handle wrong credentials
        if (error.message && error.message.toLowerCase().includes('invalid login')) {
          throw new Error('Incorrect email or password. Please try again.');
        }
        throw error;
      }

      showAlert('success', '✅ Signed in! Redirecting…');
      setTimeout(() => { window.location.href = 'index.html'; }, 700);

    } catch (err) {
      showAlert('error', err.message || 'Login failed. Please try again.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      return false;
    }

    return false;
  }

  function showAlert(type, html) {
    hideAlerts();
    const el = document.getElementById(type === 'error' ? 'loginError' : 'loginSuccess');
    el.innerHTML = html;
    el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function hideAlerts() {
    document.getElementById('loginError').style.display   = 'none';
    document.getElementById('loginSuccess').style.display = 'none';
  }
</script>
</body>
</html>
