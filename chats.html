}

/* ============================================================
   REALTIME — DM & TRIBE
   ============================================================ */
function setupRealtimeDM() {
  if (realtimeDM) supabaseClient.removeChannel(realtimeDM);
  realtimeDM = supabaseClient
    .channel('messages-rt')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages' },
      payload => {
        const m = payload.new;
        if (activePartner &&
            ((m.sender_id === activePartner.id && m.receiver_id === currentUser.id) ||
             (m.sender_id === currentUser.id && m.receiver_id === activePartner.id))) {
          const box = document.getElementById('chatMessages');
          box.insertAdjacentHTML('beforeend', renderBubble(m, 'dm', new Map()));
          box.scrollTop = box.scrollHeight;
          if (m.receiver_id === currentUser.id) markMessagesRead();
        }
        const partnerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
        const existing = conversations.find(c => c.partnerId === partnerId);
        if (existing) {
          existing.lastMessage = m;
          if (m.receiver_id === currentUser.id && !m.is_read) existing.unread++;
          conversations = conversations.filter(c => c.partnerId !== partnerId);
          conversations.unshift(existing);
        } else {
          (async () => {
            const { data } = await supabaseClient
              .from('profiles').select('id, username, display_name, avatar_url, is_verified')
              .eq('id', partnerId).maybeSingle();
            if (data) {
              profileCache.set(partnerId, data);
              conversations.unshift({ partnerId, partner: data, lastMessage: m, unread: 1 });
              if (currentTab === 'chats') renderList();
            }
          })();
          return;
        }
        if (currentTab === 'chats') renderList();
      }
    )
    .subscribe();
}

function setupRealtimeTribe() {
  if (realtimeTribe) supabaseClient.removeChannel(realtimeTribe);
  realtimeTribe = supabaseClient
    .channel('tribe-rt')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'tribe_messages' },
      payload => {
        const m = payload.new;
        if (activeTribe && m.tribe_id === activeTribe.id) {
          const box = document.getElementById('tribeMessages');
          if (m.sender_id !== currentUser.id) {
            (async () => {
              if (!profileCache.has(m.sender_id)) {
                const { data } = await supabaseClient
                  .from('profiles').select('id, username, display_name, avatar_url')
                  .eq('id', m.sender_id).maybeSingle();
                if (data) profileCache.set(m.sender_id, data);
              }
              box.insertAdjacentHTML('beforeend', renderBubble(m, 'tribe', new Map()));
              box.scrollTop = box.scrollHeight;
              markTribeRead(activeTribe.id);
            })();
          }
        }
        const t = tribes.find(x => x.id === m.tribe_id);
        if (t) {
          t.lastMessage = { content: m.content, created_at: m.created_at, sender_id: m.sender_id, sender_name: profileCache.get(m.sender_id)?.username };
          if (m.sender_id !== currentUser.id && (!activeTribe || activeTribe.id !== m.tribe_id)) {
            t.unread = (t.unread || 0) + 1;
            tribeUnreadTotal++;
            updateBadges();
          }
          tribes = tribes.filter(x => x.id !== m.tribe_id);
          tribes.unshift(t);
        }
        if (currentTab === 'tribes') renderList();
      }
    )
    .subscribe();
}

/* ============================================================
   CALLS — WebRTC
   ============================================================ */
function setupCallListeners() {
  if (!currentUser) return;

  // Listen for incoming calls
  if (realtimeCalls) supabaseClient.removeChannel(realtimeCalls);
  realtimeCalls = supabaseClient
    .channel('calls-rt')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'calls',
        filter: `receiver_id=eq.${currentUser.id}` },
      payload => {
        const call = payload.new;
        if (call.status === 'ringing') {
          showIncomingCall(call);
        }
      }
    )
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'calls',
        filter: `caller_id=eq.${currentUser.id}` },
      payload => {
        const call = payload.new;
        // If receiver accepted/declined
        if (currentCall && call.id === currentCall.id) {
          if (call.status === 'accepted') {
            // Caller already started; update UI
            setCallStatus('Connected', false);
            startCallTimer();
          } else if (call.status === 'declined' || call.status === 'missed') {
            toast(call.status === 'missed' ? 'No answer' : 'Call declined');
            endCall(false);
          }
        }
      }
    )
    .subscribe();

  // Listen for WebRTC signals
  if (realtimeSignals) supabaseClient.removeChannel(realtimeSignals);
  realtimeSignals = supabaseClient
    .channel('signals-rt')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'call_signals' },
      async (payload) => {
        const sig = payload.new;
        if (!currentCall || sig.call_id !== currentCall.id) return;
        if (sig.sender_id === currentUser.id) return;

        if (sig.signal_type === 'offer') {
          await handleOffer(sig.payload);
        } else if (sig.signal_type === 'answer') {
          await handleAnswer(sig.payload);
        } else if (sig.signal_type === 'ice') {
          await handleIce(sig.payload);
        } else if (sig.signal_type === 'hangup') {
          toast('Call ended');
          endCall(false);
        }
      }
    )
    .subscribe();
}

/* ============ Start an outgoing call ============ */
async function startCall(type) {
  if (!activePartner) return;
  if (callState !== 'idle') { toast('Already in a call'); return; }

  try {
    callState = 'outgoing';

    // Create the call row
    const { data: call, error } = await supabaseClient
      .from('calls')
      .insert({
        caller_id: currentUser.id,
        receiver_id: activePartner.id,
        call_type: type,
        status: 'ringing'
      })
      .select()
      .single();
    if (error) throw error;

    currentCall = { id: call.id, type, role: 'caller', partner: activePartner };

    // Show call screen
    showCallScreen(activePartner, type, 'Calling…', true);

    // Get local media
    await acquireLocalMedia(type);

    // Create peer connection
    createPeerConnection();

    // Create offer
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    // Send offer
    await supabaseClient.from('call_signals').insert({
      call_id: call.id,
      sender_id: currentUser.id,
      signal_type: 'offer',
      payload: { sdp: offer.sdp, type: offer.type }
    });

  } catch (err) {
    console.error('[Call]', err);
    toast(err.message || 'Could not start call');
    endCall(true);
  }
}

/* ============ Show incoming call modal (receiver) ============ */
function showIncomingCall(call) {
  if (callState !== 'idle') {
    // Busy — auto-decline
    supabaseClient.from('calls').update({ status: 'declined', ended_at: new Date().toISOString() }).eq('id', call.id);
    return;
  }

  callState = 'incoming';
  incomingCallData = call;

  const caller = profileCache.get(call.caller_id) || { username: 'User' };
  if (!profileCache.has(call.caller_id)) {
    // Fetch and cache
    supabaseClient.from('profiles').select('id, username, display_name, avatar_url').eq('id', call.caller_id).maybeSingle().then(({ data }) => {
      if (data) {
        profileCache.set(call.caller_id, data);
        const initial = (data.display_name || data.username || 'U').charAt(0).toUpperCase();
        document.getElementById('incName').textContent = data.display_name || data.username;
        document.getElementById('incAvatar').innerHTML =
          data.avatar_url ? `<img src="${escapeHtml(data.avatar_url)}" alt="">` : initial;
      }
    });
  }

  const name = caller.display_name || caller.username || 'User';
  const initial = name.charAt(0).toUpperCase();
  document.getElementById('incName').textContent = name;
  document.getElementById('incAvatar').innerHTML =
    caller.avatar_url ? `<img src="${escapeHtml(caller.avatar_url)}" alt="">` : initial;
  document.getElementById('incType').textContent =
    call.call_type === 'video' ? '📹 Incoming video call' : '📞 Incoming voice call';

  document.getElementById('incomingCallModal').classList.add('active');

  // Auto-decline after 45s
  setTimeout(() => {
    if (callState === 'incoming' && incomingCallData && incomingCallData.id === call.id) {
      declineIncomingCall();
    }
  }, 45000);
}

async function declineIncomingCall() {
  document.getElementById('incomingCallModal').classList.remove('active');
  if (incomingCallData) {
    await supabaseClient.from('calls')
      .update({ status: 'declined', ended_at: new Date().toISOString() })
      .eq('id', incomingCallData.id);
  }
  incomingCallData = null;
  callState = 'idle';
}

async function acceptIncomingCall() {
  if (!incomingCallData) return;
  document.getElementById('incomingCallModal').classList.remove('active');
  const call = incomingCallData;
  incomingCallData = null;
  callState = 'active';

  try {
    // Update call status
    await supabaseClient.from('calls')
      .update({ status: 'accepted', accepted_at: new Date().toISOString() })
      .eq('id', call.id);

    // Load partner profile
    const partner = profileCache.get(call.caller_id) || await (async () => {
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', call.caller_id).single();
      return data;
    })();

    currentCall = { id: call.id, type: call.call_type, role: 'receiver', partner };

    showCallScreen(partner, call.call_type, 'Connecting…', false);
    await acquireLocalMedia(call.call_type);
    createPeerConnection();
    // Wait for the offer signal from caller (handled by realtimeSignals listener)

  } catch (err) {
    console.error('[Accept]', err);
    toast('Failed to accept call');
    endCall(true);
  }
}

/* ============ Peer connection ============ */
function createPeerConnection() {
  if (peerConnection) {
    try { peerConnection.close(); } catch (e) {}
  }

  peerConnection = new RTCPeerConnection(ICE_SERVERS);

  // Add local tracks
  if (localStream) {
    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });
  }

  // Receive remote tracks
  remoteStream = new MediaStream();
  peerConnection.ontrack = (event) => {
    event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));

    // Display remote media
    if (currentCall && currentCall.type === 'video') {
      const remoteEl = document.getElementById('remoteVideo');
      remoteEl.srcObject = remoteStream;
      remoteEl.style.display = 'block';
      document.getElementById('callerInfo').style.opacity = '0';
      document.getElementById('callerInfo').style.pointerEvents = 'none';
    } else {
      // Voice — show small avatar UI
      document.getElementById('callerInfo').style.opacity = '1';
    }
  };

  // ICE candidates
  peerConnection.onicecandidate = async (event) => {
    if (event.candidate && currentCall) {
      try {
        await supabaseClient.from('call_signals').insert({
          call_id: currentCall.id,
          sender_id: currentUser.id,
          signal_type: 'ice',
          payload: event.candidate.toJSON()
        });
      } catch (e) { console.warn('ICE send fail', e); }
    }
  };

  // Connection state
  peerConnection.onconnectionstatechange = () => {
    console.log('[Call] state:', peerConnection.connectionState);
    if (peerConnection.connectionState === 'connected') {
      setCallStatus('Connected', false);
      startCallTimer();
    } else if (['failed','disconnected','closed'].includes(peerConnection.connectionState)) {
      if (currentCall && callState === 'active') {
        toast('Call ended');
        endCall(true);
      }
    }
  };
}

/* ============ WebRTC signaling handlers ============ */
async function handleOffer(payload) {
  if (!peerConnection) {
    // Receiver: create PC if not ready
    createPeerConnection();
  }
  try {
    const offer = new RTCSessionDescription(payload);
    await peerConnection.setRemoteDescription(offer);

    // Apply queued ICE candidates
    for (const ice of pendingIceCandidates) {
      try { await peerConnection.addIceCandidate(ice); } catch (e) {}
    }
    pendingIceCandidates = [];

    // Create answer
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    await supabaseClient.from('call_signals').insert({
      call_id: currentCall.id,
      sender_id: currentUser.id,
      signal_type: 'answer',
      payload: { sdp: answer.sdp, type: answer.type }
    });
  } catch (err) {
    console.error('[Offer]', err);
  }
}

async function handleAnswer(payload) {
  if (!peerConnection) return;
  try {
    const answer = new RTCSessionDescription(payload);
    await peerConnection.setRemoteDescription(answer);

    for (const ice of pendingIceCandidates) {
      try { await peerConnection.addIceCandidate(ice); } catch (e) {}
    }
    pendingIceCandidates = [];
  } catch (err) {
    console.error('[Answer]', err);
  }
}

async function handleIce(payload) {
  const candidate = new RTCIceCandidate(payload);
  if (peerConnection && peerConnection.remoteDescription) {
    try { await peerConnection.addIceCandidate(candidate); } catch (e) {}
  } else {
    pendingIceCandidates.push(candidate);
  }
}

/* ============ Local media ============ */
async function acquireLocalMedia(type) {
  try {
    const constraints = type === 'video'
      ? { audio: true, video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' } }
      : { audio: true, video: false };

    localStream = await navigator.mediaDevices.getUserMedia(constraints);

    if (type === 'video') {
      const localEl = document.getElementById('localVideo');
      localEl.srcObject = localStream;
      localEl.style.display = 'block';
      localEl.muted = true;
    }
  } catch (err) {
    console.error('[Media]', err);
    toast('Cannot access camera/mic');
    throw err;
  }
}

/* ============ UI: show call screen ============ */
function showCallScreen(partner, type, statusText, isCaller) {
  const name = partner.display_name || partner.username || 'User';
  const initial = name.charAt(0).toUpperCase();
  const avatarHtml = partner.avatar_url
    ? `<img src="${escapeHtml(partner.avatar_url)}" alt="">`
    : initial;

  document.getElementById('callAvatar').innerHTML = avatarHtml;
  document.getElementById('callName').textContent = name;
  document.getElementById('callRemoteName').textContent = name;
  document.getElementById('callStatus').textContent = statusText;
  document.getElementById('callStatus').classList.add('ringing');
  document.getElementById('callTimer').textContent = '00:00';

  // Reset videos
  document.getElementById('remoteVideo').style.display = 'none';
  document.getElementById('localVideo').style.display = 'none';
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  document.getElementById('callerInfo').style.opacity = '1';
  document.getElementById('callerInfo').style.pointerEvents = 'auto';

  renderCallActions(isCaller, type);
  document.getElementById('callScreen').classList.add('active');
}

function renderCallActions(isCaller, type) {
  const actions = document.getElementById('callActions');
  if (isCaller) {
    // Only show mute/video toggle + end
    actions.innerHTML = `
      <button class="call-btn-round mute" id="btnMute" onclick="toggleMute()">
        <i class="fas fa-microphone"></i>
      </button>
      ${type === 'video' ? `
        <button class="call-btn-round video-toggle" id="btnCam" onclick="toggleCam()">
          <i class="fas fa-video"></i>
        </button>
      ` : `
        <button class="call-btn-round speaker" id="btnSpeaker" onclick="toggleSpeaker()">
          <i class="fas fa-volume-up"></i>
        </button>
      `}
      <button class="call-btn-round decline" onclick="endCall(true)">
        <i class="fas fa-phone-slash"></i>
      </button>
    `;
  } else {
    // Receiver already accepted → same controls
    actions.innerHTML = `
      <button class="call-btn-round mute" id="btnMute" onclick="toggleMute()">
        <i class="fas fa-microphone"></i>
      </button>
      ${type === 'video' ? `
        <button class="call-btn-round video-toggle" id="btnCam" onclick="toggleCam()">
          <i class="fas fa-video"></i>
        </button>
      ` : ''}
      <button class="call-btn-round decline" onclick="endCall(true)">
        <i class="fas fa-phone-slash"></i>
      </button>
    `;
  }
}

function setCallStatus(text, ringing) {
  const el = document.getElementById('callStatus');
  el.textContent = text;
  el.classList.toggle('ringing', ringing);
}

function startCallTimer() {
  if (callTimerInterval) clearInterval(callTimerInterval);
  callSeconds = 0;
  document.getElementById('callStatus').classList.remove('ringing');
  document.getElementById('callStatus').style.display = 'none';
  callTimerInterval = setInterval(() => {
    callSeconds++;
    const m = Math.floor(callSeconds / 60);
    const s = callSeconds % 60;
    document.getElementById('callTimer').textContent =
      `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }, 1000);
}

/* ============ End call ============ */
async function endCall(notify) {
  try {
    // Notify other party
    if (notify && currentCall) {
      try {
        await supabaseClient.from('call_signals').insert({
          call_id: currentCall.id,
          sender_id: currentUser.id,
          signal_type: 'hangup',
          payload: { reason: 'user_ended' }
        });
      } catch (e) {}
    }

    // Update call record
    if (currentCall && callState !== 'incoming') {
      const update = {
        status: callSeconds > 0 ? 'ended' : (callState === 'outgoing' ? 'cancelled' : 'ended'),
        ended_at: new Date().toISOString(),
        duration_secs: callSeconds
      };
      try {
        await supabaseClient.from('calls').update(update).eq('id', currentCall.id);
      } catch (e) {}
    }

    // Cleanup WebRTC
    if (peerConnection) { try { peerConnection.close(); } catch (e) {} peerConnection = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (remoteStream) { remoteStream.getTracks().forEach(t => t.stop()); remoteStream = null; }
    if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }

    callSeconds = 0;
    callState = 'idle';
    currentCall = null;
    pendingIceCandidates = [];

    document.getElementById('callScreen').classList.remove('active');
    document.getElementById('incomingCallModal').classList.remove('active');

    // Reload messages to show call log
    if (activePartner) loadMessages();
  } catch (err) {
    console.error('[End call]', err);
    document.getElementById('callScreen').classList.remove('active');
    callState = 'idle';
    currentCall = null;
  }
}

/* ============ Call controls ============ */
let isMuted = false;
function toggleMute() {
  if (!localStream) return;
  const audio = localStream.getAudioTracks()[0];
  if (audio) {
    audio.enabled = !audio.enabled;
    isMuted = !audio.enabled;
    const btn = document.getElementById('btnMute');
    btn.classList.toggle('muted', isMuted);
    btn.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
  }
}

let isCamOff = false;
function toggleCam() {
  if (!localStream) return;
  const video = localStream.getVideoTracks()[0];
  if (video) {
    video.enabled = !video.enabled;
    isCamOff = !video.enabled;
    const btn = document.getElementById('btnCam');
    btn.classList.toggle('off', isCamOff);
    btn.innerHTML = isCamOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
    document.getElementById('localVideo').style.opacity = isCamOff ? '0.3' : '1';
  }
}

let isSpeakerOn = false;
function toggleSpeaker() {
  isSpeakerOn = !isSpeakerOn;
  const btn = document.getElementById('btnSpeaker');
  btn.classList.toggle('on', isSpeakerOn);
  toast(isSpeakerOn ? '🔊 Speaker on' : '🔈 Speaker off');
}

async function recallUser(userId, type) {
  // Open the chat and start the call
  const partner = profileCache.get(userId);
  if (!partner) {
    const { data } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
    if (!data) { toast('User not found'); return; }
    profileCache.set(userId, data);
  }
  activePartner = profileCache.get(userId);
  await openChat(userId);
  setTimeout(() => startCall(type), 500);
}

/* ============================================================
   IMAGE VIEWER
   ============================================================ */
function openImgViewer(url) {
  document.getElementById('imgViewerSrc').src = url;
  document.getElementById('imgViewer').classList.add('active');
}
function closeImgViewer() {
  document.getElementById('imgViewer').classList.remove('active');
}

/* ============================================================
   INPUT HELPERS
   ============================================================ */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}
function handleTribeKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendTribeMessage();
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function formatTimeAgo(dateStr) {
  if (!dateStr) return '';
  const s = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (s < 60) return 'now';
  const m = Math.floor(s / 60); if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}h`;
  const d = Math.floor(h / 24); if (d < 7) return `${d}d`;
  return new Date(dateStr).toLocaleDateString();
}
function formatDateLabel(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.floor((today - dDay) / 86400000);
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Yesterday';
  if (diffDays < 7) return d.toLocaleDateString('en-US', { weekday: 'long' });
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg) {
  const el = document.getElementById('toastMini');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => el.classList.remove('show'), 2200);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('imgViewer').classList.remove('active');
    document.getElementById('lpOverlay').classList.remove('active');
    cancelRecording();
  }
});
