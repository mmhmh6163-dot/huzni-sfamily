<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Messages — Arizona AI</title>

<link rel="icon" type="image/jpeg" href="arizonan%20png%20icon.jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
body { background:#0a0a0a; padding-top:60px; padding-bottom:0; height:100vh; overflow:hidden; }

.topbar {
  position:fixed; top:0; left:0; right:0; height:60px;
  background:rgba(10,10,10,.97); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,107,53,.25);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; z-index:1000; max-width:640px; margin:0 auto;
}
.topbar .back, .topbar .icon-btn {
  color:var(--az-text); font-size:19px;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; text-decoration:none; cursor:pointer;
}
.topbar .title { font-size:16px; font-weight:700; color:var(--az-text); }

.search-bar {
  max-width:640px; margin:12px auto 6px;
  padding:0 16px;
}
.search-bar .wrap {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px; padding:10px 14px;
}
.search-bar input {
  flex:1; background:transparent; border:none;
  color:var(--az-text); font-size:14px; font-family:inherit;
}
.search-bar input:focus { outline:none; }
.search-bar i { color:var(--az-text-secondary); }

.msg-tabs {
  max-width:640px; margin:0 auto;
  padding:6px 16px;
  display:flex; gap:8px;
}
.msg-tabs .tab {
  flex:1; padding:10px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  color:var(--az-text-secondary);
  font-size:13px; font-weight:600;
  cursor:pointer; position:relative;
}
.msg-tabs .tab.active {
  background:rgba(255,107,53,.15);
  border-color:var(--az-primary);
  color:var(--az-accent);
}
.msg-tabs .tab .badge {
  position:absolute; top:-4px; right:-4px;
  background:var(--az-primary); color:#fff;
  font-size:9px; font-weight:800;
  padding:2px 6px; border-radius:10px;
  min-width:16px; display:none;
}
.msg-tabs .tab .badge.show { display:inline-block; }

.msg-list-wrap {
  max-width:640px; margin:0 auto;
  padding:8px 16px 80px;
  height: calc(100vh - 190px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.msg-list-wrap::-webkit-scrollbar { width:4px; }
.msg-list-wrap::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }

/* Skeleton loading */
.skeleton {
  display:flex; align-items:center; gap:12px;
  padding:12px 8px;
}
.skeleton .sk-av {
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  flex-shrink:0;
}
.skeleton .sk-lines { flex:1; }
.skeleton .sk-line {
  height:12px; border-radius:6px; margin-bottom:8px;
  background:linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
.skeleton .sk-line.short { width:60%; }
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.chat-row {
  display:flex; align-items:center; gap:12px;
  padding:12px 8px;
  border-bottom:1px solid rgba(255,255,255,.05);
  cursor:pointer; border-radius:10px;
  transition:background .15s;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } }
.chat-row:active { background:rgba(255,107,53,.08); }
.chat-row .av {
  width:52px; height:52px; border-radius:50%;
  background:var(--az-gradient);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:20px;
  flex-shrink:0; overflow:hidden;
}
.chat-row .av img { width:100%; height:100%; object-fit:cover; }
.chat-row .info { flex:1; min-width:0; }
.chat-row .info .name {
  font-size:14px; font-weight:700; color:var(--az-text);
  display:flex; align-items:center; gap:5px;
}
.chat-row .info .name .v { color:#3b82f6; font-size:11px; }
.chat-row .info .preview {
  font-size:13px; color:var(--az-text-secondary);
  margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chat-row .info .preview.unread { color:var(--az-text); font-weight:600; }
.chat-row .meta {
  text-align:right; font-size:11px;
  color:var(--az-text-secondary);
  flex-shrink:0;
}
.chat-row .meta .unread-dot {
  display:inline-block;
  background:var(--az-primary); color:#fff;
  border-radius:10px; padding:2px 7px;
  font-weight:700; font-size:10px;
  margin-top:6px;
}

.empty {
  text-align:center; padding:60px 20px;
  color:var(--az-text-secondary);
}
.empty i { font-size:52px; color:var(--az-primary); opacity:.4; margin-bottom:14px; display:block; }
.empty h3 { color:var(--az-text); font-size:16px; margin-bottom:6px; }
.empty p { font-size:13px; margin-bottom:16px; }
.empty a {
  display:inline-block; padding:11px 24px; border-radius:20px;
  background:var(--az-gradient); color:#fff;
  text-decoration:none; font-weight:700; font-size:13px;
}

/* CHAT VIEW */
.chat-view {
  position:fixed; inset:0;
  background:#0a0a0a;
  z-index:1500;
  display:none; flex-direction:column;
  max-width:640px; margin:0 auto;
}
.chat-view.active { display:flex; }
.chat-view-header {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(10,10,10,.98);
  height:60px;
}
.chat-view-header .back {
  color:var(--az-text); font-size:20px;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; cursor:pointer; background:none; border:none;
}
.chat-view-header .av {
  width:40px; height:40px; border-radius:50%;
  background:var(--az-gradient);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:16px;
  overflow:hidden;
}
.chat-view-header .av img { width:100%; height:100%; object-fit:cover; }
.chat-view-header .info { flex:1; }
.chat-view-header .info .name { font-size:14px; font-weight:700; color:var(--az-text); }
.chat-view-header .info .status { font-size:11px; color:var(--az-text-secondary); }

.chat-messages {
  flex:1; overflow-y:auto;
  padding:16px;
  display:flex; flex-direction:column; gap:8px;
  -webkit-overflow-scrolling: touch;
}
.chat-messages::-webkit-scrollbar { width:4px; }
.chat-messages::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }

.bubble {
  max-width:75%;
  padding:10px 14px;
  border-radius:18px;
  font-size:14px; line-height:1.45;
  word-wrap:break-word;
  animation:bubbleIn .2s ease;
}
@keyframes bubbleIn { from { opacity:0; transform:translateY(6px); } }
.bubble.me {
  background:var(--az-gradient); color:#fff;
  align-self:flex-end;
  border-bottom-right-radius:4px;
}
.bubble.them {
  background:rgba(255,255,255,.08);
  color:var(--az-text);
  align-self:flex-start;
  border-bottom-left-radius:4px;
}
.bubble .time {
  display:block;
  font-size:10px; opacity:.7;
  margin-top:4px;
}

.chat-input-wrap {
  display:flex; gap:10px;
  padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(10,10,10,.98);
}
.chat-input-wrap input {
  flex:1;
  padding:12px 16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  color:var(--az-text); font-size:14px;
  font-family:inherit;
}
.chat-input-wrap input:focus { outline:none; border-color:var(--az-primary); }
.chat-input-wrap button {
  width:44px; height:44px; border-radius:50%;
  background:var(--az-gradient); color:#fff;
  border:none; font-size:16px;
  cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.chat-input-wrap button:disabled { opacity:.5; }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay"><div class="loader"></div></div>

<header class="topbar">
  <a href="index.html" class="back"><i class="fas fa-arrow-left"></i></a>
  <span class="title">Messages</span>
  <a href="Friends.html" class="icon-btn"><i class="fas fa-user-plus"></i></a>
</header>

<div class="search-bar">
  <div class="wrap">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search messages…" oninput="filterChats()">
  </div>
</div>

<div class="msg-tabs">
  <button class="tab active" data-tab="chats" onclick="switchTab('chats', this)">
    <i class="fas fa-comments"></i> Chats
  </button>
  <button class="tab" data-tab="requests" onclick="switchTab('requests', this)">
    <i class="fas fa-user-clock"></i> Requests
    <span class="badge" id="reqBadge">0</span>
  </button>
</div>

<div class="msg-list-wrap" id="listWrap">
  <!-- Skeleton shown immediately -->
  <div class="skeleton"><div class="sk-av"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
  <div class="skeleton"><div class="sk-av"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
  <div class="skeleton"><div class="sk-av"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
</div>

<div class="chat-view" id="chatView">
  <div class="chat-view-header">
    <button class="back" onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
    <div class="av" id="cvAvatar">U</div>
    <div class="info">
      <div class="name" id="cvName">User</div>
      <div class="status" id="cvStatus">Tap to view profile</div>
    </div>
    <button class="back" onclick="viewProfile()"><i class="fas fa-info-circle"></i></button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-wrap">
    <input type="text" id="chatInput" placeholder="Message…" maxlength="2000"
           onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>

<script src="auth.js"></script>
<script>
/* ==================== STATE ==================== */
let currentTab = 'chats';
let conversations = [];
let requests = [];
let activePartner = null;
let searchQuery = '';
let realtimeChannel = null;
let profileCache = new Map();     // id → profile object
let messageCache = new Map();     // partnerId → array of messages
let isOpeningChat = false;

/* ==================== INIT ==================== */
document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      init();
    }
  }, 100);
});

async function init() {
  if (!currentUser) {
    document.getElementById('listWrap').innerHTML = `
      <div class="empty">
        <i class="fas fa-comments"></i>
        <h3>Sign in to see messages</h3>
        <p>Chat with friends on Arizona AI.</p>
        <a href="login.html">Sign In</a>
      </div>`;
    return;
  }

  // Run in parallel — much faster
  await Promise.all([loadChats(), loadRequests()]);

  updateReqBadge();
  renderList();
  setupRealtime();

  // Auto-open chat if ?user=ID is passed
  const params = new URLSearchParams(window.location.search);
  const autoUser = params.get('user');
  if (autoUser && autoUser !== currentUser.id) {
    openChat(autoUser);
  }
}

/* ==================== FAST LOAD ==================== */
async function loadChats() {
  try {
    // Only fetch the LATEST message per conversation — 10x faster
    const { data, error } = await supabaseClient.rpc('get_conversations', {
      viewer_id: currentUser.id
    });

    if (error) {
      // Fallback: if RPC not set up, use a lighter query
      const { data: fallback, error: fbErr } = await supabaseClient
        .from('messages')
        .select('id, content, created_at, is_read, sender_id, receiver_id')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .order('created_at', { ascending: false })
        .limit(80);
      if (fbErr) throw fbErr;

      // Group locally
      const map = new Map();
      (fallback || []).forEach(m => {
        const partnerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
        if (!map.has(partnerId)) map.set(partnerId, { partnerId, lastMessage: m, unread: 0 });
        const entry = map.get(partnerId);
        if (!m.is_read && m.receiver_id === currentUser.id) entry.unread++;
      });
      conversations = Array.from(map.values());
    } else {
      // RPC returned ready-to-use conversations
      conversations = (data || []).map(row => ({
        partnerId: row.partner_id,
        lastMessage: {
          content: row.last_content,
          created_at: row.last_at,
          sender_id: row.last_sender_id,
          is_read: row.last_is_read
        },
        unread: row.unread_count || 0
      }));
    }

    // Fetch all partner profiles in ONE query (not N queries)
    const partnerIds = [...new Set(conversations.map(c => c.partnerId))];
    if (partnerIds.length > 0) {
      const { data: profiles } = await supabaseClient
        .from('profiles')
        .select('id, username, display_name, avatar_url, is_verified')
        .in('id', partnerIds);
      (profiles || []).forEach(p => profileCache.set(p.id, p));
      conversations.forEach(c => {
        c.partner = profileCache.get(c.partnerId) || { id: c.partnerId, username: 'user' };
      });
    }

    // Sort by latest
    conversations.sort((a, b) => new Date(b.lastMessage.created_at) - new Date(a.lastMessage.created_at));
  } catch (err) {
    console.error('loadChats:', err);
    conversations = [];
  }
}

async function loadRequests() {
  try {
    const { data, error } = await supabaseClient
      .from('follow_requests')
      .select('id, status, created_at, requester_id, target_id')
      .eq('target_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (error) throw error;
    requests = data || [];

    // Fetch requester profiles in one query
    const requesterIds = [...new Set(requests.map(r => r.requester_id))];
    if (requesterIds.length > 0) {
      const { data: profiles } = await supabaseClient
        .from('profiles')
        .select('id, username, display_name, avatar_url, is_verified, is_private')
        .in('id', requesterIds);
      (profiles || []).forEach(p => profileCache.set(p.id, p));
      requests.forEach(r => { r.requester = profileCache.get(r.requester_id) || { id: r.requester_id }; });
    }
  } catch (err) {
    console.error('loadRequests:', err);
    requests = [];
  }
}

function updateReqBadge() {
  const pending = requests.filter(r => r.status === 'pending').length;
  const badge = document.getElementById('reqBadge');
  badge.textContent = pending;
  badge.classList.toggle('show', pending > 0);
}

/* ==================== RENDER ==================== */
function renderList() {
  const wrap = document.getElementById('listWrap');
  if (currentTab === 'chats') renderChats(wrap);
  else renderRequests(wrap);
}

function renderChats(wrap) {
  if (conversations.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <i class="fas fa-comments"></i>
        <h3>No messages yet</h3>
        <p>Find friends to start chatting.</p>
        <a href="Friends.html">Find Friends</a>
      </div>`;
    return;
  }

  const filtered = conversations.filter(c => {
    if (!searchQuery) return true;
    const name = (c.partner?.display_name || c.partner?.username || '').toLowerCase();
    return name.includes(searchQuery.toLowerCase());
  });

  if (filtered.length === 0) {
    wrap.innerHTML = `<div class="empty"><i class="fas fa-search"></i><h3>No matches</h3></div>`;
    return;
  }

  // Build HTML in one chunk (faster than DOM appends)
  wrap.innerHTML = filtered.map(c => {
    const p = c.partner || {};
    const name = p.display_name || p.username || 'user';
    const initial = name.charAt(0).toUpperCase();
    const verified = p.is_verified ? '<i class="fas fa-circle-check v"></i>' : '';
    const avatar = p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" alt="" loading="lazy">` : initial;
    const preview = (c.lastMessage.sender_id === currentUser.id ? 'You: ' : '') + (c.lastMessage.content || '📎');
    const time = formatTimeAgo(c.lastMessage.created_at);
    const unread = c.unread > 0 ? `<div class="unread-dot">${c.unread}</div>` : '';

    return `
      <div class="chat-row" onclick="openChat('${p.id}')">
        <div class="av">${avatar}</div>
        <div class="info">
          <div class="name">${escapeHtml(name)} ${verified}</div>
          <div class="preview ${c.unread > 0 ? 'unread' : ''}">${escapeHtml(preview).slice(0, 60)}</div>
        </div>
        <div class="meta">
          <div>${time}</div>
          ${unread}
        </div>
      </div>
    `;
  }).join('');
}

function renderRequests(wrap) {
  if (requests.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <i class="fas fa-user-check"></i>
        <h3>No requests</h3>
        <p>Follow requests will appear here.</p>
      </div>`;
    return;
  }

  wrap.innerHTML = requests.map(r => {
    const p = r.requester || {};
    const name = p.display_name || p.username || 'user';
    const initial = name.charAt(0).toUpperCase();
    const avatar = p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" alt="" loading="lazy">` : initial;

    if (r.status === 'pending') {
      return `
        <div class="chat-row" style="cursor:default;">
          <div class="av">${avatar}</div>
          <div class="info">
            <div class="name">${escapeHtml(name)}</div>
            <div class="preview">wants to follow you</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button onclick="respondRequest('${r.id}', 'accepted', this)"
              style="padding:8px 14px; border-radius:20px; background:var(--az-gradient); border:none; color:#fff; font-weight:700; font-size:12px; cursor:pointer;">Accept</button>
            <button onclick="respondRequest('${r.id}', 'rejected', this)"
              style="padding:8px 14px; border-radius:20px; background:transparent; border:1px solid rgba(255,255,255,.2); color:#fff; font-weight:700; font-size:12px; cursor:pointer;">Decline</button>
          </div>
        </div>`;
    }
    return `
      <div class="chat-row" style="cursor:default;">
        <div class="av">${avatar}</div>
        <div class="info">
          <div class="name">${escapeHtml(name)}</div>
          <div class="preview">${r.status === 'accepted' ? '✅ Accepted' : '❌ Declined'}</div>
        </div>
      </div>`;
  }).join('');
}

function filterChats() {
  searchQuery = document.getElementById('searchInput').value.trim();
  renderList();
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.msg-tabs .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

/* ==================== RESPOND REQUEST ==================== */
async function respondRequest(reqId, status, btn) {
  btn.disabled = true;
  try {
    const { data: req } = await supabaseClient.from('follow_requests').select('*').eq('id', reqId).single();
    await supabaseClient.from('follow_requests').update({ status }).eq('id', reqId);

    if (status === 'accepted' && req) {
      await supabaseClient.from('follows').insert({ follower_id: req.requester_id, following_id: req.target_id });
      showToast('Request accepted ✅', 'success');
    } else {
      showToast('Declined', 'success');
    }
    await loadRequests();
    updateReqBadge();
    renderList();
  } catch (err) {
    showToast(err.message, 'error');
    btn.disabled = false;
  }
}

/* ==================== OPEN CHAT ==================== */
async function openChat(partnerId) {
  if (isOpeningChat) return;
  isOpeningChat = true;

  try {
    // Get partner from cache or fetch
    let partner = profileCache.get(partnerId);
    if (!partner) {
      const { data } = await supabaseClient
        .from('profiles').select('*').eq('id', partnerId).maybeSingle();
      if (!data) { showToast('User not found', 'error'); return; }
      partner = data;
      profileCache.set(partnerId, partner);
    }

    activePartner = partner;
    const name = partner.display_name || partner.username || 'user';
    const initial = name.charAt(0).toUpperCase();
    const avatar = partner.avatar_url ? `<img src="${escapeHtml(partner.avatar_url)}" alt="">` : initial;

    document.getElementById('cvAvatar').innerHTML = avatar;
    document.getElementById('cvName').textContent = name;
    document.getElementById('cvStatus').textContent = '@' + (partner.username || 'user');

    document.getElementById('chatView').classList.add('active');

    await loadMessages();
    await markMessagesRead();
  } finally {
    isOpeningChat = false;
  }
}

function closeChat() {
  document.getElementById('chatView').classList.remove('active');
  activePartner = null;
  if (window.history.replaceState) {
    window.history.replaceState(null, '', 'chats.html');
  }
  loadChats().then(() => renderList());
}

function viewProfile() {
  if (activePartner) window.location.href = 'profile.html?user=' + activePartner.id;
}

/* ==================== LOAD MESSAGES ==================== */
async function loadMessages() {
  const box = document.getElementById('chatMessages');
  if (!activePartner) return;

  // Show skeleton while loading
  box.innerHTML = `
    <div style="text-align:center;padding:20px;">
      <div class="skeleton"><div class="sk-av"></div><div class="sk-lines"><div class="sk-line"></div></div></div>
    </div>`;

  try {
    const { data, error } = await supabaseClient
      .from('messages')
      .select('id, sender_id, receiver_id, content, created_at')
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activePartner.id}),and(sender_id.eq.${activePartner.id},receiver_id.eq.${currentUser.id})`)
      .order('created_at', { ascending: true })
      .limit(100);

    if (error) throw error;
    messageCache.set(activePartner.id, data || []);
    box.innerHTML = (data || []).map(m => renderBubble(m)).join('');
    box.scrollTop = box.scrollHeight;
  } catch (err) {
    box.innerHTML = `<div style="text-align:center;color:#ff7675;padding:20px;">${escapeHtml(err.message)}</div>`;
  }
}

function renderBubble(m) {
  const mine = m.sender_id === currentUser.id;
  const time = new Date(m.created_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  return `
    <div class="bubble ${mine ? 'me' : 'them'}">
      ${escapeHtml(m.content || '')}
      <span class="time">${time}</span>
    </div>`;
}

/* ==================== SEND MESSAGE ==================== */
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const content = input.value.trim();
  if (!content || !activePartner) return;

  input.value = '';
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  // Optimistic append (instant feedback)
  const box = document.getElementById('chatMessages');
  const optimisticId = 'temp-' + Date.now();
  box.insertAdjacentHTML('beforeend', `
    <div class="bubble me" id="${optimisticId}">
      ${escapeHtml(content)}
      <span class="time">Sending…</span>
    </div>`);
  box.scrollTop = box.scrollHeight;

  try {
    const { error } = await supabaseClient.from('messages').insert({
      sender_id:   currentUser.id,
      receiver_id: activePartner.id,
      content:     content
    });
    if (error) throw error;

    // Remove optimistic + reload quietly
    document.getElementById(optimisticId)?.remove();
    const { data } = await supabaseClient
      .from('messages')
      .select('id, sender_id, receiver_id, content, created_at')
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activePartner.id}),and(sender_id.eq.${activePartner.id},receiver_id.eq.${currentUser.id})`)
      .order('created_at', { ascending: true })
      .limit(100);
    box.innerHTML = (data || []).map(m => renderBubble(m)).join('');
    box.scrollTop = box.scrollHeight;
    messageCache.set(activePartner.id, data || []);
  } catch (err) {
    document.getElementById(optimisticId)?.remove();
    showToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

/* ==================== MARK READ ==================== */
async function markMessagesRead() {
  if (!activePartner) return;
  // Fire and forget — don't await
  supabaseClient
    .from('messages')
    .update({ is_read: true })
    .eq('sender_id', activePartner.id)
    .eq('receiver_id', currentUser.id)
    .eq('is_read', false)
    .then(() => {});
}

/* ==================== REALTIME (efficient) ==================== */
function setupRealtime() {
  if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

  realtimeChannel = supabaseClient
    .channel('messages-realtime')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages' },
      payload => {
        const m = payload.new;

        // If open chat, append bubble instantly
        if (activePartner &&
            ((m.sender_id === activePartner.id && m.receiver_id === currentUser.id) ||
             (m.sender_id === currentUser.id && m.receiver_id === activePartner.id))) {
          const box = document.getElementById('chatMessages');
          box.insertAdjacentHTML('beforeend', renderBubble(m));
          box.scrollTop = 999999;
          if (m.receiver_id === currentUser.id) markMessagesRead();
        }

        // Update the conversation list WITHOUT full reload
        const partnerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
        const existing = conversations.find(c => c.partnerId === partnerId);

        if (existing) {
          existing.lastMessage = m;
          if (m.receiver_id === currentUser.id && !m.is_read) existing.unread++;
          conversations = conversations.filter(c => c.partnerId !== partnerId);
          conversations.unshift(existing);
        } else {
          // New conversation — fetch partner profile once
          (async () => {
            const { data } = await supabaseClient
              .from('profiles').select('id, username, display_name, avatar_url, is_verified')
              .eq('id', partnerId).maybeSingle();
            if (data) {
              profileCache.set(partnerId, data);
              conversations.unshift({
                partnerId,
                partner: data,
                lastMessage: m,
                unread: 1
              });
              renderList();
            }
          })();
          return;
        }

        if (currentTab === 'chats') renderList();
      }
    )
    .subscribe();
}

/* ==================== HELPERS ==================== */
function formatTimeAgo(dateStr) {
  const s = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (s < 60) return 'now';
  const m = Math.floor(s / 60); if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}h`;
  const d = Math.floor(h / 24); if (d < 7) return `${d}d`;
  return new Date(dateStr).toLocaleDateString();
}
