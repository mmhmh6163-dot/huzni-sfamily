<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>View Post — Arizona AI</title>

<!-- Dynamic Open Graph Tags for sharing individual posts -->
<meta property="og:type" content="article">
<meta property="og:site_name" content="Arizona AI">
<meta property="og:title" id="ogTitle" content="Arizona AI Post">
<meta property="og:description" id="ogDesc" content="Check out this post on Arizona AI">
<meta property="og:image" id="ogImage" content="https://aiarizonan.com/icon.png">
<meta property="og:url" id="ogUrl" content="https://aiarizonan.com/post.html">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="twTitle" content="Arizona AI Post">
<meta name="twitter:description" id="twDesc" content="Check out this post on Arizona AI">
<meta name="twitter:image" id="twImage" content="https://aiarizonan.com/icon.png">

<link rel="icon" type="image/png" href="/icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
/* ==================== BASE ==================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body { background:#0a0a0a; padding-top:calc(60px + env(safe-area-inset-top)); padding-bottom:calc(70px + env(safe-area-inset-bottom)); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

/* ==================== TOP BAR ==================== */
.topbar { position:fixed; top:0; left:0; right:0; height:calc(60px + env(safe-area-inset-top)); padding-top:env(safe-area-inset-top); background:rgba(10,10,10,.97); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,107,53,.25); display:flex; align-items:center; justify-content:space-between; padding-left:16px; padding-right:16px; z-index:1000; max-width:640px; margin:0 auto; }
.topbar .back, .topbar .icon-btn { color:var(--az-text); font-size:19px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; text-decoration:none; cursor:pointer; background:none; border:none; }
.topbar .icon-btn:hover { background:rgba(255,255,255,.06); }
.topbar .title { font-size:16px; font-weight:700; color:var(--az-text); }

/* ==================== POST CARD ==================== */
.post-card { max-width:640px; margin:0 auto; background:rgba(255,255,255,.03); border-bottom:1px solid rgba(255,255,255,.06); }
.post-head { display:flex; align-items:center; gap:12px; padding:12px 16px; }
.post-head .avatar { width:38px; height:38px; border-radius:50%; background:var(--az-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:15px; flex-shrink:0; text-decoration:none; overflow:hidden; }
.post-head .avatar img { width:100%; height:100%; object-fit:cover; }
.post-head .meta { flex:1; min-width:0; }
.post-head .meta .name { font-weight:700; font-size:14px; color:var(--az-text); display:flex; align-items:center; gap:5px; text-decoration:none; }
.post-head .meta .name .verified { color:#3b82f6; font-size:12px; }
.post-head .meta .sub { font-size:11px; color:var(--az-text-secondary); }

.post-media { width:100%; background:#000; display:flex; align-items:center; justify-content:center; max-height:620px; overflow:hidden; position:relative; }
.post-media img, .post-media video { width:100%; height:auto; max-height:620px; object-fit:contain; display:block; }
.post-media .watermark { position:absolute; bottom:12px; right:12px; display:flex; align-items:center; gap:5px; font-size:10px; color:rgba(255,255,255,.85); background:rgba(0,0,0,.5); padding:4px 10px; border-radius:12px; font-weight:700; pointer-events:none; }
.post-media .watermark img { width:14px; height:14px; border-radius:3px; }

.post-body { padding:10px 16px 14px; }
.post-caption { font-size:14px; line-height:1.5; color:var(--az-text); margin-top:6px; word-wrap:break-word; }
.post-caption .cap-user { font-weight:700; margin-right:6px; }

.post-actions { display:flex; align-items:center; gap:16px; padding:8px 16px 6px; }
.action-btn { background:none; border:none; color:var(--az-text); font-size:22px; cursor:pointer; padding:4px; display:flex; align-items:center; transition:transform .15s ease; }
.action-btn:hover { transform:scale(1.1); }
.action-btn.liked { color:var(--az-primary); }
.action-btn.saved { color:var(--az-accent); }
.action-btn.save { margin-left:auto; }

.post-likes { padding:2px 16px 4px; font-size:13px; font-weight:700; color:var(--az-text); }
.post-stats { padding:0 16px 6px; display:flex; gap:14px; font-size:12px; color:var(--az-text-secondary); }
.post-stats span { display:flex; align-items:center; gap:4px; }
.post-time { padding:4px 16px 12px; font-size:10px; color:var(--az-text-secondary); text-transform:uppercase; letter-spacing:.5px; }

/* ==================== COMMENTS ==================== */
.comments-section { max-width:640px; margin:16px auto; padding:0 16px; }
.comments-section h3 { font-size:14px; font-weight:700; color:var(--az-text); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.comment-row { display:flex; gap:10px; padding:8px 0; }
.comment-row .cav { width:32px; height:32px; border-radius:50%; background:var(--az-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:13px; flex-shrink:0; overflow:hidden; }
.comment-row .cav img { width:100%; height:100%; object-fit:cover; }
.comment-row .ctext { flex:1; }
.comment-row .ctext .cname { font-size:12px; font-weight:700; color:var(--az-text); margin-bottom:2px; }
.comment-row .ctext .cbody { font-size:13px; color:var(--az-text); line-height:1.4; }
.comment-row .ctext .ctime { font-size:10px; color:var(--az-text-secondary); margin-top:3px; }

.add-comment { max-width:640px; margin:0 auto; padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.08); display:flex; gap:8px; background:rgba(10,10,10,.95); position:sticky; bottom:0; z-index:100; }
.add-comment input { flex:1; padding:11px 14px; background:#1a1a1a; border:1px solid #333; border-radius:22px; color:#fff; font-size:13px; font-family:inherit; }
.add-comment input:focus { outline:none; border-color:var(--az-primary); }
.add-comment button { padding:0 18px; background:var(--az-gradient); color:#fff; border:none; border-radius:22px; font-weight:700; font-size:13px; cursor:pointer; }

/* ==================== TOAST ==================== */
.toast-mini { position:fixed; bottom:calc(100px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px); background:rgba(10,10,10,.98); border:1px solid rgba(255,107,53,.4); color:#fff; padding:10px 18px; border-radius:22px; font-size:13px; font-weight:600; z-index:9999; opacity:0; pointer-events:none; transition:all .25s ease; max-width:90%; text-align:center; }
.toast-mini.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay"><div class="loader"></div></div>

<header class="topbar">
  <a href="index.html" class="back"><i class="fas fa-arrow-left"></i></a>
  <span class="title">Post</span>
  <button class="icon-btn" onclick="sharePost()" title="Share"><i class="fas fa-share-alt"></i></button>
</header>

<div id="authWall" style="display:none;">
  <div style="text-align:center;padding:40px;">
    <h2 style="color:#fff;">Sign in to view</h2>
    <a href="login.html" style="color:var(--az-primary);font-weight:700;display:block;margin-top:16px;">Sign In</a>
  </div>
</div>

<main id="postContent" style="display:none;">
  <div class="post-card" id="postCard"></div>
  <div class="comments-section" id="commentsSection"></div>
</main>

<div class="add-comment" id="addCommentBar" style="display:none;">
  <input type="text" id="commentInput" placeholder="Add a comment…" maxlength="500">
  <button onclick="submitComment()">Post</button>
</div>

<div id="toastMini" class="toast-mini"></div>

<script src="auth.js"></script>
<script>
let currentPostId = null;

document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      initPost();
    }
  }, 100);
});

async function initPost() {
  const params = new URLSearchParams(window.location.search);
  currentPostId = params.get('id') || params.get('post');

  if (!currentPostId) {
    document.getElementById('authWall').style.display = 'block';
    document.getElementById('authWall').innerHTML = '<div style="text-align:center;padding:40px;"><h2 style="color:#fff;">Post not found</h2><a href="index.html" style="color:var(--az-primary);font-weight:700;display:block;margin-top:16px;">Go Home</a></div>';
    return;
  }

  await loadPost();
}

async function loadPost() {
  try {
    // 1. Fetch the post
    const { data: post, error } = await supabaseClient
      .from('posts')
      .select('*, profiles:user_id(username, display_name, avatar_url, is_verified)')
      .eq('id', currentPostId)
      .single();

    if (error || !post) throw new Error('Post not found');

    // 2. Set Dynamic Open Graph Tags for sharing
    const prof = post.profiles || {};
    const name = prof.display_name || prof.username || 'User';
    const uname = prof.username || 'user';
    const hasMedia = Array.isArray(post.media_urls) && post.media_urls.length > 0;
    const firstMedia = hasMedia ? post.media_urls[0] : 'https://aiarizonan.com/icon.png';
    const isVideo = /\.(mp4|webm|ogg|mov)$/i.test(firstMedia);
    const desc = post.content || `A post by @${uname} on Arizona AI`;

    document.title = `${name} on Arizona AI`;
    document.getElementById('ogTitle').content = `${name} (@${uname}) — Arizona AI`;
    document.getElementById('ogDesc').content = desc;
    document.getElementById('ogImage').content = isVideo ? 'https://aiarizonan.com/icon.png' : firstMedia;
    document.getElementById('ogUrl').content = window.location.href;
    
    document.getElementById('twTitle').content = `${name} (@${uname}) — Arizona AI`;
    document.getElementById('twDesc').content = desc;
    document.getElementById('twImage').content = isVideo ? 'https://aiarizonan.com/icon.png' : firstMedia;

    // 3. Render the Post
    renderPostCard(post);

    // 4. Log view
    if (currentUser && post.user_id !== currentUser.id) {
      try { await supabaseClient.rpc('log_post_view', { p_post_id: currentPostId }); } catch(e){}
    }

    // 5. Load Comments
    await loadComments();

    document.getElementById('postContent').style.display = 'block';
    document.getElementById('addCommentBar').style.display = 'flex';

  } catch (err) {
    console.error(err);
    document.getElementById('authWall').style.display = 'block';
    document.getElementById('authWall').innerHTML = '<div style="text-align:center;padding:40px;"><h2 style="color:#fff;">Post not found</h2><p style="color:#888;">It may have been deleted.</p><a href="index.html" style="color:var(--az-primary);font-weight:700;display:block;margin-top:16px;">Go Home</a></div>';
  }
}

function renderPostCard(post) {
  const card = document.getElementById('postCard');
  const prof = post.profiles || {};
  const name = prof.display_name || prof.username || 'user';
  const uname = prof.username || 'user';
  const initial = name.charAt(0).toUpperCase();
  const verified = prof.is_verified ? '<i class="fas fa-circle-check verified"></i>' : '';
  const avatarHtml = prof.avatar_url ? `<img src="${escapeHtml(prof.avatar_url)}">` : initial;
  const timeAgo = formatTimeAgo(post.created_at);

  const mediaUrls = Array.isArray(post.media_urls) ? post.media_urls : [];
  const mediaHtml = mediaUrls.map(url => {
    if (/\.(mp4|webm|ogg|mov)$/i.test(url)) {
      return `<video src="${escapeHtml(url)}" controls playsinline preload="metadata"></video>`;
    }
    return `<img src="${escapeHtml(url)}" alt="Post media">`;
  }).join('');

  card.innerHTML = `
    <div class="post-head">
      <a href="profile.html?user=${post.user_id}" class="avatar">${avatarHtml}</a>
      <div class="meta">
        <a href="profile.html?user=${post.user_id}" class="name">${escapeHtml(name)} ${verified}</a>
        <div class="sub">@${escapeHtml(uname)} · ${timeAgo}</div>
      </div>
    </div>

    ${mediaHtml ? `
      <div class="post-media">
        ${mediaHtml}
        <div class="watermark"><img src="/icon.png" alt=""> Arizona AI</div>
      </div>
    ` : ''}

    <div class="post-body">
      ${post.content ? `<div class="post-caption"><span class="cap-user">${escapeHtml(uname)}</span>${escapeHtml(post.content)}</div>` : ''}
    </div>

    <div class="post-actions">
      <button class="action-btn" onclick="sharePost()"><i class="far fa-paper-plane"></i></button>
      <button class="action-btn save" onclick="copyLink()"><i class="far fa-copy"></i></button>
    </div>

    <div class="post-likes">${post.likes_count || 0} likes</div>
    
    <div class="post-stats">
      <span><i class="far fa-comment"></i> ${post.comments_count || 0}</span>
      <span><i class="far fa-paper-plane"></i> ${post.shares_count || 0}</span>
      <span><i class="far fa-eye"></i> ${post.views_count || 0}</span>
    </div>
    <div class="post-time">${timeAgo}</div>
  `;
}

async function loadComments() {
  const section = document.getElementById('commentsSection');
  section.innerHTML = '<div style="text-align:center;padding:20px;color:#666;"><i class="fas fa-circle-notch fa-spin"></i></div>';

  const { data, error } = await supabaseClient
    .from('comments')
    .select('*, profiles:user_id(username, display_name, avatar_url)')
    .eq('post_id', currentPostId)
    .order('created_at', { ascending: true });

  if (error || !data || data.length === 0) {
    section.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">No comments yet.</div>';
    return;
  }

  section.innerHTML = `<h3><i class="far fa-comment"></i> Comments (${data.length})</h3>` + data.map(c => {
    const p = c.profiles || {};
    const cname = p.display_name || p.username || 'user';
    const cinit = cname.charAt(0).toUpperCase();
    const cav = p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}">` : cinit;
    return `
      <div class="comment-row">
        <div class="cav">${cav}</div>
        <div class="ctext">
          <div class="cname">${escapeHtml(cname)}</div>
          <div class="cbody">${escapeHtml(c.content)}</div>
          <div class="ctime">${formatTimeAgo(c.created_at)}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function submitComment() {
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;
  if (!currentUser) { showToast('Sign in to comment'); return; }

  try {
    await supabaseClient.from('comments').insert({
      user_id: currentUser.id,
      post_id: currentPostId,
      content: text
    });
    input.value = '';
    await loadComments();
    showToast('Comment added ✅');
  } catch (err) { showToast(err.message); }
}

function sharePost() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: 'Arizona AI Post', text: 'Check out this post!', url });
  } else {
    copyLink();
  }
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => showToast('Link copied! 📋'));
}

function formatTimeAgo(dateStr) {
  if (!dateStr) return 'Just now';
  const dateStr2 = String(dateStr).includes('Z') || String(dateStr).includes('+') ? dateStr : dateStr + 'Z';
  const then = new Date(dateStr2).getTime();
  const s = Math.floor((Date.now() - then) / 1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60); if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24); return `${d}d ago`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg) {
  const el = document.getElementById('toastMini');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
</body>
</html>
