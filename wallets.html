<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wallet — Arizona AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
body { background:#0a0a0a; padding-top:60px; padding-bottom:70px; }

.topbar {
  position:fixed; top:0; left:0; right:0; height:60px;
  background:rgba(10,10,10,.97); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,107,53,.25);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; z-index:1000; max-width:640px; margin:0 auto;
}
.topbar .back { color:var(--az-text); font-size:20px; width:40px; height:40px;
  display:flex; align-items:center; justify-content:center; border-radius:50%; text-decoration:none; }
.topbar .title { font-size:16px; font-weight:700; }
.topbar .icon-btn { color:var(--az-text); width:40px; height:40px;
  display:flex; align-items:center; justify-content:center; border-radius:50%; }

/* Balance hero */
.balance-hero {
  max-width:640px; margin:20px auto 16px;
  padding:0 16px;
}
.balance-card {
  background:linear-gradient(135deg,#FF6B35 0%,#FFB20F 100%);
  border-radius:20px; padding:28px 24px; color:#fff;
  box-shadow:0 15px 40px rgba(255,107,53,.35);
  position:relative; overflow:hidden;
}
.balance-card::before {
  content:''; position:absolute; top:-50%; right:-30%;
  width:200px; height:200px; border-radius:50%;
  background:rgba(255,255,255,.15);
}
.balance-card .label {
  font-size:12px; text-transform:uppercase; letter-spacing:1.5px;
  opacity:.9; margin-bottom:8px;
}
.balance-card .amount {
  font-size:40px; font-weight:800; line-height:1; margin-bottom:18px;
  position:relative;
}
.balance-card .sub-row {
  display:flex; gap:20px; padding-top:16px;
  border-top:1px solid rgba(255,255,255,.25);
  position:relative;
}
.balance-card .sub-row .col { flex:1; }
.balance-card .sub-row .col .n { font-size:16px; font-weight:700; }
.balance-card .sub-row .col .l { font-size:11px; opacity:.85; text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }

/* Quick actions */
.wallet-actions {
  max-width:640px; margin:0 auto 24px;
  padding:0 16px;
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
}
.wallet-action {
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px; padding:14px 8px;
  color:var(--az-text); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  font-size:12px; font-weight:600;
  text-decoration:none;
  transition:all .2s;
}
.wallet-action:hover {
  background:rgba(255,107,53,.12);
  border-color:var(--az-primary);
}
.wallet-action i { font-size:20px; color:var(--az-accent); }

/* Section */
.section {
  max-width:640px; margin:0 auto;
  padding:0 16px;
}
.section-head {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 0 12px;
}
.section-head h3 {
  font-size:14px; text-transform:uppercase; letter-spacing:1px;
  color:var(--az-text-secondary);
}
.section-head a {
  font-size:12px; color:var(--az-primary);
  text-decoration:none; font-weight:600;
}

/* Transactions */
.tx-list { padding-bottom:20px; }
.tx-item {
  display:flex; align-items:center; gap:12px;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.tx-item:last-child { border-bottom:none; }
.tx-icon {
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
}
.tx-icon.earn     { background:rgba(0,184,148,.15); color:#00b894; }
.tx-icon.spend    { background:rgba(255,118,117,.15); color:#ff7675; }
.tx-icon.bonus    { background:rgba(255,178,15,.15); color:#FFB20F; }
.tx-icon.withdraw { background:rgba(0,78,137,.15); color:#4da3ff; }
.tx-icon.deposit  { background:rgba(124,58,237,.15); color:#a78bfa; }

.tx-info { flex:1; min-width:0; }
.tx-info .label {
  font-size:14px; font-weight:600; color:var(--az-text);
  text-transform:capitalize;
}
.tx-info .sub {
  font-size:11px; color:var(--az-text-secondary); margin-top:2px;
}
.tx-amount {
  font-size:15px; font-weight:700;
  white-space:nowrap;
}
.tx-amount.positive { color:#00b894; }
.tx-amount.negative { color:#ff7675; }

/* Empty state */
.empty {
  text-align:center; padding:40px 20px;
  color:var(--az-text-secondary);
}
.empty i {
  font-size:44px; color:var(--az-primary);
  opacity:.4; margin-bottom:12px; display:block;
}
.empty h3 { color:var(--az-text); font-size:15px; margin-bottom:6px; }

/* Coming soon modal */
.modal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.85); z-index:2000;
  align-items:center; justify-content:center; padding:20px;
}
.modal.active { display:flex; }
.modal-box {
  background:#151515; border-radius:20px;
  padding:28px 24px; max-width:380px; width:100%;
  text-align:center;
}
.modal-box i { font-size:44px; color:var(--az-accent); margin-bottom:12px; }
.modal-box h3 { color:var(--az-text); margin-bottom:8px; font-size:18px; }
.modal-box p { color:var(--az-text-secondary); font-size:14px; margin-bottom:20px; line-height:1.6; }
.modal-box button {
  width:100%; padding:13px; border-radius:12px;
  background:var(--az-gradient); border:none; color:#fff;
  font-weight:700; cursor:pointer; font-size:14px;
}

/* Auth wall */
.auth-wall {
  max-width:440px; margin:60px auto;
  padding:32px 24px; text-align:center;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,107,53,.25);
  border-radius:20px;
}
.auth-wall i { font-size:48px; color:var(--az-primary); margin-bottom:14px; }
.auth-wall h2 { color:var(--az-text); margin-bottom:8px; }
.auth-wall p { color:var(--az-text-secondary); font-size:14px; margin-bottom:20px; }
.auth-wall a { display:block; padding:13px; border-radius:12px; text-decoration:none; font-weight:700; margin-bottom:10px; }
.auth-wall a.primary { background:var(--az-gradient); color:#fff; }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay"><div class="loader"></div></div>

<header class="topbar" id="topbar" style="display:none;">
  <a href="profile.html" class="back"><i class="fas fa-arrow-left"></i></a>
  <span class="title">Wallet</span>
  <a href="logout.html" class="icon-btn"><i class="fas fa-sign-out-alt"></i></a>
</header>

<div id="authWall" style="display:none;">
  <div class="auth-wall">
    <i class="fas fa-wallet"></i>
    <h2>Sign in to view wallet</h2>
    <p>Your balance, transactions, and earnings are all here.</p>
    <a href="login.html" class="primary">Sign In</a>
    <a href="register.html" style="border:1px solid var(--az-primary); color:var(--az-primary);">Create Account</a>
  </div>
</div>

<div id="walletContent" style="display:none;">

  <!-- Balance card -->
  <div class="balance-hero">
    <div class="balance-card">
      <div class="label"><i class="fas fa-wallet"></i> Available Balance</div>
      <div class="amount" id="bigBalance">$0.00</div>
      <div class="sub-row">
        <div class="col">
          <div class="n" id="earnedVal">$0.00</div>
          <div class="l">Total Earned</div>
        </div>
        <div class="col">
          <div class="n" id="spentVal">$0.00</div>
          <div class="l">Total Spent</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="wallet-actions">
    <button class="wallet-action" onclick="openSoon('Withdraw')">
      <i class="fas fa-arrow-up-from-bracket"></i> Withdraw
    </button>
    <button class="wallet-action" onclick="openSoon('Deposit')">
      <i class="fas fa-arrow-down-to-line"></i> Deposit
    </button>
    <a href="offers.html" class="wallet-action">
      <i class="fas fa-gift"></i> Offers
    </a>
  </div>

  <!-- Transactions -->
  <div class="section">
    <div class="section-head">
      <h3>Recent Activity</h3>
      <a href="#" onclick="return false;">See All</a>
    </div>
    <div class="tx-list" id="txList">
      <div class="empty">
        <i class="fas fa-circle-notch fa-spin"></i>
        Loading…
      </div>
    </div>
  </div>

</div>

<!-- Coming soon modal -->
<div class="modal" id="soonModal">
  <div class="modal-box">
    <i class="fas fa-rocket"></i>
    <h3 id="soonTitle">Coming Soon</h3>
    <p>This feature is being built. You'll see it very soon.</p>
    <button onclick="document.getElementById('soonModal').classList.remove('active')">Got it</button>
  </div>
</div>

<script src="auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (typeof authReady !== 'undefined' && authReady) {
      clearInterval(check);
      init();
    }
  }, 100);
});

async function init() {
  if (!currentUser) {
    document.getElementById('authWall').style.display = 'block';
    return;
  }
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('walletContent').style.display = 'block';

  // Refresh wallet + profile from DB
  await loadUserData();

  const w = currentWallet || {};
  document.getElementById('bigBalance').textContent = '$' + Number(w.balance ?? 0).toFixed(2);
  document.getElementById('earnedVal').textContent  = '$' + Number(w.total_earned ?? 0).toFixed(2);
  document.getElementById('spentVal').textContent   = '$' + Number(w.total_spent ?? 0).toFixed(2);

  loadTransactions();
}

async function loadTransactions() {
  const list = document.getElementById('txList');
  try {
    const { data, error } = await supabaseClient
      .from('wallet_transactions')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false })
      .limit(50);

    if (error) throw error;

    if (!data || data.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <i class="fas fa-receipt"></i>
          <h3>No transactions yet</h3>
          <p>Start posting and engaging to earn!</p>
        </div>`;
      return;
    }

    list.innerHTML = data.map(tx => {
      const amount = Number(tx.amount);
      const positive = amount > 0;
      const sign = positive ? '+' : '−';
      const abs = Math.abs(amount).toFixed(2);
      const iconType = tx.type || 'earn';
      const iconMap = {
        earn:     'fa-arrow-down',
        spend:    'fa-arrow-up',
        bonus:    'fa-gift',
        withdraw: 'fa-arrow-up-from-bracket',
        deposit:  'fa-arrow-down-to-line'
      };
      const iconClass = iconMap[iconType] || 'fa-circle';

      return `
        <div class="tx-item">
          <div class="tx-icon ${iconType}">
            <i class="fas ${iconClass}"></i>
          </div>
          <div class="tx-info">
            <div class="label">${tx.source || tx.type || 'Transaction'}</div>
            <div class="sub">${new Date(tx.created_at).toLocaleString()}</div>
          </div>
          <div class="tx-amount ${positive ? 'positive' : 'negative'}">
            ${sign}$${abs}
          </div>
        </div>
      `;
    }).join('');

  } catch (err) {
    list.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Couldn't load</h3><p>${escapeHtml(err.message)}</p></div>`;
  }
}

function openSoon(name) {
  document.getElementById('soonTitle').textContent = name + ' — Coming Soon';
  document.getElementById('soonModal').classList.add('active');
}
</script>
</body>
</html>
